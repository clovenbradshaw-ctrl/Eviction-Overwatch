/* ───────────────────────── Login / decryption ─────────────────────
   ENC: values are Fernet tokens (cryptography.io) produced by the
   Python scraper. Layout, after stripping the "ENC:" prefix and
   base64url-decoding:

     version(1=0x80) || timestamp(8) || iv(16) || ciphertext || hmac(32)

   The 32-byte PBKDF2-HMAC-SHA256 output is split: first 16 bytes =
   HMAC-SHA256 signing key, last 16 bytes = AES-128-CBC encryption key.
   PKCS7 padding is handled automatically by SubtleCrypto's AES-CBC mode.

   The scraper's PBKDF2 params changed across versions, so KEY_CONFIGS
   lists every (salt, iterations) we know and decryptValue tries each:
   Fernet's HMAC identifies which one a given token was sealed with. The
   feed seals defendant fields with salt 'caselink-eviction-scraper' / 480k;
   'caselink-v1' / 100k is kept as a fallback for any legacy tokens.

   The plaintext is held only in memory and never persisted. Closing
   the tab or pressing the Logout button purges the password and the
   cache. */

const PBKDF2_HASH       = 'SHA-256';
// Tried in order; the first whose HMAC verifies wins (current feed config first).
const KEY_CONFIGS = [
  { salt: 'caselink-eviction-scraper', iterations: 480000 },
  { salt: 'caselink-v1',               iterations: 100000 },
];
const FERNET_VERSION    = 0x80;
const FERNET_IV_BYTES   = 16;
const FERNET_HMAC_BYTES = 32;
const FERNET_HEADER_BYTES = 1 + 8 + FERNET_IV_BYTES; // version + ts + iv

let unlockKeyPassword = null;             // raw password held in memory only
const decryptCache    = new Map();        // ENC:... → plaintext | '__FAIL__'
const keyCache        = new Map();        // password → {sign, enc} CryptoKeys
const SENTINEL_FAIL   = '__FAIL__';

function base64UrlToBytes(b64) {
  // Fernet uses urlsafe base64 with '=' padding. atob() needs '+'/'/'.
  let s = b64.replace(/-/g, '+').replace(/_/g, '/');
  const pad = s.length % 4;
  if (pad) s += '='.repeat(4 - pad);
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function deriveFernetKeys(password, cfg) {
  // Cache the promise per (config, password) so parallel callers share one
  // PBKDF2 derivation and we pay each config's cost at most once.
  const cacheKey = `${cfg.iterations}:${cfg.salt}:${password}`;
  let p = keyCache.get(cacheKey);
  if (p) return p;
  p = (async () => {
    const baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password),
      'PBKDF2', false, ['deriveBits']
    );
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: new TextEncoder().encode(cfg.salt),
        iterations: cfg.iterations, hash: PBKDF2_HASH },
      baseKey, 256
    );
    const raw = new Uint8Array(bits);
    const signKey = await crypto.subtle.importKey(
      'raw', raw.slice(0, 16),
      { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']
    );
    const encKey = await crypto.subtle.importKey(
      'raw', raw.slice(16, 32),
      { name: 'AES-CBC', length: 128 }, false, ['decrypt']
    );
    return { sign: signKey, enc: encKey };
  })();
  keyCache.set(cacheKey, p);
  p.catch(() => keyCache.delete(cacheKey));
  return p;
}

function isEncrypted(v) {
  return typeof v === 'string' && v.startsWith('ENC:');
}

async function decryptValue(encStr, password) {
  if (!isEncrypted(encStr)) return encStr;
  if (decryptCache.has(encStr)) {
    const v = decryptCache.get(encStr);
    return v === SENTINEL_FAIL ? null : v;
  }
  try {
    const bytes = base64UrlToBytes(encStr.slice(4));
    if (bytes.length < FERNET_HEADER_BYTES + FERNET_HMAC_BYTES + 16) {
      throw new Error('token too short');
    }
    if (bytes[0] !== FERNET_VERSION) {
      throw new Error('bad version byte');
    }
    const signedLen = bytes.length - FERNET_HMAC_BYTES;
    const signed = bytes.subarray(0, signedLen);
    const mac    = bytes.subarray(signedLen);
    const iv     = bytes.subarray(9, 9 + FERNET_IV_BYTES);
    const ct     = bytes.subarray(FERNET_HEADER_BYTES, signedLen);

    // Try each known key config; the HMAC verify identifies the right one.
    for (const cfg of KEY_CONFIGS) {
      const { sign, enc } = await deriveFernetKeys(password, cfg);
      const ok = await crypto.subtle.verify({ name: 'HMAC' }, sign, mac, signed);
      if (!ok) continue;
      const pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, enc, ct);
      const out = new TextDecoder().decode(pt);
      decryptCache.set(encStr, out);
      return out;
    }
    throw new Error('no key config verified');
  } catch (e) {
    decryptCache.set(encStr, SENTINEL_FAIL);
    return null;
  }
}

function isUnlocked() { return unlockKeyPassword != null; }

function firstEncryptedValue() {
  for (const r of allRows) {
    for (const k in r) if (isEncrypted(r[k])) return r[k];
  }
  return null;
}

function updateLoginButton() {
  const btn = document.getElementById('login-btn');
  if (isUnlocked()) {
    btn.textContent = 'Logout';
    btn.classList.add('unlocked');
  } else {
    btn.textContent = 'Login';
    btn.classList.remove('unlocked');
  }
}

function onLoginButtonClick() {
  if (isUnlocked()) { logout(); return; }
  openLoginModal();
}

function openLoginModal() {
  const modal = document.getElementById('login-modal');
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-submit').disabled = false;
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('login-password').focus(), 0);
}

function closeLoginModal() {
  document.getElementById('login-modal').style.display = 'none';
}

async function submitLogin() {
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit');
  if (!password) { errEl.textContent = 'Enter a password.'; return; }

  const probe = firstEncryptedValue();
  if (!probe) {
    // Nothing encrypted to verify against — accept and move on.
    unlockKeyPassword = password;
    closeLoginModal();
    updateLoginButton();
    return;
  }

  errEl.textContent = 'Checking…';
  submitBtn.disabled = true;
  try {
    // Don't pollute the cache with a possibly-wrong attempt.
    decryptCache.delete(probe);
    const result = await decryptValue(probe, password);
    if (result == null) {
      decryptCache.delete(probe);
      errEl.textContent = 'Invalid password.';
      submitBtn.disabled = false;
      return;
    }
    unlockKeyPassword = password;
    closeLoginModal();
    updateLoginButton();
    if (selectedRecordDocket) renderRecordPanel(selectedRecordDocket);
  } catch (e) {
    errEl.textContent = 'Decryption error: ' + e.message;
    submitBtn.disabled = false;
  }
}

function logout() {
  unlockKeyPassword = null;
  decryptCache.clear();
  keyCache.clear();
  updateLoginButton();
  if (selectedRecordDocket) renderRecordPanel(selectedRecordDocket);
}

/* ───────────────────────── Feed refetch ─────────────────────────
   The feed is a full snapshot, so "updates" are just a periodic refetch that
   replaces the local set wholesale (see refetchSnapshot). */

function startFeedRefetch() {
  if (feedRefetchHandle) clearInterval(feedRefetchHandle);
  feedRefetchHandle = setInterval(refetchSnapshot, FEED_REFETCH_MS);
}

/* ───────────────────────── Districts view + profile ───────────────────────── */

// Aggregate everything we want to show per council district from allRows.
// Done on every render so it picks up new cases without a separate cache.
function aggregateDistricts() {
  const out = {};
  for (const r of allRows) {
    const d = r.council_district;
    if (!d) continue;
    if (!out[d]) {
      out[d] = {
        district: d,
        key: normalizeDistrict(d),
        rep: r.council_rep || '',
        cases: 0, pending: 0, dismissed: 0, other: 0,
        tracts: new Set(),
        plaintiffs: {}, attorneys: {},
        rows: [],
        months: {},
      };
    }
    const a = out[d];
    a.cases++;
    if (r.status === 'PENDING') a.pending++;
    else if (r.status === 'DISMISSED' || r.status === 'NONSUIT') a.dismissed++;
    else a.other++;
    if (r.census_geoid) a.tracts.add(String(r.census_geoid));
    if (r.Plaintiff_1) a.plaintiffs[r.Plaintiff_1] = (a.plaintiffs[r.Plaintiff_1] || 0) + 1;
    if (r.Attorney && r.Attorney !== ', PRS') a.attorneys[r.Attorney] = (a.attorneys[r.Attorney] || 0) + 1;
    a.rows.push(r);
    const m = caseFileDateToMonth(r.file_date);
    if (m) a.months[m] = (a.months[m] || 0) + 1;
  }
  return out;
}

function sparklineHtml(monthsMap, recentMonths) {
  const counts = recentMonths.map(m => monthsMap[m] || 0);
  const max = Math.max(1, ...counts);
  return `<span class="spark">` + counts.map(c =>
    `<span style="height:${Math.max(1, (c / max) * 16)}px"></span>`
  ).join('') + `</span>`;
}

/* ───────────────────────── Live tab — scraper SSE feed ─────────────────────────
   Subscribes to the n8n live stream (paired with the /live/publish sink the
   scraper posts to) and renders it as a terminal feed. Every line is parsed
   for a leading timestamp + status marker so raw log noise (source filenames,
   double spaces) doesn't show; defendant names are redacted unconditionally,
   independent of the case-table unlock state, since this is an unvetted
   raw feed. */

const LIVE_URL = 'https://n8n.intelechia.com/live/stream';
const LIVE_MAX_LINES = 500;
const LIVE_RECONNECT_MS = 4000;

let liveSource = null;
let liveEventCount = 0;
let liveStarted = false;
let liveReconnectTimer = null;

const LIVE_TIMESTAMP_RE = /^(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s*(.*)$/;
const LIVE_DOCKET_RE = /\b(\d{2}[A-Z]{2}\d{3,8})\b/g;

// Redact anything that looks like a defendant name mention. Deliberately
// broad/over-inclusive: any capitalized run of 2+ words appearing after the
// word "defendant" on the same line gets blanked, since a false positive
// (over-redacting) is the safe failure mode here — a missed name is not.
function redactDefendantNames(text) {
  if (!text || !/defendant/i.test(text)) return text;
  return text.replace(
    /\bdefendants?\b((?:[^A-Za-z0-9\n]|is|was|named|address|for)*[:=]?\s*)([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+){1,4})/g,
    (m, sep, name) => m.slice(0, m.length - name.length) + '█'.repeat(Math.min(Math.max(name.length, 6), 16))
  );
}

function liveEsc(s) { return escapeHtmlSafe(String(s == null ? '' : s)); }

// Turn a raw log line into { time, marker, body } — no more "source":
// "caselink-error.log" noise, no more double-spaced raw text.
// Fallback for double-escaped unicode (e.g. a literal "✓" surviving
// JSON.parse because it was escaped twice upstream) — decode any remaining
// \uXXXX sequences to real characters before display.
function decodeUnicodeEscapes(s) {
  return String(s || '').replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
}

function formatLiveLogLine(raw) {
  let line = decodeUnicodeEscapes(String(raw || '')).replace(/\s+/g, ' ').trim();
  let time = '';
  const m = line.match(LIVE_TIMESTAMP_RE);
  if (m) { time = m[1].slice(11); line = m[2].trim(); }
  if (!line) return null;

  line = redactDefendantNames(line);
  line = liveEsc(line).replace(LIVE_DOCKET_RE, '<span class="src">$1</span>');

  let marker = '·', markerClass = '';
  if (/^={5,}$/.test(line.replace(/<[^>]+>/g, ''))) {
    return { time, marker: '', markerClass: '', body: '<span class="src">' + '─'.repeat(40) + '</span>' };
  }
  if (/^✓|success|logged? in|clicked|found/i.test(line)) { marker = '✓'; markerClass = 'ok'; }
  else if (/error|fail|not found|no .* found/i.test(line)) { marker = '✗'; markerClass = 'redacted'; }
  else if (/logging in|extracting|geocoding|looking for/i.test(line)) { marker = '›'; }

  return { time, marker, markerClass, body: line };
}

function liveLineHtml(evt) {
  let payload;
  try { payload = JSON.parse(evt); } catch { payload = { type: 'raw', line: evt }; }

  if (payload.type === 'log') {
    const f = formatLiveLogLine(payload.line);
    if (!f) return '';
    const timeHtml = f.time ? `<span class="ts">${liveEsc(f.time)}</span> ` : '';
    const markerHtml = f.marker ? `<span class="${f.markerClass}">${f.marker}</span> ` : '  ';
    return `<div class="live-line">${timeHtml}${markerHtml}${f.body}</div>`;
  }

  if (payload.type === 'test') {
    const addr = liveEsc(payload.address || '');
    return `<div class="live-line"><span class="src">[test event]</span> address: ${addr}</div>`;
  }

  // Unknown payload shape — still redact defendant-looking fields before showing it.
  const safe = {};
  for (const [k, v] of Object.entries(payload)) {
    safe[k] = typeof v === 'string' && /defendant/i.test(k) ? '[redacted]' : v;
  }
  return `<div class="live-line"><span class="src">[${liveEsc(payload.type || 'event')}]</span> ${liveEsc(redactDefendantNames(JSON.stringify(safe)))}</div>`;
}

function liveSetStatus(text, isErr) {
  const el = document.getElementById('live-status');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
  const dot = document.getElementById('live-dot');
  if (dot) dot.classList.toggle('on', !isErr);
}

function liveAppend(html) {
  if (!html) return;
  const screen = document.getElementById('live-screen');
  if (!screen) return;
  const empty = screen.querySelector('.live-empty');
  if (empty) empty.remove();
  const atTop = screen.scrollTop < 40;
  screen.insertAdjacentHTML('afterbegin', html);
  while (screen.children.length > LIVE_MAX_LINES) screen.removeChild(screen.lastChild);
  if (atTop) screen.scrollTop = 0;
  liveEventCount++;
  const meta = document.getElementById('live-meta');
  if (meta) meta.textContent = `${liveEventCount} event${liveEventCount === 1 ? '' : 's'}`;
}

const LIVE_CONNECT_TIMEOUT_MS = 8000;
let liveConnectTimeoutTimer = null;

function liveRetry() {
  clearTimeout(liveConnectTimeoutTimer);
  if (liveSource) { liveSource.close(); liveSource = null; }
  clearTimeout(liveReconnectTimer);
  liveReconnectTimer = setTimeout(connectLiveFeed, LIVE_RECONNECT_MS);
}

function connectLiveFeed() {
  if (liveSource) return;
  if (!('EventSource' in window)) { liveSetStatus('unsupported browser', true); return; }
  liveSetStatus('connecting…');
  liveSource = new EventSource(LIVE_URL);
  clearTimeout(liveConnectTimeoutTimer);
  liveConnectTimeoutTimer = setTimeout(() => {
    if (liveSource && liveSource.readyState !== EventSource.OPEN) {
      liveSetStatus('connection blocked or timed out — check ad-blocker/shields, retrying…', true);
      liveRetry();
    }
  }, LIVE_CONNECT_TIMEOUT_MS);
  liveSource.onopen = () => {
    clearTimeout(liveConnectTimeoutTimer);
    liveSetStatus('connected — watching scraper');
  };
  liveSource.onmessage = (e) => liveAppend(liveLineHtml(e.data));
  liveSource.onerror = () => {
    liveSetStatus('disconnected — retrying…', true);
    liveRetry();
  };
}

function renderLiveView() {
  if (liveStarted) return;
  liveStarted = true;
  connectLiveFeed();
}

function disconnectLiveFeed() {
  clearTimeout(liveReconnectTimer);
  clearTimeout(liveConnectTimeoutTimer);
  if (liveSource) { liveSource.close(); liveSource = null; }
  liveStarted = false;
  liveSetStatus('disconnected');
}

function renderDistrictsView() {
  const root = document.getElementById('districts-view');
  const byD = aggregateDistricts();
  const rows = Object.values(byD).sort((a, b) => {
    const an = parseInt(a.key, 10), bn = parseInt(b.key, 10);
    if (!isNaN(an) && !isNaN(bn)) return an - bn;
    return a.district.localeCompare(b.district);
  });

  if (!rows.length) {
    root.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted)">No council district data in current cases.</div>`;
    return;
  }

  const recent = agg.localMonths.slice(-12);

  const princetonTotalFor = key => {
    const m = agg.princetonDistrict[key];
    if (!m) return null;
    let t = 0;
    for (const v of Object.values(m)) t += v;
    return t;
  };

  const scrapedRange   = formatMonthRange(agg.localMonths);
  const princetonRange = formatMonthRange(agg.princetonMonths);
  const scrapedSuffix   = scrapedRange   ? ` ${scrapedRange}`   : '';
  const princetonSuffix = princetonRange ? ` ${princetonRange}` : '';

  let html = `<div class="districts-source-note" title="${escapeAttr(`Scraped = current per-case court records (one row per docket). Princeton = aggregated monthly filing totals${princetonSuffix ? ' (' + princetonRange + ')' : ''} (no dockets). Same kind of evictions counted two different ways, in different time windows — never sum the two columns. ` + SRC_SCRAPED + ' ' + SRC_PRINCETON)}">
    <strong>Cases (Scraped${scrapedSuffix})</strong> and <strong>Filings (Princeton${princetonSuffix})</strong> are <strong>two independent counts of the same kind of evictions</strong> — different sources, different time windows. <strong>Do not add them.</strong>
  </div>
  <table><thead><tr>
    <th title="Metro Nashville council district. ${escapeAttr(SRC_GEOCODED)}">District</th>
    <th title="Council member for the district. ${escapeAttr(SRC_GEOCODED)}">Council Rep</th>
    <th class="num" title="Total cases in the scraped court records${scrapedRange ? ' (' + scrapedRange + ')' : ''}. Independent count from Princeton — do not sum. ${escapeAttr(SRC_SCRAPED)}">Cases (Scraped${scrapedSuffix})</th>
    <th class="num" title="Total filings from Princeton Eviction Lab CSV, summed across all available months${princetonRange ? ' (' + princetonRange + ')' : ''}. Independent count from Scraped — do not sum. ${escapeAttr(SRC_PRINCETON)}">Filings (Princeton${princetonSuffix})</th>
    <th class="num" title="Cases currently in PENDING status. ${escapeAttr(SRC_SCRAPED)}">Pending</th>
    <th class="num" title="Cases with DISMISSED or NONSUIT status. ${escapeAttr(SRC_SCRAPED)}">Dismissed</th>
    <th class="num" title="Distinct census tracts touched by scraped cases in this district. ${escapeAttr(SRC_DERIVED)}">Tracts</th>
    <th title="Sparkline of monthly case counts over the last 12 months. ${escapeAttr(SRC_SCRAPED)}">Last 12 months</th>
  </tr></thead><tbody>`;
  for (const a of rows) {
    const pTot = princetonTotalFor(a.key);
    html += `<tr onclick="showDistrictProfile('${a.district.replace(/'/g, "\\'")}')">`
      + `<td class="district-label" title="${escapeAttr(SRC_GEOCODED)}">${shorten(a.district, 'Council District ')}</td>`
      + `<td class="rep" title="${escapeAttr(SRC_GEOCODED)}">${escapeHtmlSafe(a.rep) || '—'}</td>`
      + `<td class="num" title="Scraped count. ${escapeAttr(SRC_SCRAPED)}">${a.cases}</td>`
      + `<td class="num" title="${pTot == null ? 'No Princeton data for this district yet (fetch may still be pending).' : `Princeton${princetonSuffix} total. ` + escapeAttr(SRC_PRINCETON)}">${pTot == null ? '—' : pTot.toLocaleString()}</td>`
      + `<td class="num" title="Pending count from scraped status. ${escapeAttr(SRC_SCRAPED)}">${a.pending}</td>`
      + `<td class="num" title="Dismissed/Nonsuit count from scraped status. ${escapeAttr(SRC_SCRAPED)}">${a.dismissed}</td>`
      + `<td class="num" title="Distinct census tracts in scraped cases. ${escapeAttr(SRC_DERIVED)}">${a.tracts.size}</td>`
      + `<td title="Scraped monthly counts, last 12 months. ${escapeAttr(SRC_SCRAPED)}">${recent.length ? sparklineHtml(a.months, recent) : '—'}</td>`
      + `</tr>`;
  }
  html += `</tbody></table>`;
  root.innerHTML = html;
}

function escapeHtmlSafe(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function showDistrictProfile(district) {
  const byD = aggregateDistricts();
  const a = byD[district];
  if (!a) return;

  const topList = (obj, n) => Object.entries(obj).sort((x, y) => y[1] - x[1]).slice(0, n);
  const topPlaintiffs = topList(a.plaintiffs, 5);
  const topAttorneys  = topList(a.attorneys, 5);

  const tractCounts = {};
  for (const r of a.rows) {
    if (r.census_geoid) {
      const g = String(r.census_geoid);
      tractCounts[g] = (tractCounts[g] || 0) + 1;
    }
  }
  const topTracts = Object.entries(tractCounts).sort((x, y) => y[1] - x[1]);

  const parseDate = v => {
    const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m ? new Date(+m[3], +m[1] - 1, +m[2]).getTime() : 0;
  };
  const recentCases = [...a.rows].sort((x, y) => parseDate(y.file_date) - parseDate(x.file_date)).slice(0, 10);

  const monthKeys = sortMonthsAsc(Object.keys(a.months));
  const maxMonth = Math.max(1, ...monthKeys.map(m => a.months[m]));

  const esc = escapeHtmlSafe;

  const districtKey = normalizeDistrict(a.district);
  const mss = districtKey ? agg.districtDemographics[districtKey] : null;
  const county = agg.countyTotals;

  // Princeton total filings (2020–21) for this district, if loaded.
  const princetonMap = districtKey ? agg.princetonDistrict[districtKey] : null;
  let princetonTotal = null;
  if (princetonMap) {
    princetonTotal = 0;
    for (const v of Object.values(princetonMap)) princetonTotal += v;
  }
  const princetonStatus = sources.princeton.status;

  // MSS-derived district context: income, poverty, housing cost burden,
  // employment.
  let demoSection = '';
  if (mss) {
    const fmtUsd = n => n != null ? '$' + Math.round(n).toLocaleString() : '—';
    const fmtPct = n => n != null ? n.toFixed(1) + '%' : '—';
    const fmtNum = n => n != null ? n.toLocaleString() : '—';
    const cmpUsd = d => (d >= 0 ? '+$' : '−$') + Math.abs(Math.round(d)).toLocaleString();
    const cmpPct = d => (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1) + ' pp';
    const cmp = (val, ref, fmtCmp, higherIsWorse=true) => {
      if (val == null || ref == null) return '';
      const diff = val - ref;
      const cls = (diff === 0) ? '' : ((diff > 0) === higherIsWorse ? 'worse' : 'better');
      return `<div class="compare ${cls}">${fmtCmp(diff)} vs county</div>`;
    };
    const rb = mss.housing && mss.housing.pct_renter_cost_burdened_35plus;
    const ob = mss.housing && mss.housing.pct_owner_cost_burdened_35plus;
    const rbCls = rb != null && rb >= 40 ? ' class="high"' : '';
    const obCls = ob != null && ob >= 40 ? ' class="high"' : '';

    demoSection = `
      <div class="profile-section">
        <h3 title="${esc(SRC_MSS)}">District Demographics</h3>
        <div class="demo-grid">
          <div class="demo-cell" title="Total district population. ${esc(SRC_MSS)}">
            <div class="label">Population</div>
            <div class="value">${fmtNum(mss.population)}</div>
          </div>
          <div class="demo-cell" title="Median household income for the district. ${esc(SRC_MSS)}">
            <div class="label">Median HH income</div>
            <div class="value">${fmtUsd(mss.income && mss.income.median_household_income)}</div>
            ${county ? cmp(mss.income && mss.income.median_household_income, county.median_household_income, cmpUsd, false) : ''}
          </div>
          <div class="demo-cell" title="Median gross monthly rent in the district. ${esc(SRC_MSS)}">
            <div class="label">Median monthly rent</div>
            <div class="value">${fmtUsd(mss.housing && mss.housing.median_monthly_rent)}</div>
            ${county ? cmp(mss.housing && mss.housing.median_monthly_rent, county.median_monthly_rent, cmpUsd, true) : ''}
          </div>
          <div class="demo-cell" title="Total housing units in the district. ${esc(SRC_MSS)}">
            <div class="label">Housing units</div>
            <div class="value">${fmtNum(mss.housing && mss.housing.total_housing_units)}</div>
            <div class="compare">${fmtPct(mss.housing && mss.housing.pct_occupied)} occupied</div>
          </div>
          <div class="demo-cell" title="Share of district population below the federal poverty line. ${esc(SRC_MSS)}">
            <div class="label">Poverty rate</div>
            <div class="value">${fmtPct(mss.poverty && mss.poverty.pct_total_poverty)}</div>
            ${county ? cmp(mss.poverty && mss.poverty.pct_total_poverty, county.poverty_rate_percent, cmpPct, true) : ''}
          </div>
          <div class="demo-cell" title="Share of children below the federal poverty line. ${esc(SRC_MSS)}">
            <div class="label">Child poverty</div>
            <div class="value">${fmtPct(mss.poverty && mss.poverty.pct_child_poverty)}</div>
          </div>
          <div class="demo-cell" title="Unemployment rate in the district. ${esc(SRC_MSS)}">

          </div>
        </div>

            <div class="label-cell">Renters paying 35%+ of income</div>

            <div class="num-cell">${fmtPct(rb)}</div>
          </div>
          <div class="demo-bar-row" title="Share of owners paying 35% or more of household income on housing. ${esc(SRC_MSS)}">
            <div class="label-cell">Owners paying 35%+ of income</div>
            <div class="bar-cell"><div${obCls} style="width:${ob != null ? Math.min(100, ob) : 0}%"></div></div>
            <div class="num-cell">${fmtPct(ob)}</div>
          </div>
        </div>
        <div class="race-source-note">
          Source: <a href="${esc(sources.mss.url)}" target="_blank" rel="noopener">Metro Social Services, Know Your Community 2026</a>.
          Population is from ACS 2023; income, poverty, housing, employment and age are from ACS 2017–2021
          (post-2021 council boundaries) pending the 2026 refresh.
          County comparison shown where available — red means worse-than-county on this measure.
        </div>
      </div>`;
  } else if (sources.mss.status === 'pending') {
    demoSection = `<div class="profile-section"><h3>District Demographics</h3><div class="profile-empty">Fetching MSS district demographics…</div></div>`;
  } else if (sources.mss.status === 'failed') {

  }

    const row = (label, p, note) => `<div class="race-row" title="${esc((note ? note + ' ' : '') + SRC_MSS)}">
      <div class="label-cell">${label}</div>

    raceSection = `<div class="profile-section">
      <h3 title="${esc(SRC_MSS)}">Race &amp; Ethnicity (district population)</h3>
      <div class="race-bars">
        ${row('White', re.pct_white, 'Share of population identifying as White alone.')}
        ${row('Black or African American', re.pct_black, 'Share of population identifying as Black or African American alone.')}
        ${row('Asian', re.pct_asian, 'Share of population identifying as Asian alone.')}
        ${row('Two or more races', re.pct_two_or_more, 'Share of population identifying with two or more races.')}
        <div class="race-overlap"></div>
        ${row('Hispanic or Latino (any race)', re.pct_hispanic, 'Hispanic/Latino ethnicity — overlaps the race categories above.')}
      </div>
      <div class="race-source-note">
        Total population: <strong>${pop.toLocaleString()}</strong>. Counts approximated as population × percentage.
        Source: <a href="${esc(sources.mss.url)}" target="_blank" rel="noopener">Metro Social Services, Know Your Community 2026</a> (ACS 2023 5-year estimates, table DP05).

    const msg = s === 'pending' ? 'Fetching MSS district demographics…'

              <h3 title="${esc('Top plaintiff attorneys by case count, excluding pro se. ' + SRC_SCRAPED)}">Top Attorneys</h3>
              ${topAttorneys.length ? `<ul class="profile-list">${topAttorneys.map(([n, c]) =>
                `<li title="${esc('Attorney with ' + c + ' case(s) in this district. ' + SRC_SCRAPED)}"><span>${esc(n.split(',')[0])}</span><span class="count">${c}</span></li>`).join('')}</ul>`
                : '<div class="profile-empty">No attorney data (all pro se).</div>'}
            </div>
          </div>

          ${topTracts.length ? `
          <div class="profile-section">
            <h3 title="${esc('Census tracts that contain scraped cases for this district. Tract names from ' + SRC_TIGER)}">Census Tracts</h3>
            <ul class="profile-list">${topTracts.map(([g, c]) => {
              const info = agg.tractInfo[g];
              const name = info && info.name ? info.name : `Tract ${g}`;
              return `<li title="${esc('Tract ' + g + ': ' + c + ' scraped case(s). ' + SRC_GEOCODED)}"><span>${esc(name)}</span><span class="count">${c}</span></li>`;
            }).join('')}</ul>
          </div>` : ''}

          ${raceSection}

          <div class="profile-section">
            <h3 title="${esc('Most recent scraped cases in this district. ' + SRC_SCRAPED)}">Recent Cases</h3>
            <table class="profile-cases" style="width:100%">
              <thead>
                <tr style="text-align:left;color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:0.08em">
                  <th style="padding:4px 8px" title="${esc('Court docket number. ' + SRC_SCRAPED)}">Docket</th>
                  <th style="padding:4px 8px" title="${esc('Date the case was filed. ' + SRC_SCRAPED)}">Filed</th>
                  <th style="padding:4px 8px" title="${esc('Current case status. ' + SRC_SCRAPED)}">Status</th>
                  <th style="padding:4px 8px" title="${esc('Primary plaintiff. ' + SRC_SCRAPED)}">Plaintiff</th>
                  <th style="padding:4px 8px" title="${esc('Defendant address. ' + SRC_SCRAPED)}">Address</th>
                </tr>
              </thead>
              <tbody>
              ${recentCases.map(r => {
                const st = r.status || '';
                const dotClass = st === 'PENDING' ? 'dot-pending'
                  : (st === 'DISMISSED' || st === 'NONSUIT') ? 'dot-dismissed' : 'dot-other';
                const safeDocket = String(r.docket || '').replace(/'/g, "\\'");
                return `<tr style="cursor:pointer" onclick="closeDistrictProfile(); openRecordPanel('${safeDocket}')">
                  <td style="padding:5px 8px;font-size:11px;color:var(--gold)">${esc(r.docket || '')}</td>
                  <td style="padding:5px 8px;font-size:11px">${esc(r.file_date || '')}</td>
                  <td style="padding:5px 8px;font-size:11px"><span class="dot ${dotClass}"></span>${esc(st)}</td>
                  <td style="padding:5px 8px;font-size:11px">${esc(r.Plaintiff_1 || '')}</td>
                  <td style="padding:5px 8px;font-size:11px">${esc(r.address_formatted || '')}</td>
                </tr>`;
              }).join('')}
            </tbody></table>
          </div>

          <div class="profile-section" style="margin-bottom:0">
            <button class="filter-btn" style="cursor:pointer" onclick="filterCasesByDistrict('${a.district.replace(/'/g, "\\'")}')">View all ${a.cases} cases in Cases tab →</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const wrap = document.createElement('div');
  wrap.innerHTML = profileHtml;
  document.body.appendChild(wrap.firstElementChild);
  document.addEventListener('keydown', escCloseDistrictProfile);
}

function closeDistrictProfile() {
  const m = document.getElementById('district-modal');
  if (m) m.remove();
  document.removeEventListener('keydown', escCloseDistrictProfile);
}

function escCloseDistrictProfile(e) {
  if (e.key === 'Escape') closeDistrictProfile();
}

function filterCasesByDistrict(d) {
  closeDistrictProfile();
  filters.council_district = d;
  viewMode = 'cases';
  document.querySelectorAll('#view-seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.val === 'cases'));
  updateFilterBtns();
  render();
}

/* ───────────────────────── Dispatch ───────────────────────── */

function setVisibility() {
  const isCases     = viewMode === 'cases';
  const isDistricts = viewMode === 'districts';
  const isTimeline  = viewMode === 'timeline';
  const isCoverage  = viewMode === 'coverage';
  const isMap       = viewMode === 'map';
  const isSources   = viewMode === 'sources';
  const isLive      = viewMode === 'live';
  document.getElementById('local-toolbar').style.display      = isCases     ? '' : 'none';
  document.getElementById('table-header').style.display       = isCases     ? '' : 'none';
  document.getElementById('local-table-wrap').style.display   = isCases     ? '' : 'none';
  document.getElementById('districts-view').style.display     = isDistricts ? '' : 'none';
  document.getElementById('timeline-view').style.display      = isTimeline  ? '' : 'none';
  document.getElementById('grid-view').style.display          = isCoverage  ? '' : 'none';
  document.getElementById('map-view').style.display           = isMap       ? '' : 'none';
  document.getElementById('sources-view').style.display       = isSources   ? '' : 'none';
  document.getElementById('live-view').style.display          = isLive      ? '' : 'none';
  document.getElementById('timeline-district-group').style.display = isTimeline ? '' : 'none';
  document.getElementById('coverage-mode-group').style.display = isCoverage ? '' : 'none';
  document.getElementById('coverage-dir-group').style.display  = isCoverage ? '' : 'none';
  document.getElementById('map-source-group').style.display    = isMap      ? '' : 'none';
  document.getElementById('map-mode-group').style.display      = isMap      ? '' : 'none';
}

function render() {
  setVisibility();
  if (viewMode === 'live') {
    renderLiveView();
  } else {
    disconnectLiveFeed();
  }
  if (viewMode === 'cases') {
    renderLocalTable();
  } else if (viewMode === 'districts') {
    renderDistrictsView();
  } else if (viewMode === 'timeline') {
    renderTimelineView();
  } else if (viewMode === 'coverage') {
    renderCoverageGrid();
  } else if (viewMode === 'map') {
    renderMapView();
  } else if (viewMode === 'sources') {
    renderProvenance();
  }
  updateCoverageHeadline();
}

function bindRowClicks() {
  document.getElementById('tbody').addEventListener('click', (e) => {
    const tr = e.target.closest('tr');
    if (!tr || !tr.dataset.docket) return;
    openRecordPanel(tr.dataset.docket);
  });
}

function bindViewControls() {
  document.querySelectorAll('#view-seg button').forEach(b => {
    b.addEventListener('click', () => {
      viewMode = b.dataset.val;
      document.querySelectorAll('#view-seg button').forEach(x => x.classList.toggle('on', x === b));
      render();
    });
  });
  document.querySelectorAll('#coverage-mode-seg button').forEach(b => {
    b.addEventListener('click', () => {
      coverageMode = b.dataset.val;
      document.querySelectorAll('#coverage-mode-seg button').forEach(x => x.classList.toggle('on', x === b));
      if (viewMode === 'coverage') render();
    });
  });
  document.querySelectorAll('#coverage-dir-seg button').forEach(b => {
    b.addEventListener('click', () => {
      coverageDir = b.dataset.val;
      document.querySelectorAll('#coverage-dir-seg button').forEach(x => x.classList.toggle('on', x === b));
      if (viewMode === 'coverage') render();
    });
  });
  const tdSel = document.getElementById('timeline-district-select');
  if (tdSel) {
    tdSel.addEventListener('change', () => {
      timelineDistrict = tdSel.value || 'all';
      if (viewMode === 'timeline') render();
    });
  }
  document.querySelectorAll('#map-source-seg button').forEach(b => {
    b.addEventListener('click', () => {
      mapSource = b.dataset.val;
      document.querySelectorAll('#map-source-seg button').forEach(x => x.classList.toggle('on', x === b));
      if (viewMode === 'map') {
        syncMapControls();
        updateMapColors();
      }
    });
  });
  document.querySelectorAll('#map-mode-seg button').forEach(b => {
    b.addEventListener('click', () => {
      mapMode = b.dataset.val;
      document.querySelectorAll('#map-mode-seg button').forEach(x => x.classList.toggle('on', x === b));
      if (viewMode === 'map') {
        syncMapControls();
        updateMapColors();
      }
    });
  });
}

/* ───────────────────────── Princeton CSV fetch ─────────────────────────
   Fetched once per session direct from evictionlab.org through the n8n CORS
   proxy. Nothing is persisted — no GitHub round-trip, no snapshot file, no
   tract→district library. Every case in cases.json already carries its own
   GEOID + council_district, so the comparison is apples-to-apples in memory. */

const N8N_PROXY     = 'https://n8n.intelechia.com/webhook/feed';
const PRINCETON_CSV = 'https://evictionlab.org/uploads/nashville_monthly_2020_2021.csv';

function bgStatus(msg, active=false) {
  const el = document.getElementById('bg-sync');
  el.textContent = msg || '';
  el.classList.toggle('active', active);
}

function pxProxy(url) { return `${N8N_PROXY}?url=${encodeURIComponent(url)}`; }

async function fetchPrincetonCsvRows() {
  const r = await fetch(pxProxy(PRINCETON_CSV));
  if (!r.ok) throw new Error(`csv HTTP ${r.status}`);
  const text = await r.text();
  await loadScript(PAPAPARSE_URL);
  const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, dynamicTyping: true });
  return parsed.data.filter(r => r.GEOID && r.month);
}

function refreshSnapshotUi() {
  updateCoverageHeadline();
  updateSubtitle();
  if (viewMode !== 'cases') render();
}

// Princeton CSV is static historical filings — revalidate at most weekly.
const PRINCETON_TTL_MS = 7 * 24 * 60 * 60 * 1000;

async function kickBackgroundSync() {
  let usedCache = false;
  try {
    const cached = await localCache.get(CACHE_FILES.princeton);
    if (cached && Array.isArray(cached.rows)) {
      princetonRows = cached.rows;
      rebuildPrincetonAggregates();
      markSource('princeton', { status: 'ok', rows: princetonRows.length, fromCache: true });
      refreshSnapshotUi();
      usedCache = true;
      if (Date.now() - (cached.savedAt || 0) < PRINCETON_TTL_MS) return;
    }

    bgStatus('Fetching Princeton CSV…', true);
    const rows = await fetchPrincetonCsvRows();
    princetonRows = rows;
    rebuildPrincetonAggregates();
    markSource('princeton', { status: 'ok', rows: rows.length });
    console.info(`[eo] princeton csv: ${rows.length} rows · ${agg.princetonMonths.length} months`);
    refreshSnapshotUi();
    localCache.put(CACHE_FILES.princeton, { rows });
    bgStatus(`Princeton: ${rows.length} rows loaded (live)`, false);
    setTimeout(() => bgStatus(''), 3000);
  } catch (e) {
    console.warn('Princeton CSV fetch failed:', e);
    if (!usedCache) markSource('princeton', { status: 'failed', error: e.message });
    bgStatus(`Princeton fetch failed: ${e.message}`, false);
    setTimeout(() => bgStatus(''), 5000);
  }
}

/* ───────────────────────── CSV export ─────────────────────────
   Two scopes: 'filtered' (current search + filters) and 'all'.
   ENC: fields are decrypted when unlocked, otherwise emitted as empty.
   Decryption runs concurrently across all rows for one cell key at a time. */

let exportInFlight = false;

function toggleExportMenu() {
  const menu = document.getElementById('export-menu');
  if (menu.style.display !== 'none') { menu.style.display = 'none'; return; }
  const filtered = getFiltered().length;
  const total = allRows.length;
  const redactedNote = isUnlocked()
    ? 'Logged in — encrypted fields will be decrypted.'
    : 'Not logged in — encrypted fields will be blank.';
  menu.innerHTML = `
    <div class="item" onclick="runExport('filtered')">
      <span>Filtered cases</span><span class="count">${filtered}</span>
    </div>
    <div class="item" onclick="runExport('all')">
      <span>All cases</span><span class="count">${total}</span>
    </div>
    <div class="note">${redactedNote}</div>`;
  menu.style.display = 'block';
}

function closeExportMenu() {
  document.getElementById('export-menu').style.display = 'none';
}

async function runExport(scope) {
  if (exportInFlight) return;
  closeExportMenu();
  const btn = document.getElementById('export-btn');
  exportInFlight = true;
  btn.disabled = true;
  btn.textContent = 'Exporting…';
  try {
    const rows = scope === 'filtered' ? getFiltered() : allRows;
    const csv = await buildCsv(rows);
    const stamp = new Date().toISOString().slice(0, 10);
    const suffix = isUnlocked() ? '' : '-redacted';
    downloadCsv(csv, `eviction-cases-${scope}-${stamp}${suffix}.csv`);
  } catch (e) {
    console.warn('[eo] export failed:', e);
    alert('Export failed: ' + e.message);
  } finally {
    exportInFlight = false;
    btn.disabled = false;
    btn.textContent = 'Export ▾';
  }
}

async function buildCsv(rows) {
  // PapaParse is lazy-loaded; ensure it's available before unparse().
  await loadScript(PAPAPARSE_URL);
  // Union of all keys across rows. 'docket' first, then the priority fields
  // that already drive the record panel, then everything else alphabetically.
  const keySet = new Set();
  for (const r of rows) for (const k of Object.keys(r)) keySet.add(k);
  const PRIORITY = [
    'docket', 'status', 'file_date', 'Plaintiff_1', 'Attorney',
    'address_formatted', 'council_district', 'council_rep',
    'state_house_district', 'us_congressional_district',
    'census_geoid', 'census_name',
  ];
  const cols = [];
  const seen = new Set();
  for (const k of PRIORITY) if (keySet.has(k)) { cols.push(k); seen.add(k); }
  for (const k of [...keySet].sort()) {
    if (k === 'judgment_bucket') continue;
    if (!seen.has(k)) cols.push(k);
  }

  const unlocked = isUnlocked();
  const out = new Array(rows.length);
  for (let i = 0; i < rows.length; i++) out[i] = {};

  // Resolve cell values per column. ENC: cells in the same column get
  // decrypted in parallel; plain cells fill in synchronously.
  for (const k of cols) {
    // Belt-and-suspenders: defendant fields are already encrypted in the
    // source, but if a plaintext defendant column ever shows up we still
    // refuse to leak it without a login.
    const forceBlank = !unlocked && /^defendant/i.test(k);
    const encJobs = [];
    for (let i = 0; i < rows.length; i++) {
      const v = rows[i][k];
      if (forceBlank) { out[i][k] = ''; continue; }
      if (v == null || v === '') { out[i][k] = ''; continue; }
      if (isEncrypted(v)) {
        if (unlocked) {
          encJobs.push(decryptValue(v, unlockKeyPassword).then(p => {
            out[i][k] = p == null ? '' : p;
          }));
        } else {
          out[i][k] = '';
        }
      } else if (typeof v === 'object') {
        out[i][k] = JSON.stringify(v);
      } else {
        out[i][k] = String(v);
      }
    }
    if (encJobs.length) await Promise.all(encJobs);
  }

  return Papa.unparse(out, { columns: cols });
}

function downloadCsv(text, filename) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Metro Social Services district demographics — pre-aggregated by district,
   so much cheaper and more accurate than summing tract data ourselves. Lives
   on the same plain-text repo as cases.json so no CORS proxy needed. */
async function kickMssDemographicsSync() {
  try {
    bgStatus('Fetching MSS district demographics…', true);
    const r = await fetch(MSS_DEMOGRAPHICS_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    agg.districtDemographics = data.districts || {};
    agg.countyTotals = data.county_totals || null;
    const n = Object.keys(agg.districtDemographics).length;
    markSource('mss', { status: 'ok', rows: n });
    console.info(`[eo] MSS demographics: ${n} districts loaded`);
    bgStatus(`MSS: ${n} districts loaded`, false);
    setTimeout(() => bgStatus(''), 3000);
  } catch (e) {
    console.warn('MSS demographics fetch failed:', e);
    markSource('mss', { status: 'failed', error: e.message });
    bgStatus(`MSS fetch failed: ${e.message}`, false);
    setTimeout(() => bgStatus(''), 5000);
  }
}

/* ───────────────────────── Boot ───────────────────────── */

document.addEventListener("click", e => {
  if (activeDropdown && !e.target.closest(".filter-btn") && !e.target.closest(".dropdown")) {
    document.getElementById("dd-" + activeDropdown).style.display = "none";
    activeDropdown = null;
  }
  if (!e.target.closest(".export-wrap")) closeExportMenu();
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const modal = document.getElementById("login-modal");
  if (modal && modal.style.display !== "none") { closeLoginModal(); return; }
  if (selectedRecordDocket) { closeRecordPanel(); return; }
  if (selectedTract) { closeTractPanel(); }
});

// Debounced so each keystroke doesn't re-sort + re-render the full table —
// the difference is dramatic on mobile.
(function () {
  let t = null;
  document.getElementById("search").addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(render, 200);
  });
})();
loadData();
</script>
