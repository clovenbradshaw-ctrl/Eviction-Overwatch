<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nashville Eviction Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231a1810'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='44' font-weight='700' text-anchor='middle' dominant-baseline='middle' fill='%23c9a961'%3E%E2%9A%96%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #141310;
  --surface: #1a1914;
  --border: #2a2820;
  --text: #e2e0d8;
  --muted: #7a7668;
  --dim: #5a5648;
  --gold: #c4a44a;
  --gold-dim: #8a7a3a;
  --pending: #e8a735;
  --dismissed: #6b7280;
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
  --serif: 'Source Serif 4', Georgia, serif;
}

body {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

#loading {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; gap: 16px;
}

.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 24px 24px 16px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-family: var(--serif);
  font-size: 22px; font-weight: 400;
  color: #f5f0e0; letter-spacing: -0.02em;
}

.subtitle { margin-top: 4px; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.updated { font-size: 11px; color: var(--dim); text-align: right; }

.stats-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px; padding: 16px 24px;
  border-bottom: 1px solid var(--border);
}

.stat-card {
  padding: 12px 16px; background: var(--surface);
  border-radius: 4px; border: 1px solid var(--border);
}

.stat-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--dim); margin-bottom: 8px;
}

.stat-item {
  display: flex; justify-content: space-between; padding: 3px 0;
}

.stat-link {
  cursor: pointer; color: var(--gold); text-decoration: none;
}
.stat-link:hover { text-decoration: underline; }

.stat-count { color: var(--dim); font-variant-numeric: tabular-nums; }

.toolbar {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
}

#search {
  width: 100%; padding: 8px 12px; font-size: 12px;
  font-family: var(--mono); color: var(--text);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; outline: none; margin-bottom: 10px;
}
#search:focus { border-color: var(--gold-dim); }

.filter-row {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}

.filter-btn {
  padding: 4px 10px; font-size: 11px;
  font-family: var(--mono); color: var(--muted);
  background: transparent; border: 1px solid var(--border);
  border-radius: 3px; cursor: pointer; position: relative;
}
.filter-btn:hover { border-color: var(--muted); }
.filter-btn.active { color: var(--gold); border-color: var(--gold); }

.clear-x {
  margin-left: 6px; cursor: pointer; font-weight: bold;
}

.dropdown {
  position: absolute; top: 100%; left: 0; z-index: 50;
  min-width: 300px; max-height: 320px; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; margin-top: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

.dropdown-item {
  display: flex; justify-content: space-between;
  padding: 6px 12px; cursor: pointer;
  border-bottom: 1px solid #1f1d17;
}
.dropdown-item:hover { background: rgba(196,164,74,0.08); }

.dropdown-count { color: var(--dim); font-size: 11px; }

.result-count { margin-top: 8px; font-size: 11px; color: var(--dim); }

.table-wrap { overflow-x: auto; }

table {
  width: 100%; min-width: 1100px;
  border-collapse: collapse;
}

th {
  padding: 10px 12px; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--dim); cursor: pointer;
  border-bottom: 1px solid var(--border);
  text-align: left; position: sticky; top: 0;
  background: var(--bg); user-select: none;
  white-space: nowrap;
}
th:hover { color: var(--muted); }
th .arrow { margin-left: 4px; opacity: 0.6; }

td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--surface);
  white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 280px;
  line-height: 1.4;
}

tr:nth-child(even) td { background: rgba(255,255,255,0.015); }

.docket { color: var(--gold); font-weight: 500; }

.dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; margin-right: 6px; vertical-align: middle;
}
.dot-pending { background: var(--pending); }
.dot-dismissed { background: var(--dismissed); }
.dot-other { background: #3b82f6; }

#error { color: #ef4444; text-align: center; padding: 40px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading cases.json...</div>
</div>

<div id="app" style="display:none">
  <header>
    <div>
      <h1>Nashville Eviction Tracker</h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="updated" id="updated"></div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Top Districts</div>
      <div id="top-districts"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Top Attorneys</div>
      <div id="top-attorneys"></div>
    </div>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="Search docket, plaintiff, attorney, address...">
    <div class="filter-row" id="filters"></div>
    <div class="result-count" id="result-count"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div id="error" style="display:none"></div>

<script>
const GITHUB_RAW = "https://raw.githubusercontent.com/clovenbradshaw-ctrl/plain-text/main/cases.json";

const COLUMNS = [
  { key: "docket", label: "Docket" },
  { key: "file_date", label: "Filed" },
  { key: "status", label: "Status" },
  { key: "Plaintiff_1", label: "Plaintiff" },
  { key: "Attorney", label: "Attorney" },
  { key: "address_formatted", label: "Address" },
  { key: "council_district", label: "Council" },
  { key: "council_rep", label: "Council Rep" },
  { key: "state_house_district", label: "State House" },
  { key: "us_congressional_district", label: "US Cong." },
];

const FILTER_FIELDS = [
  { key: "status", label: "Status" },
  { key: "council_district", label: "Council District" },
  { key: "Attorney", label: "Attorney" },
  { key: "Plaintiff_1", label: "Plaintiff" },
];

let allRows = [];
let sortCol = "file_date";
let sortDir = -1;
let filters = {};
let activeDropdown = null;

function shorten(val, prefix) {
  return (val || "").replace(prefix, "D");
}

async function loadData() {
  try {
    const resp = await fetch(GITHUB_RAW);
    let data = await resp.json();

    // Auto-decompress gzip+base64
    if (data.format === "gzip+base64" && data.data) {
      const bin = Uint8Array.from(atob(data.data), c => c.charCodeAt(0));
      const raw = pako.inflate(bin, { to: "string" });
      data = JSON.parse(raw);
    }

    const cases = data.cases || {};
    allRows = Object.entries(cases).map(([docket, c]) => ({
      docket,
      ...c,
      Defendant_1: (c.Defendant_1 || "").startsWith("ENC:") ? "—" : c.Defendant_1 || "",
    }));

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("updated").textContent = "Updated " + (data.updated_at || "—").split("T")[0];

    const enriched = allRows.filter(r => r.enriched).length;
    const withDistrict = allRows.filter(r => r.council_district).length;
    document.getElementById("subtitle").textContent =
      `${allRows.length} cases · ${enriched} enriched · ${withDistrict} with districts`;

    buildStats();
    buildFilters();
    buildHeader();
    render();
  } catch (e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display = "block";
    document.getElementById("error").textContent = "Error: " + e.message;
  }
}

function buildStats() {
  const districts = {}, attorneys = {};
  allRows.forEach(r => {
    if (r.council_district) districts[r.council_district] = (districts[r.council_district] || 0) + 1;
    const a = r.Attorney;
    if (a && a !== ", PRS") attorneys[a] = (attorneys[a] || 0) + 1;
  });

  const topD = Object.entries(districts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const topA = Object.entries(attorneys).sort((a, b) => b[1] - a[1]).slice(0, 5);

  document.getElementById("top-districts").innerHTML = topD.map(([d, c]) =>
    `<div class="stat-item"><span class="stat-link" onclick="setFilter('council_district','${d}')">${shorten(d, "Council District ")}</span><span class="stat-count">${c}</span></div>`
  ).join("");

  document.getElementById("top-attorneys").innerHTML = topA.map(([a, c]) =>
    `<div class="stat-item"><span class="stat-link" onclick="setFilter('Attorney','${a.replace(/'/g, "\\'")}')">${a.split(",")[0]}</span><span class="stat-count">${c}</span></div>`
  ).join("");
}

function buildFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = FILTER_FIELDS.map(f =>
    `<div style="position:relative"><button class="filter-btn" id="fbtn-${f.key}" onclick="toggleDropdown('${f.key}')">${f.label}</button><div class="dropdown" id="dd-${f.key}" style="display:none"></div></div>`
  ).join("");
}

function toggleDropdown(field) {
  if (activeDropdown === field) {
    document.getElementById("dd-" + field).style.display = "none";
    activeDropdown = null;
    return;
  }
  if (activeDropdown) document.getElementById("dd-" + activeDropdown).style.display = "none";
  activeDropdown = field;

  const counts = {};
  allRows.forEach(r => {
    const v = r[field] || "(empty)";
    counts[v] = (counts[v] || 0) + 1;
  });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const dd = document.getElementById("dd-" + field);
  dd.innerHTML = sorted.map(([v, c]) => {
    const label = (field === "Attorney" && v === ", PRS") ? "pro se" : v;
    return `<div class="dropdown-item" onclick="setFilter('${field}','${v.replace(/'/g, "\\'")}')">`
      + `<span>${label}</span><span class="dropdown-count">${c}</span></div>`;
  }).join("");
  dd.style.display = "block";
}

function setFilter(field, val) {
  if (activeDropdown) {
    document.getElementById("dd-" + activeDropdown).style.display = "none";
    activeDropdown = null;
  }
  filters[field] = val;
  updateFilterBtns();
  render();
}

function clearFilter(field, e) {
  if (e) e.stopPropagation();
  delete filters[field];
  updateFilterBtns();
  render();
}

function updateFilterBtns() {
  FILTER_FIELDS.forEach(f => {
    const btn = document.getElementById("fbtn-" + f.key);
    const val = filters[f.key];
    if (val) {
      let display = (f.key === "Attorney" && val === ", PRS") ? "pro se"
        : val.replace(/Council District |State House District |US Congressional District /g, "D");
      if (display.length > 20) display = display.substring(0, 18) + "…";
      btn.className = "filter-btn active";
      btn.innerHTML = f.label + ": " + display
        + ` <span class="clear-x" onclick="clearFilter('${f.key}', event)">×</span>`;
    } else {
      btn.className = "filter-btn";
      btn.textContent = f.label;
    }
  });
}

function buildHeader() {
  document.getElementById("thead").innerHTML = COLUMNS.map(c =>
    `<th onclick="doSort('${c.key}')" id="th-${c.key}">${c.label}</th>`
  ).join("");
}

function doSort(col) {
  if (sortCol === col) sortDir = -sortDir;
  else { sortCol = col; sortDir = -1; }
  render();
}

function getFiltered() {
  let rows = allRows;
  Object.entries(filters).forEach(([field, val]) => {
    if (val === "(empty)") rows = rows.filter(r => !r[field]);
    else rows = rows.filter(r => r[field] === val);
  });
  const q = document.getElementById("search").value.toLowerCase();
  if (q) {
    rows = rows.filter(r =>
      (r.docket || "").toLowerCase().includes(q) ||
      (r.Plaintiff_1 || "").toLowerCase().includes(q) ||
      (r.Attorney || "").toLowerCase().includes(q) ||
      (r.address_formatted || "").toLowerCase().includes(q) ||
      (r.council_district || "").toLowerCase().includes(q)
    );
  }
  return rows;
}

function render() {
  const rows = getFiltered();
  rows.sort((a, b) => {
    const av = a[sortCol] || "";
    const bv = b[sortCol] || "";
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  // Update sort arrows
  COLUMNS.forEach(c => {
    const th = document.getElementById("th-" + c.key);
    th.innerHTML = c.label + (sortCol === c.key
      ? `<span class="arrow">${sortDir === 1 ? "↑" : "↓"}</span>` : "");
  });

  document.getElementById("result-count").textContent =
    rows.length === allRows.length
      ? `${allRows.length} cases`
      : `${rows.length} of ${allRows.length}`;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = rows.map(r => {
    const dotClass = r.status === "PENDING" ? "dot-pending"
      : (r.status === "DISMISSED" || r.status === "NONSUIT") ? "dot-dismissed"
      : "dot-other";
    return "<tr>" + COLUMNS.map(c => {
      let v = r[c.key] || "";
      if (c.key === "Attorney" && v === ", PRS") v = "pro se";
      if (c.key === "docket") return `<td><span class="docket">${v}</span></td>`;
      if (c.key === "status") return `<td><span class="dot ${dotClass}"></span>${v}</td>`;
      if (c.key === "council_district") v = shorten(v, "Council District ");
      if (c.key === "state_house_district") v = shorten(v, "State House District ");
      if (c.key === "us_congressional_district") v = shorten(v, "US Congressional District ");
      return `<td>${v}</td>`;
    }).join("") + "</tr>";
  }).join("");
}

// Close dropdowns on outside click
document.addEventListener("click", e => {
  if (activeDropdown && !e.target.closest(".filter-btn") && !e.target.closest(".dropdown")) {
    document.getElementById("dd-" + activeDropdown).style.display = "none";
    activeDropdown = null;
  }
});

document.getElementById("search").addEventListener("input", render);
loadData();
</script>
</body>
</html>
