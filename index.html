// Reads a shared/bookmarked map view back out of the URL, before the first
// render, so a copied link reproduces the same tab, layers, time window,
// and tract-map mode a reader was looking at. Deliberately does NOT restore
// which building panel was open or an active landlord highlight — those
// are a moment in a session, not a shareable query.
function restoreStateFromUrl() {
  const params = new URLSearchParams(location.search);
  const VIEWS = ['cases', 'districts', 'timeline', 'coverage', 'map', 'sources', 'live', 'chat'];
  const view = params.get('view');
  if (view && VIEWS.includes(view)) {
    viewMode = view;
    document.querySelectorAll('#view-seg button').forEach(b => b.classList.toggle('on', b.dataset.val === view));
  }

  if (params.has('tracts')) document.getElementById('layer-tracts').checked = params.get('tracts') !== '0';
  if (params.has('evictions')) document.getElementById('layer-evictions').checked = params.get('evictions') !== '0';

  const sig = params.get('signal');
  if (sig === 'volume' || sig === 'pressure' || sig === 'unusual') {
    llSignalMode = sig;
    document.querySelectorAll('#ll-signal-seg button').forEach(b => b.classList.toggle('on', b.dataset.val === sig));
  }
  const llmode = params.get('llmode');
  if (llmode === 'dots' || llmode === 'heat') {
    llLayerMode = llmode;
    document.querySelectorAll('#ll-layer-seg button').forEach(b => b.classList.toggle('on', b.dataset.val === llmode));
  }

  const mode = params.get('mode');
  if (mode === 'alltime' || mode === 'year' || mode === 'trajectory') {
    mapMode = mode;
    document.querySelectorAll('#map-mode-seg button').forEach(b => b.classList.toggle('on', b.dataset.val === mode));
  }
  if (params.has('year')) mapYear = params.get('year');
  if (params.has('month')) mapMonth = params.get('month');

  if (params.has('start') || params.has('end') || params.has('cursor') || params.has('halflife')) {
    const start = params.has('start') ? fromISODate(params.get('start')) : null;
    const end = params.has('end') ? fromISODate(params.get('end')) : null;
    const cursor = params.has('cursor') ? fromISODate(params.get('cursor')) : null;
    const halflife = params.has('halflife') ? parseFloat(params.get('halflife')) : null;
    llUrlRestorePending = {
      start: Number.isFinite(start) ? start : null,
      end: Number.isFinite(end) ? end : null,
      cursor: Number.isFinite(cursor) ? cursor : null,
      halflife: (Number.isFinite(halflife) && halflife > 0) ? halflife : null,
    };
  }
}

// Keeps the URL's query string in agreement with the map's own view/filter
// state -- never the open panel or landlord highlight (see above). Uses
// replaceState, never pushState: dragging a slider is not a new page in
// browser history, it's the same page with different filters.
function syncMapUrl() {
  const params = new URLSearchParams();
  if (viewMode !== 'cases') params.set('view', viewMode);
  if (viewMode === 'map') {
    const tractsOn = document.getElementById('layer-tracts').checked;
    const evictionsOn = document.getElementById('layer-evictions').checked;
    if (!tractsOn) params.set('tracts', '0');
    if (!evictionsOn) params.set('evictions', '0');
    if (mapMode !== 'alltime') params.set('mode', mapMode);
    if (mapMode === 'year' && mapYear) params.set('year', mapYear);
    if (mapMode === 'trajectory' && mapMonth) params.set('month', mapMonth);
    if (llLayerMode !== 'dots') params.set('llmode', llLayerMode);
    if (llSignalMode !== 'volume') params.set('signal', llSignalMode);
    if (llStartTs !== null) {
      params.set('start', toISODate(llStartTs));
      params.set('end', toISODate(llEndTs));
      params.set('cursor', toISODate(llCursorTs));
      if (llHalfLifeMonths !== 3) params.set('halflife', String(llHalfLifeMonths));
    }
  }
  const qs = params.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
}

// Decayed heat as of llCursorTs, over cases within [llStartTs, llEndTs],
// per building. A case dated after the cursor contributes nothing (it
// hasn't happened yet, as of the point in time being viewed); a case
// exactly at the cursor contributes its full weight; older cases decay by
// the declared half-life. Returns only buildings with at least one
// in-range filing, plus the maximum heat value (for color/size scaling).
function computeHeat(properties) {
  const decayPerMonth = Math.pow(0.5, 1 / llHalfLifeMonths);
  let maxHeat = 0;
  const out = [];
  for (const p of properties) {
    let heat = 0, countInRange = 0, mostRecentDate = null;
    for (const c of p.cases) {
      const t = parseUsDate(c.file_date);
      if (!t || t < llStartTs || t > llEndTs || t > llCursorTs) continue;
      countInRange++;
      if (!mostRecentDate || t > mostRecentDate) mostRecentDate = t;
      const monthsAgo = (llCursorTs - t) / DAY_MS / 30.44;
      heat += Math.pow(decayPerMonth, monthsAgo);
    }
    if (!countInRange) continue;
    if (heat > maxHeat) maxHeat = heat;
    out.push({ ...p, heat, countInRange, mostRecentDate });
  }
  return { properties: out, maxHeat };
}

function shorten(val, prefix) {
  return (val || "").replace(prefix, "D");
}

/* ───────────────────────── Load data ─────────────────────────
   One source now: a single GET of the feed returns the entire current case set
   as newline-delimited JSON (see fetchSnapshot above).
   Warm path: paint the last snapshot straight out of OPFS for an instant
   render, then refetch in the background and swap in the fresh set.
   Cold path: fetch the snapshot, render, persist to OPFS. Either way we then
   refetch on a slow interval — the feed is a full snapshot, replaced
   wholesale, never merged. */

function applyInitialCases(data) {
  const cases = data.cases || {};
  casesState = cases;                 // authoritative map; refetchSnapshot swaps it
  // Keep ENC: values verbatim so they can be decrypted after login. The
  // display layer hides them until the user unlocks.
  allRows = Object.entries(cases).map(([docket, c]) => ({ docket, ...c }));
  enrichCaseRows(allRows);
  rebuildLocalAggregates();

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("updated").textContent = "Updated " + (data.updated_at || "—").split("T")[0];

  updateSubtitle();
  buildStats();
  buildFilters();
  buildHeader();
  bindViewControls();
  bindRowClicks();
  restoreStateFromUrl();
  renderProvenance();
  render();
}

async function loadData() {
  try {
    // Warm path — paint the last snapshot straight from OPFS for an instant
    // render, then refetch in the background to swap in the fresh set.
    const cached = await localCache.get(CACHE_FILES.cases);
    if (cached && cached.data) {
      casesUpdatedAt = (cached.data && cached.data.updated_at) || null;
      applyInitialCases(cached.data);
      markSource('cases', { status: 'ok', rows: allRows.length, fromCache: true });

      kickBackgroundSync();
      kickMssDemographicsSync();
      startFeedRefetch();
      whenIdle(() => refetchSnapshot());
      return;
    }

    // Cold path — fetch the full snapshot once, render it, persist for next time.
    // Drive the progress bar off the download, then flip to a brief processing
    // phase (and let it paint) before the synchronous render blocks the thread.
    setLoadingPhase('Downloading case records…');
    const cases = await fetchSnapshot(updateLoadProgress);
    finishLoadProgress();
    setLoadingPhase('Processing…');
    await nextPaint();
    casesUpdatedAt = new Date().toISOString();
    applyInitialCases({ cases, updated_at: casesUpdatedAt });
    markSource('cases', { status: 'ok', rows: allRows.length });

    kickBackgroundSync();
    kickMssDemographicsSync();
    startFeedRefetch();

    whenIdle(() => localCache.put(CACHE_FILES.cases, {
      data: { cases, updated_at: casesUpdatedAt },
    }));
  } catch (e) {
    markSource('cases', { status: 'failed', error: e.message });
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display = "block";
    document.getElementById("error").textContent = "Error: " + e.message;
  }
}

// Full-snapshot refresh: refetch the feed and replace the local set wholesale.
// The feed is a snapshot, not a diff, so we swap the whole map rather than
// merging deltas. Runs on the warm-path kick and on the periodic interval.
async function refetchSnapshot() {
  let cases;
  try {
    cases = await fetchSnapshot();
  } catch (e) {
    console.warn('[feed] refetch failed:', e.message);
    return;
  }
  const prevCount = Object.keys(casesState).length;
  casesState = cases;
  casesUpdatedAt = new Date().toISOString();
  const newCount = Object.keys(cases).length;

  // Rebuild the render rows from the fresh set and repaint.
  allRows = Object.entries(cases).map(([docket, c]) => ({ docket, ...c }));
  enrichCaseRows(allRows);
  rebuildLocalAggregates();
  if (princetonRows) rebuildPrincetonAggregates();

  document.getElementById('updated').textContent = 'Updated ' + (casesUpdatedAt || '—').split('T')[0];
  updateSubtitle();
  buildStats();
  render();
  if (selectedRecordDocket && casesState[selectedRecordDocket]) {
    renderRecordPanel(selectedRecordDocket);
  } else if (selectedRecordDocket) {
    closeRecordPanel();
  }
  markSource('cases', { status: 'ok', rows: allRows.length });

  localCache.put(CACHE_FILES.cases, { data: { cases, updated_at: casesUpdatedAt } });

  const delta = newCount - prevCount;
  if (delta) {
    bgStatus(`Refreshed — ${newCount.toLocaleString()} cases (${delta > 0 ? '+' : ''}${delta.toLocaleString()})`, false);
    setTimeout(() => bgStatus(''), 6000);
  }
}

function updateSubtitle() {
  const enriched = allRows.filter(r => r.enriched).length;
  const withTract = allRows.filter(r => r.tract_geoid).length;
  const tractCount = Object.keys(agg.tractInfo).length;
  let s = `Scraped: ${allRows.length.toLocaleString()} cases · ${enriched.toLocaleString()} enriched · ${withTract.toLocaleString()} with tracts (${tractCount.toLocaleString()} unique)`;
  if (princetonRows) {
    const range = formatMonthRange(agg.princetonMonths);
    const sealed = princetonSealedTotal();
    s += ` · Princeton (independent): ${princetonRows.length.toLocaleString()} tract-month filing rows`
      + `${range ? ` ${range}` : ''}`
      + `${sealed ? `, ${sealed.toLocaleString()} filings with no tract` : ''}`
      + ` — not added to scraped count`;
  }
  const el = document.getElementById("subtitle");
  el.textContent = s;
  el.title = 'Scraped = current per-case court records (one row per docket). Princeton = aggregated monthly filing totals (one row per tract-month, no dockets). Two independent counts of the same evictions — compare them, never sum them.';
}

/* ───────────────────────── Existing per-case stats / filters / table ───────────────────────── */

function buildStats() {
  const districts = {}, attorneys = {};
  allRows.forEach(r => {
    if (r.council_district) districts[r.council_district] = (districts[r.council_district] || 0) + 1;
    const a = r.Attorney;
    if (a && a !== ", PRS") attorneys[a] = (attorneys[a] || 0) + 1;
  });

  const topD = Object.entries(districts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const topA = Object.entries(attorneys).sort((a, b) => b[1] - a[1]).slice(0, 5);

  document.getElementById("top-districts").innerHTML = topD.map(([d, c]) =>
    `<div class="stat-item"><span class="stat-link" onclick="setFilter('council_district','${d}')">${shorten(d, "Council District ")}</span><span class="stat-count">${c}</span></div>`
  ).join("");

  document.getElementById("top-attorneys").innerHTML = topA.map(([a, c]) =>
    `<div class="stat-item"><span class="stat-link" onclick="setFilter('Attorney','${a.replace(/'/g, "\\'")}')">${a.split(",")[0]}</span><span class="stat-count">${c}</span></div>`
  ).join("");
}

function buildFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = FILTER_FIELDS.map(f =>
    `<div style="position:relative"><button class="filter-btn" id="fbtn-${f.key}" onclick="toggleDropdown('${f.key}')">${f.label}</button><div class="dropdown" id="dd-${f.key}" style="display:none"></div></div>`
  ).join("");
}

function toggleDropdown(field) {
  if (activeDropdown === field) {
    document.getElementById("dd-" + field).style.display = "none";
    activeDropdown = null;
    return;
  }
  if (activeDropdown) document.getElementById("dd-" + activeDropdown).style.display = "none";
  activeDropdown = field;

  const counts = {};
  allRows.forEach(r => {
    const v = r[field] || "(empty)";
    counts[v] = (counts[v] || 0) + 1;
  });
  const f = FILTER_FIELDS.find(x => x.key === field);
  const sorted = f && f.order
    ? f.order.filter(k => k in counts).map(k => [k, counts[k]])
    : Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const dd = document.getElementById("dd-" + field);
  dd.innerHTML = sorted.map(([v, c]) => {
    const label = (field === "Attorney" && v === ", PRS") ? "pro se" : v;
    return `<div class="dropdown-item" onclick="setFilter('${field}','${v.replace(/'/g, "\\'")}')">`
      + `<span>${label}</span><span class="dropdown-count">${c}</span></div>`;
  }).join("");
  dd.style.display = "block";
}

function setFilter(field, val) {
  if (activeDropdown) {
    document.getElementById("dd-" + activeDropdown).style.display = "none";
    activeDropdown = null;
  }
  filters[field] = val;
  updateFilterBtns();
  render();
}

function clearFilter(field, e) {
  if (e) e.stopPropagation();
  delete filters[field];
  updateFilterBtns();
  render();
}

function updateFilterBtns() {
  FILTER_FIELDS.forEach(f => {
    const btn = document.getElementById("fbtn-" + f.key);
    const val = filters[f.key];
    if (val) {
      let display = (f.key === "Attorney" && val === ", PRS") ? "pro se"
        : val.replace(/Council District |State House District |US Congressional District /g, "D");
      if (display.length > 20) display = display.substring(0, 18) + "…";
      btn.className = "filter-btn active";
      btn.innerHTML = f.label + ": " + display
        + ` <span class="clear-x" onclick="clearFilter('${f.key}', event)">×</span>`;
    } else {
      btn.className = "filter-btn";
      btn.textContent = f.label;
    }
  });
}

function buildHeader() {
  document.getElementById("thead").innerHTML = COLUMNS.map(c => {
    const align = c.align === "right" ? ' style="text-align:right"' : "";
    const tip = c.tip ? ` title="${escapeAttr(c.tip)}"` : "";
    return `<th onclick="doSort('${c.key}')" id="th-${c.key}"${align}${tip}>${c.label}</th>`;
  }).join("");
}

function doSort(col) {
  if (sortCol === col) sortDir = -sortDir;
  else { sortCol = col; sortDir = -1; }
  render();
}

function getFiltered() {
  // .slice() so the subsequent sort in renderLocalTable() doesn't mutate
  // allRows when no filter/search is active.
  let rows = allRows.slice();
  Object.entries(filters).forEach(([field, val]) => {
    if (val === "(empty)") rows = rows.filter(r => !r[field]);
    else rows = rows.filter(r => r[field] === val);
  });
  const q = document.getElementById("search").value.toLowerCase();
  if (q) {
    rows = rows.filter(r =>
      (r.docket || "").toLowerCase().includes(q) ||
      (r.Plaintiff_1 || "").toLowerCase().includes(q) ||
      (r.Attorney || "").toLowerCase().includes(q) ||
      (r.address_formatted || "").toLowerCase().includes(q) ||
      (r.council_district || "").toLowerCase().includes(q)
    );
  }
  return rows;
}

function renderLocalTable() {
  const rows = getFiltered();
  const sortColDef = COLUMNS.find(c => c.key === sortCol);
  const isDateCol = sortCol === "file_date";
  const isNumCol = !!(sortColDef && sortColDef.numeric);
  const parseDate = v => {
    const m = String(v || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m ? new Date(+m[3], +m[1] - 1, +m[2]).getTime() : NaN;
  };
  rows.sort((a, b) => {
    if (isDateCol) {
      const at = parseDate(a[sortCol]);
      const bt = parseDate(b[sortCol]);
      const aBad = Number.isNaN(at), bBad = Number.isNaN(bt);
      if (aBad && bBad) return 0;
      if (aBad) return 1;
      if (bBad) return -1;
      return at < bt ? -sortDir : at > bt ? sortDir : 0;
    }
    if (isNumCol) {
      const av = a[sortCol], bv = b[sortCol];
      const aBad = av == null, bBad = bv == null;
      if (aBad && bBad) return 0;
      if (aBad) return 1;
      if (bBad) return -1;
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    }
    const av = a[sortCol] || "";
    const bv = b[sortCol] || "";
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  COLUMNS.forEach(c => {
    const th = document.getElementById("th-" + c.key);
    th.innerHTML = c.label + (sortCol === c.key
      ? `<span class="arrow">${sortDir === 1 ? "↑" : "↓"}</span>` : "");
    if (c.tip) th.title = c.tip;
  });

  document.getElementById("result-count").textContent =
    rows.length === allRows.length
      ? `${allRows.length.toLocaleString()} scraped cases`
      : `${rows.length.toLocaleString()} of ${allRows.length.toLocaleString()} scraped cases`;

  tableSortedRows = rows;
  tableVisibleCount = Math.min(TABLE_PAGE_SIZE, rows.length);
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = rows.slice(0, tableVisibleCount).map(caseRowHtml).join("");
  attachTableSentinel();
}

function caseRowHtml(r) {
  const dotClass = r.status === "PENDING" ? "dot-pending"
    : (r.status === "DISMISSED" || r.status === "NONSUIT") ? "dot-dismissed"
    : "dot-other";
  const sel = selectedRecordDocket === r.docket ? ' class="selected"' : '';
  return `<tr data-docket="${escapeAttr(r.docket)}"${sel}>` + COLUMNS.map(c => {
    if (c.key === "judgment_amount") {
      const amt = r.judgment_amount;
      return amt == null
        ? `<td class="money">—</td>`
        : `<td class="money">${formatMoney(amt)}</td>`;
    }
    let v = r[c.key] || "";
    if (c.key === "Attorney" && v === ", PRS") v = "pro se";
    if (c.key === "docket") return `<td><span class="docket">${v}</span></td>`;
    if (c.key === "status") return `<td><span class="dot ${dotClass}"></span>${v}</td>`;
    if (c.key === "council_district") v = shorten(v, "Council District ");
    if (c.key === "state_house_district") v = shorten(v, "State House District ");
    if (c.key === "us_congressional_district") v = shorten(v, "US Congressional District ");
    return `<td>${v}</td>`;
  }).join("") + "</tr>";
}

function attachTableSentinel() {
  if (tableSentinelObserver) {
    tableSentinelObserver.disconnect();
    tableSentinelObserver = null;
  }
  const old = document.getElementById("table-sentinel");
  if (old) old.remove();
  if (tableVisibleCount >= tableSortedRows.length) return;

  const tbody = document.getElementById("tbody");
  const tr = document.createElement("tr");
  tr.id = "table-sentinel";
  tr.innerHTML = `<td colspan="${COLUMNS.length}" style="text-align:center;padding:12px;color:var(--dim);font-style:italic">Loading more rows…</td>`;
  tbody.appendChild(tr);

  tableSentinelObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) appendMoreTableRows();
  }, { rootMargin: "400px" });
  tableSentinelObserver.observe(tr);
}

function appendMoreTableRows() {
  if (tableSentinelObserver) {
    tableSentinelObserver.disconnect();
    tableSentinelObserver = null;
  }
  const sentinel = document.getElementById("table-sentinel");
  if (sentinel) sentinel.remove();

  const start = tableVisibleCount;
  const end = Math.min(start + TABLE_PAGE_SIZE, tableSortedRows.length);
  if (end <= start) return;

  const html = tableSortedRows.slice(start, end).map(caseRowHtml).join("");
  const tbody = document.getElementById("tbody");
  const tmp = document.createElement("tbody");
  tmp.innerHTML = html;
  while (tmp.firstChild) tbody.appendChild(tmp.firstChild);

  tableVisibleCount = end;
  attachTableSentinel();
}

/* ───────────────────────── Aggregations for the toggle ───────────────────────── */

// Map "Council District 5" → "5"
function normalizeDistrict(d) {
  if (!d) return null;
  const m = String(d).match(/(\d+)/);
  return m ? m[1] : String(d);
}

// "MM/DD/YYYY" → "MM/YYYY"
function caseFileDateToMonth(fileDate) {
  if (!fileDate) return null;
  const m = String(fileDate).match(/^(\d{1,2})\/\d{1,2}\/(\d{4})$/);
  if (!m) return null;
  return `${m[1].padStart(2,'0')}/${m[2]}`;
}

/* Build agg.tractToDistrict / tractInfo / localTract / localDistrict from allRows.
   Run on cases load. Cheap (~3k rows). */
function rebuildLocalAggregates() {
  const t2d = {}, info = {}, byTract = {}, byDistrict = {}, months = new Set();
  for (const r of allRows) {
    const g = r.tract_geoid;
    const d = normalizeDistrict(r.council_district);
    const m = caseFileDateToMonth(r.file_date);

    if (g && d && !t2d[g]) t2d[g] = { council_district: r.council_district, council_rep: r.council_rep || '' };
    if (g) {
      const cur = info[g] || { name: '', district: '', rep: '', state_house: '', us_congressional: '' };
      if (!cur.name && r.census_name) cur.name = r.census_name;
      if (!cur.district && r.council_district) cur.district = r.council_district;
      if (!cur.rep && r.council_rep) cur.rep = r.council_rep;
      if (!cur.state_house && r.state_house_district) cur.state_house = r.state_house_district;
      if (!cur.us_congressional && r.us_congressional_district) cur.us_congressional = r.us_congressional_district;
      info[g] = cur;
    }

    if (g && m) {
      if (!byTract[g]) byTract[g] = {};
      byTract[g][m] = (byTract[g][m] || 0) + 1;
      months.add(m);
    }
    if (d && m) {
      if (!byDistrict[d]) byDistrict[d] = {};
      byDistrict[d][m] = (byDistrict[d][m] || 0) + 1;
    }
  }
  agg.tractToDistrict = t2d;
  agg.tractInfo       = info;
  agg.localTract      = byTract;
  agg.localDistrict   = byDistrict;
  agg.localMonths     = sortMonthsAsc([...months]);
}

/* Build agg.princetonTract / princetonDistrict from princetonRows × tractToDistrict.
   Run when CSV arrives, and again whenever cases reload — the district rollup
   depends on tractToDistrict, which the scrape supplies.

   Two things worth stating. The CSV always carries a row for the month in
   progress, filled with zeros until Eviction Lab publishes it; carrying that
   through would draw a phantom empty bar on the timeline and read as "Eviction
   Lab counted nothing" rather than "not reported yet", so trailing all-zero
   months are dropped. And a tract only reaches a district if the scrape has
   placed that tract in one, so district totals are honest about their own
   coverage rather than quietly attributing orphan tracts. */
function rebuildPrincetonAggregates() {
  const byTract = {}, byDistrict = {}, monthTotals = new Map();
  if (!princetonRows) {
    agg.princetonTract = {}; agg.princetonDistrict = {};
    agg.princetonMonths = []; agg.princetonSealed = {};
    return;
  }
  const t2d = agg.tractToDistrict;
  const sealed = {};
  for (const r of princetonRows) {
    const g = String(r.GEOID);
    const m = String(r.month);
    const f = Number(r.filings_2020);
    const v = Number.isFinite(f) ? f : 0;      // blanks and "NA" count as zero
    monthTotals.set(m, (monthTotals.get(m) || 0) + v);

    /* Eviction Lab files the filings it can't place in a tract under a literal
       GEOID of "sealed" (suppressed addresses — about 1% of Nashville filings).
       Those are real evictions but they have nothing to join to, so they'd sit
       in the tract grid as a permanently 0%-covered row and read as a hole in
       our scrape rather than a hole in theirs. Keep them out of the join and
       carry the count separately so it can be disclosed instead of dropped. */
    if (!/^\d+$/.test(g)) {
      sealed[m] = (sealed[m] || 0) + v;
      continue;
    }

    if (!byTract[g]) byTract[g] = {};
    byTract[g][m] = (byTract[g][m] || 0) + v;

    const t = t2d[g];
    if (t && t.council_district) {
      const d = normalizeDistrict(t.council_district);
      if (!byDistrict[d]) byDistrict[d] = {};
      byDistrict[d][m] = (byDistrict[d][m] || 0) + v;
    }
  }

  // Drop not-yet-reported months off the tail (see note above). Only the tail:
  // a genuine zero month in the middle of the series is real data.
  let months = sortMonthsAsc([...monthTotals.keys()]);
  while (months.length && !monthTotals.get(months[months.length - 1])) months.pop();
  const keep = new Set(months);
  for (const map of [byTract, byDistrict]) {
    for (const k in map) {
      for (const m in map[k]) if (!keep.has(m)) delete map[k][m];
    }
  }
  for (const m in sealed) if (!keep.has(m)) delete sealed[m];

  agg.princetonTract    = byTract;
  agg.princetonDistrict = byDistrict;
  agg.princetonMonths   = months;
  agg.princetonSealed   = sealed;
}

// Total filings Eviction Lab reported without a tract (suppressed addresses).
// Surfaced wherever Princeton totals are, so the tract grid's omission is stated
// rather than left for someone to discover as a discrepancy.
function princetonSealedTotal() {
  let n = 0;
  for (const m in agg.princetonSealed) n += agg.princetonSealed[m];
  return n;
}

function sortMonthsAsc(arr) {
  return arr.sort((a, b) => {
    const [am, ay] = a.split('/'); const [bm, by] = b.split('/');
    return (ay + am).localeCompare(by + bm);
  });
}

// Format a sorted-asc array of "MM/YYYY" keys as a human-readable range.
// Used in the Districts table column headers so the dates shown reflect
// what's actually in the data rather than a hardcoded label.
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatMonthRange(months) {
  if (!months || !months.length) return '';
  const fmt = m => {
    const [mm, yyyy] = m.split('/');
    return `${MONTH_ABBR[+mm - 1]} ${yyyy}`;
  };
  const a = fmt(months[0]);
  const b = fmt(months[months.length - 1]);
  return a === b ? a : `${a} – ${b}`;
}

// Full union of months across both sources (oldest→newest), so a month present
// on one side only still gets a column rather than vanishing.
function allMonthsUnion() {
  const set = new Set([...agg.princetonMonths, ...agg.localMonths]);
  return sortMonthsAsc([...set]);
}

// Used by the coverage headline: scan recent months for the first overlap.
function recentMonthsUnion(n=24) {
  return allMonthsUnion().slice(-n);
}

function ratioClass(ratio) {
  if (ratio == null || !isFinite(ratio)) return 'cell-na';
  if (ratio >= 0.85) return 'cell-green';
  if (ratio >= 0.50) return 'cell-amber';
  return 'cell-red';
}

function median(arr) {
  if (!arr.length) return null;
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}

function updateCoverageHeadline() {
  const el = document.getElementById('coverage-headline');
  if (viewMode === 'cases' || viewMode === 'districts' || viewMode === 'timeline' || viewMode === 'sources' || viewMode === 'live') { el.textContent = ''; return; }
  if (!princetonRows) {
    el.innerHTML = '<span style="color:var(--dim)">Fetching Princeton CSV…</span>';
    return;
  }
  // Pick the most recent month with overlap (Princeton > 0 for at least one
  // district/tract). Both series now run to the present, so under normal
  // conditions this resolves on the first or second month tried.
  const months = recentMonthsUnion(24).slice().reverse(); // newest first
  const p = coverageMode === 'tract' ? agg.princetonTract : agg.princetonDistrict;
  const l = coverageMode === 'tract' ? agg.localTract     : agg.localDistrict;
  for (const m of months) {
    const ratios = [];
    for (const k in p) {
      const pv = p[k][m] || 0;
      const lv = (l[k] && l[k][m]) || 0;
      if (pv > 0) ratios.push(lv / pv);
    }
    const med = median(ratios);
    if (med != null) {
      el.innerHTML = `Coverage for <strong>${m}</strong>: <strong>${(med * 100).toFixed(0)}%</strong> of Princeton (median across ${ratios.length} ${coverageMode}s)`;
      return;
    }
  }
  el.innerHTML = '<span style="color:var(--dim)">no Princeton↔scrape month overlap in the last 24 months</span>';
}

/* ───────────────────────── Coverage view (District or Tract) ───────────────────────── */

function renderCoverageGrid() {
  const root = document.getElementById('grid-view');

  if (!princetonRows) {
    root.innerHTML = `<div class="notice">Fetching Princeton CSV from evictionlab.org…</div>`;
    return;
  }

  let months = allMonthsUnion();
  if (!months.length) {
    root.innerHTML = `<div class="notice">No monthly data on either side yet.</div>`;
    return;
  }
  if (coverageDir === 'desc') months = months.slice().reverse();

  const isTract = coverageMode === 'tract';
  const princeton = isTract ? agg.princetonTract    : agg.princetonDistrict;
  const local     = isTract ? agg.localTract        : agg.localDistrict;

  /* Row keys = union of both sides, so a tract or district that appears on only
     one side still gets a row rather than disappearing. But rows Princeton has
     no data for can't show a ratio, and in tract mode there are a lot of them —
     the scrape picks up out-of-county tracts (a Rutherford or Sumner address in
     a Nashville court record) that Eviction Lab never covers, and by raw GEOID
     order those sort ahead of Davidson County. Leading with a screenful of
     dashes buries the comparison the view exists to show, so comparable rows
     come first and one-sided rows follow. */
  const allKeys = [...new Set([...Object.keys(princeton), ...Object.keys(local)])];
  const comparable = k => (princeton[k] ? 0 : 1);
  const keys = allKeys.sort((a, b) => {
    const c = comparable(a) - comparable(b);
    if (c) return c;
    const an = parseInt(a, 10), bn = parseInt(b, 10);
    if (!isNaN(an) && !isNaN(bn)) return an - bn;
    return a.localeCompare(b);
  });
  const oneSided = allKeys.filter(k => comparable(k)).length;

  const labelFor = isTract
    ? (k => { const info = agg.tractInfo[k]; return info && info.name ? info.name : `Tract ${k}`; })
    : (k => `D${k}`);

  let html = `<div class="coverage-tbl-wrap"><table class="coverage-tbl"><thead><tr><th>${isTract ? 'Tract' : 'District'}</th><th>Source</th>`;
  for (const m of months) html += `<th class="num">${m}</th>`;
  html += `</tr></thead><tbody>`;

  for (const k of keys) {
    html += `<tr class="dist-princeton"><td class="row-label" rowspan="2">${labelFor(k)}</td><td class="src-label src-princeton">Princeton</td>`;
    for (const m of months) {
      const v = princeton[k] && princeton[k][m];
      html += `<td class="num">${v != null ? v : '—'}</td>`;
    }
    html += `</tr>`;

    html += `<tr class="dist-scraped"><td class="src-label src-scraped">Scraped</td>`;
    for (const m of months) {
      const p = princeton[k] && princeton[k][m];
      const lv = (local[k] && local[k][m]) || 0;
      if (p == null || p === 0) {
        html += `<td class="num cell-na">${lv || '—'}</td>`;
      } else {
        const ratio = lv / p;
        html += `<td class="num ${ratioClass(ratio)}"><div class="cell-stack"><span>${lv}</span><span class="ratio">${(ratio*100).toFixed(0)}%</span></div></td>`;
      }
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;

  html += `<div class="legend">
    <span><span class="sw green"></span> Scraped ≥85% of Princeton</span>
    <span><span class="sw amber"></span> 50–85%</span>
    <span><span class="sw red"></span> &lt;50%</span>
    <span style="color:var(--dim)">Princeton CSV is live from evictionlab.org · only months where Princeton > 0 get a ratio · showing ${months.length} months</span>
    <span style="color:var(--dim)">Scraped tracts come from the geocoded GEOID where present, otherwise the court record's tract code within Davidson County.</span>
    ${princetonSealedTotal() ? `<span style="color:var(--dim)">${princetonSealedTotal().toLocaleString()} Princeton filings carry no tract (sealed addresses) and appear in no row above.</span>` : ''}
    ${oneSided ? `<span style="color:var(--dim)">Last ${oneSided.toLocaleString()} ${isTract ? 'tracts' : 'districts'}: scraped cases with no Princeton counterpart (mostly addresses outside Davidson County) — nothing to compare, so no ratio.</span>` : ''}
  </div>`;

  root.innerHTML = html;
}

/* ───────────────────────── Timeline view (Princeton monthly filings) ─────────────────────────
   Bar chart of monthly eviction filings from the Princeton CSV.
   Toggle: "All districts" sums every district present in agg.princetonDistrict
   for each month; otherwise we read one district's monthly series directly.
   Tracts that don't map to a council district are excluded — same convention
   the Districts and Coverage views use. */

function availableTimelineDistricts() {
  const keys = Object.keys(agg.princetonDistrict);
  return keys.sort((a, b) => {
    const an = parseInt(a, 10), bn = parseInt(b, 10);
    if (!isNaN(an) && !isNaN(bn)) return an - bn;
    return a.localeCompare(b);
  });
}

function timelineSeries() {
  const months = agg.princetonMonths;
  if (!months.length) return { months: [], counts: [] };
  let counts;
  if (timelineDistrict === 'all') {
    counts = months.map(m => {
      let t = 0;
      for (const k in agg.princetonDistrict) {
        t += (agg.princetonDistrict[k][m] || 0);
      }
      return t;
    });
  } else {
    const series = agg.princetonDistrict[timelineDistrict] || {};
    counts = months.map(m => series[m] || 0);
  }
  return { months, counts };
}

function populateTimelineDistrictSelect() {
  const sel = document.getElementById('timeline-district-select');
  const districts = availableTimelineDistricts();
  // Preserve current selection if still valid.
  if (timelineDistrict !== 'all' && !districts.includes(timelineDistrict)) {
    timelineDistrict = 'all';
  }
  const opts = [`<option value="all">All districts</option>`]
    .concat(districts.map(d => `<option value="${d}">District ${d}</option>`));
  sel.innerHTML = opts.join('');
  sel.value = timelineDistrict;
}

// "MM/YYYY" → short label like "Jan '20"
function monthShortLabel(m) {
  const [mm, yy] = m.split('/');
  const idx = parseInt(mm, 10) - 1;
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if (idx < 0 || idx > 11) return m;
  return `${names[idx]} '${String(yy).slice(-2)}`;
}

function niceMax(v) {
  if (v <= 0) return 10;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / pow;
  let nice;
  if (norm <= 1) nice = 1;
  else if (norm <= 2) nice = 2;
  else if (norm <= 5) nice = 5;
  else nice = 10;
  return nice * pow;
}

function renderTimelineView() {
  const root = document.getElementById('timeline-view');
  populateTimelineDistrictSelect();

  const sourceNote = `<div class="tl-source-note" title="${escapeAttr(SRC_PRINCETON)}">
    Monthly eviction filings from <strong>Princeton Eviction Lab</strong> (Nashville${agg.princetonMonths.length ? ', ' + formatMonthRange(agg.princetonMonths) : ''}).
    Each bar is total court filings for that month. Toggle the District selector to filter to a single council district.
  </div>`;

  if (!princetonRows) {
    root.innerHTML = sourceNote +
      `<div class="tl-empty">Fetching Princeton CSV from evictionlab.org…</div>`;
    return;
  }

  const { months, counts } = timelineSeries();
  if (!months.length) {
    root.innerHTML = sourceNote +
      `<div class="tl-empty">No Princeton monthly data loaded.</div>`;
    return;
  }

  const total = counts.reduce((a, b) => a + b, 0);
  let peakIdx = 0;
  for (let i = 1; i < counts.length; i++) if (counts[i] > counts[peakIdx]) peakIdx = i;
  const peakVal = counts[peakIdx];
  const avg = total / counts.length;

  // District → rep lookup so the headline can name the council member for a
  // selected district (same aggregation the Districts view uses).
  const repByDistrict = {};
  for (const a of Object.values(aggregateDistricts())) repByDistrict[a.key] = a.rep;
  const selectedRep = timelineDistrict !== 'all' ? repByDistrict[timelineDistrict] : '';

  const districtLabel = timelineDistrict === 'all'
    ? 'All districts'
    : `District ${timelineDistrict}` + (selectedRep ? ` · ${escapeHtmlSafe(selectedRep)}` : '');

  const headline = `<div class="tl-headline">
    <span>${escapeHtmlSafe(districtLabel)} · <strong>${months.length}</strong> months</span>
    <span>Total filings: <strong>${total.toLocaleString()}</strong></span>
    <span>Peak: <strong>${peakVal.toLocaleString()}</strong> in <strong>${escapeHtmlSafe(monthShortLabel(months[peakIdx]))}</strong></span>
    <span>Monthly avg: <strong>${avg.toFixed(0)}</strong></span>
  </div>`;

  // SVG chart geometry. We render into a fixed coordinate system and let
  // CSS scale it; the wrapper allows horizontal scroll on narrow viewports.
  const PAD_L = 48, PAD_R = 20, PAD_T = 24, PAD_B = 56;
  const W = Math.max(720, 60 + months.length * 28);
  const H = 360;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;
  const yMax = niceMax(Math.max(1, ...counts));
  const barSlot = innerW / months.length;
  const barW = Math.max(4, Math.min(24, barSlot * 0.7));

  // Y-axis: 5 gridlines incl. zero
  const yTicks = 5;
  let gridSvg = '';
  let yLabelSvg = '';
  for (let i = 0; i <= yTicks; i++) {
    const v = (yMax / yTicks) * i;
    const y = PAD_T + innerH - (v / yMax) * innerH;
    gridSvg += `<line class="tl-grid" x1="${PAD_L}" y1="${y}" x2="${PAD_L + innerW}" y2="${y}"/>`;
    yLabelSvg += `<text class="tl-tick-label" x="${PAD_L - 6}" y="${y + 3}" text-anchor="end">${Math.round(v).toLocaleString()}</text>`;
  }

  // Bars + x labels + year dividers
  let barsSvg = '';
  let xLabelsSvg = '';
  let yearDividerSvg = '';
  const labelStride = Math.ceil(months.length / 16); // avoid label crowding
  let lastYear = null;
  for (let i = 0; i < months.length; i++) {
    const m = months[i];
    const c = counts[i];
    const h = (c / yMax) * innerH;
    const x = PAD_L + i * barSlot + (barSlot - barW) / 2;
    const y = PAD_T + innerH - h;
    const tooltip = `${monthShortLabel(m)} · ${c.toLocaleString()} filing${c === 1 ? '' : 's'}`;
    barsSvg += `<rect class="tl-bar" data-month="${escapeAttr(m)}" data-count="${c}" data-label="${escapeAttr(tooltip)}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${Math.max(0, h).toFixed(2)}"><title>${escapeHtmlSafe(tooltip)}</title></rect>`;

    if (i % labelStride === 0 || i === months.length - 1) {
      const cx = PAD_L + i * barSlot + barSlot / 2;
      const labelY = PAD_T + innerH + 14;
      xLabelsSvg += `<text class="tl-x-label" x="${cx.toFixed(2)}" y="${labelY}" text-anchor="end" transform="rotate(-45 ${cx.toFixed(2)} ${labelY})">${escapeHtmlSafe(monthShortLabel(m))}</text>`;
    }

    const yr = m.split('/')[1];
    if (yr && yr !== lastYear) {
      if (lastYear !== null) {
        const dx = PAD_L + i * barSlot;
        yearDividerSvg += `<line class="tl-year-divider" x1="${dx.toFixed(2)}" y1="${PAD_T}" x2="${dx.toFixed(2)}" y2="${PAD_T + innerH}"/>`;
      }
      yearDividerSvg += `<text class="tl-year-label" x="${(PAD_L + i * barSlot + 4).toFixed(2)}" y="${PAD_T - 8}">${escapeHtmlSafe(yr)}</text>`;
      lastYear = yr;
    }
  }

  const axisSvg =
    `<line class="tl-axis" x1="${PAD_L}" y1="${PAD_T + innerH}" x2="${PAD_L + innerW}" y2="${PAD_T + innerH}"/>` +
    `<line class="tl-axis" x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T + innerH}"/>`;

  const yAxisTitle = `<text class="tl-tick-label" x="${PAD_L}" y="${PAD_T - 10}" text-anchor="start">filings</text>`;

  const svg = `<svg class="tl-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" aria-label="Monthly Princeton eviction filings">
    ${gridSvg}
    ${yearDividerSvg}
    ${axisSvg}
    ${yLabelSvg}
    ${yAxisTitle}
    ${barsSvg}
    ${xLabelsSvg}
  </svg>`;

  root.innerHTML = sourceNote + headline +
    `<div class="tl-chart-wrap">${svg}<div class="tl-tooltip" id="tl-tooltip"></div></div>`;

  bindTimelineHover();
}

function bindTimelineHover() {
  const wrap = document.querySelector('#timeline-view .tl-chart-wrap');
  const tip = document.getElementById('tl-tooltip');
  if (!wrap || !tip) return;
  wrap.querySelectorAll('rect.tl-bar').forEach(rect => {
    rect.addEventListener('mouseenter', () => {
      const label = rect.getAttribute('data-label') || '';
      const [head, tail] = label.split(' · ');
      tip.innerHTML = `${escapeHtmlSafe(head)} · <strong>${escapeHtmlSafe(tail || '')}</strong>`;
      const r = rect.getBoundingClientRect();
      const wr = wrap.getBoundingClientRect();
      tip.style.left = (r.left + r.width / 2 - wr.left + wrap.scrollLeft) + 'px';
      tip.style.top = (r.top - wr.top - 8) + 'px';
      tip.classList.add('on');
    });
    rect.addEventListener('mouseleave', () => tip.classList.remove('on'));
  });
}

/* ───────────────────────── Map view (heat map + time slider) ───────────────────────── */

// Active data layer for the map: returns { data, months, max } for whichever
// source is selected. Recomputes max each call (cheap; runs once per render).
function mapLayer() {
  const data   = mapSource === 'scraped' ? agg.localTract   : agg.princetonTract;
  const months = mapSource === 'scraped' ? agg.localMonths  : agg.princetonMonths;
  let max = 0;
  for (const g in data) for (const m in data[g]) if (data[g][m] > max) max = data[g][m];
  return { data, months, max };
}

// Tract polygons effectively never change between decennial geographies.
// Cache aggressively; revalidate once a month at most.
const TIGER_TTL_MS = 30 * 24 * 60 * 60 * 1000;

async function fetchTractGeometries() {
  const cached = await localCache.get(CACHE_FILES.tiger);
  if (cached && cached.geo && cached.geo.features && cached.geo.features.length) {
    markSource('tiger', { status: 'ok', rows: cached.geo.features.length, fromCache: true });
    // Trigger a quiet refresh if the entry is stale, but return immediately.
    if (Date.now() - (cached.savedAt || 0) > TIGER_TTL_MS) {
      whenIdle(() => downloadTractGeometries().catch(() => {}));
    }
    return cached.geo;
  }
  return downloadTractGeometries();
}

async function downloadTractGeometries() {
  // Correct service is tigerWMS_Current; tigerWL_Current returns 404. Layer
  // 8 = "Census Tracts (Current)". Try direct (TIGERweb sends permissive
  // CORS) then fall back to the n8n proxy if the browser blocks it.
  markSource('tiger', { status: 'pending' });
  const attempts = [TIGER_TRACT_URL, pxProxy(TIGER_TRACT_URL)];
  let lastErr = null;
  for (const u of attempts) {
    try {
      const r = await fetch(u);
      if (!r.ok) { lastErr = new Error(`HTTP ${r.status}`); continue; }
      const data = await r.json();
      if (data.features && data.features.length) {
        markSource('tiger', { status: 'ok', rows: data.features.length });
        localCache.put(CACHE_FILES.tiger, { geo: data });
        return data;
      }
      lastErr = new Error('no features');
    } catch (e) {
      lastErr = e;
    }
  }
  const msg = lastErr ? lastErr.message : 'unknown';
  markSource('tiger', { status: 'failed', error: msg });
  throw new Error(`TIGER geometry: ${msg}`);
}

// YlOrRd sequential palette
const HEAT_STOPS = [
  [0.00, [255, 255, 178]],
  [0.20, [254, 217, 118]],
  [0.40, [254, 178, 76]],
  [0.60, [253, 141, 60]],
  [0.75, [252, 78, 42]],
  [0.90, [227, 26, 28]],
  [1.00, [177, 0, 38]],
];

function colorForFilings(filings, max) {
  if (filings == null || filings <= 0) return '#1a1814';
  const t = Math.min(1, filings / Math.max(1, max));
  let prev = HEAT_STOPS[0], next = HEAT_STOPS[HEAT_STOPS.length - 1];
  for (let i = 0; i < HEAT_STOPS.length - 1; i++) {
    if (t >= HEAT_STOPS[i][0] && t <= HEAT_STOPS[i+1][0]) {
      prev = HEAT_STOPS[i]; next = HEAT_STOPS[i+1]; break;
    }
  }
  const span = next[0] - prev[0] || 1;
  const f = (t - prev[0]) / span;
  const ch = i => Math.round(prev[1][i] + (next[1][i] - prev[1][i]) * f);
  return `rgb(${ch(0)},${ch(1)},${ch(2)})`;
}

// Unique years present in the active source's month list, newest first.
function availableYears() {
  const { months } = mapLayer();
  const ys = new Set();
  for (const m of months) {
    const yr = m.split('/')[1];
    if (yr) ys.add(yr);
  }
  return [...ys].sort((a, b) => +b - +a);
}

/* Build the active heat frame for the current mapMode.
   Returns:
     { values: { geoid: number }, max, label, tooltipFmt(geoid) → string }
   - alltime:    sum of every month in the source
   - year:       sum within the selected year
   - trajectory: exponentially decayed running total at mapMonth
                 (half-life of TRAJECTORY_HALF_LIFE_MONTHS) */
function mapHeatFrame() {
  const { data, months } = mapLayer();
  const sourceLabel = mapSource === 'scraped' ? 'cases' : 'filings';

  if (!months.length) {
    return { values: {}, max: 0, label: '—', tooltipFmt: () => 'no data' };
  }

  if (mapMode === 'alltime') {
    const values = {}; let max = 0;
    for (const g in data) {
      let s = 0;
      for (const m in data[g]) s += data[g][m] || 0;
      values[g] = s;
      if (s > max) max = s;
    }
    const span = `${months[0]} – ${months[months.length - 1]}`;
    return {
      values, max, label: `All time · ${span}`,
      tooltipFmt: g => `${(values[g] || 0).toLocaleString()} ${sourceLabel} (${span})`,
    };
  }

  if (mapMode === 'year') {
    const yr = mapYear;
    const values = {}; let max = 0;
    for (const g in data) {
      let s = 0;
      for (const m in data[g]) {
        if (m.endsWith('/' + yr)) s += data[g][m] || 0;
      }
      values[g] = s;
      if (s > max) max = s;
    }
    return {
      values, max, label: `${yr}`,
      tooltipFmt: g => `${(values[g] || 0).toLocaleString()} ${sourceLabel} in ${yr}`,
    };
  }

  // trajectory: exponentially decayed running total up through mapMonth.
  const k = months.indexOf(mapMonth);
  if (k < 0) {
    return { values: {}, max: 0, label: mapMonth || '—', tooltipFmt: () => 'no data' };
  }
  const decay = Math.pow(0.5, 1 / TRAJECTORY_HALF_LIFE_MONTHS);
  const values = {}; const thisMonth = {}; let max = 0;
  for (const g in data) {
    let s = 0;
    for (let i = 0; i <= k; i++) {
      const m = months[i];
      const v = data[g][m];
      if (v) s += v * Math.pow(decay, k - i);
    }
    values[g] = s;
    thisMonth[g] = data[g][months[k]] || 0;
    if (s > max) max = s;
  }
  return {
    values, max, label: `Trajectory → ${mapMonth} (½-life ${TRAJECTORY_HALF_LIFE_MONTHS} mo)`,
    tooltipFmt: g => {
      const cur = thisMonth[g] || 0;
      const trail = values[g] || 0;
      return `${mapMonth}: <strong>${cur}</strong> ${sourceLabel}<br>trajectory heat: ${trail.toFixed(1)}`;
    },
  };
}

function updateMapColors() {
  if (!tractLayer) return;
  const frame = mapHeatFrame();
  tractLayer.eachLayer(layer => {
    const geoid = String(layer.feature.properties.GEOID);
    layer.setStyle({ fillColor: colorForFilings(frame.values[geoid] || 0, frame.max) });
  });
  const labelEl = document.getElementById('map-month-label');
  if (labelEl) labelEl.textContent = frame.label;
}

// Show only the controls relevant to the current mode and seed default
// values (year, month) from the source's available data.
function syncMapControls() {
  const { months } = mapLayer();
  const yearGroup = document.getElementById('map-year-group');
  const sliderEl  = document.getElementById('map-slider');
  const isTrajectory = mapMode === 'trajectory';

  sliderEl.style.display = isTrajectory ? '' : 'none';

  if (isTrajectory) {
    if (!months.length) {
      mapMonth = null;
      sliderEl.min = 0; sliderEl.max = 0; sliderEl.value = 0;
    } else {
      let idx = months.indexOf(mapMonth);
      if (idx < 0) idx = months.length - 1;
      mapMonth = months[idx];
      sliderEl.min = 0;
      sliderEl.max = months.length - 1;
      sliderEl.value = idx;
    }
  }

  const isYear = mapMode === 'year';
  yearGroup.style.display = isYear ? '' : 'none';
  if (isYear) {
    const years = availableYears();
    const sel = document.getElementById('map-year-select');
    sel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
    if (!years.includes(mapYear)) mapYear = years[0] || null;
    if (mapYear) sel.value = mapYear;
  }
}
// Back-compat alias: main called syncMapSlider() in places.
const syncMapSlider = syncMapControls;

// Single Leaflet instance for the whole Map tab. Census tracts and
// evictions are two independently toggleable LAYERS on it, never two maps —
// the reader moves between holonic levels (city → tract → building →
// owner's whole portfolio) by toggling/clicking on one continuous map
// rather than switching tabs.
async function renderMapView() {
  const status = document.getElementById('map-status');
  const note = document.getElementById('ll-coverage-note');
  const tractsOn = document.getElementById('layer-tracts').checked;
  const evictionsOn = document.getElementById('layer-evictions').checked;

  // Hide every layer-specific control while (re)loading so nothing shows
  // stale controls for a layer that isn't actually on the map yet.
  document.getElementById('map-controls').style.display = 'none';
  document.getElementById('clip-bar').style.display = 'none';
  status.textContent = 'Loading map…';
  status.style.display = '';

  // Leaflet core is shared by both layers — loaded once, on first visit to
  // this tab, whichever layer(s) a reader has on.
  try {
    await Promise.all([
      loadStyle(LEAFLET_CSS_URL),
      loadScript(LEAFLET_JS_URL),
    ]);
  } catch (e) {
    status.textContent = 'Failed to load map library: ' + e.message;
    return;
  }

  if (!leafletMap) {
    // Zoom sits bottom-left: the hot-zones panel owns the top-left corner and
    // the two detail panels own the right edge.
    leafletMap = L.map('map', { zoomControl: false, attributionControl: false });
    L.control.zoom({ position: 'bottomleft' }).addTo(leafletMap);
    // Esri's hosted "Dark Gray Canvas" basemap (base + labels, two stacked
    // tile layers) -- free, no API key, no account, ever. Two other free
    // options were tried and rejected first, both live: CARTO's hosted
    // basemaps (dark_nolabels, what this map used before) now require an
    // API key -- confirmed in production, the reason this changed at all.
    // Plain OpenStreetMap raster tiles (tile.openstreetmap.org) were tried
    // next and actively BLOCKED mid-testing -- OSM's own tile usage policy
    // (osm.wiki/Blocked) reserves the right to refuse exactly this shape of
    // traffic (an app embedding their tiles) without prior arrangement, and
    // it did so on every tile, not just a rate-limited few. Esri's basemap
    // tiles carry no such policy for ordinary display use, are natively
    // dark (no CSS invert filter needed to fake a theme over light tiles),
    // and are the standard free, keyless Leaflet basemap choice for exactly
    // this reason.
    L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
    }).addTo(leafletMap);
    // Labels overlay -- added second so it stacks above the base tiles
    // (both share Leaflet's default tilePane; later-added wins ties),
    // still below the tract choropleth/markers, which live in their own
    // higher panes regardless of tile add order.
    L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
    }).addTo(leafletMap);
    L.control.attribution({ prefix: false })
      .addAttribution('Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors · Tracts © US Census · Ownership via <a href="https://landlordmapper.org/" target="_blank" rel="noopener">Landlord Mapper</a>')
      .addTo(leafletMap);
  }

  // The two layers' own setup (each may hit the network — tract geometry
  // from TIGERweb, cluster/heat plugin scripts) runs CONCURRENTLY, not one
  // after the other. Sequential awaits here would mean a slow tract-boundary
  // fetch blocks the eviction dots from ever appearing, even though the two
  // layers are otherwise fully independent — measured live: a real fetch
  // that takes longer than a few seconds left the evictions layer entirely
  // unbuilt because the function was still parked awaiting tract geometry.
  const { months } = mapLayer();
  const tractDataReady = months.length > 0;
  await Promise.all([
    ensureTractLayer(tractsOn && tractDataReady, status),
    ensureEvictionsLayer(evictionsOn && !!(allRows && allRows.length), status, note),
  ]);

  // Frame the map on whatever layer(s) actually have something to show —
  // once only, on first load, so toggling a layer later never yanks the
  // view out from under a reader who has already panned/zoomed.
  if (!mapDidInitialFit) {
    const boundsList = [];
    if (tractsOn && tractLayer) boundsList.push(tractLayer.getBounds());
    if (evictionsOn && llPropertyIndex && llPropertyIndex.properties.length) {
      boundsList.push(L.latLngBounds(llPropertyIndex.properties.map(p => [p.lat, p.lng])));
    }
    if (boundsList.length) {
      const combined = boundsList.reduce((a, b) => a.extend(b));
      leafletMap.fitBounds(combined, { padding: [20, 20] });
      mapDidInitialFit = true;
    }
  }

  syncMapControls();
  updateMapColors();
  updateMapLayerVisibility();

  // Checked against what actually got BUILT, not just what was theoretically
  // available — a data source with months but a failed geometry fetch (or a
  // failed plugin load) is not "something to show" just because the data
  // existed on paper.
  const somethingToShow = !!(tractsOn && tractLayer) || !!(evictionsOn && llPropertyIndex && llPropertyIndex.properties.length);
  if (somethingToShow) {
    status.style.display = 'none';
  } else if (tractsOn && tractDataReady && !tractLayer) {
    status.style.display = '';
    status.textContent = 'Failed to load tract boundaries — see the console for details.';
  } else {
    status.style.display = '';
    status.textContent = (!allRows || !allRows.length)
      ? 'No case data loaded yet.'
      : 'No scraped cases have census tracts yet.';
  }
  setTimeout(() => leafletMap && leafletMap.invalidateSize(), 50);
}

// Outer holon: census-tract choropleth, the whole city at once. Builds
// tractLayer at most once (subsequent calls with shouldBuild=true just
// no-op past the existence checks); never touches the map's layer
// membership itself — updateMapLayerVisibility() owns add/remove.
// finally, not just a trailing call: shouldBuild=false, a failed fetch, and
// the happy path all need the SAME "make this layer's own controls agree
// with reality right now" step, and none of them should have to wait on
// ensureEvictionsLayer's own unrelated, independently-timed network calls
// to get there (measured live: a slow tract fetch was delaying evictions'
// own controls from ever appearing, because both used to only sync at the
// shared tail of renderMapView, after BOTH finished).
async function ensureTractLayer(shouldBuild, status) {
  try {
    if (!shouldBuild) return;
    if (!tractGeometries) {
      status.textContent = 'Fetching Davidson County tract boundaries from TIGERweb…';
      try {
        tractGeometries = await fetchTractGeometries();
      } catch (e) {
        console.warn('tract geometry fetch failed:', e);
        return;
      }
    }
    if (tractGeometries && !tractLayer) {
      tractLayer = L.geoJSON(tractGeometries, {
        style: () => ({
          fillColor: '#1a1814', fillOpacity: 0.75,
          color: '#2a2820', weight: 1, opacity: 0.6,
        }),
        onEachFeature: (feature, layer) => {
          const geoid = String(feature.properties.GEOID);
          layer.on('mouseover', e => {
            const frame = mapHeatFrame();
            const info = agg.tractInfo[geoid];
            const nameLine = info && info.name ? info.name : `Tract ${geoid}`;
            const repLine = info && info.rep ? ` · ${escapeHtml(info.rep)}` : '';
            const districtLine = info && info.district ? `<br>${escapeHtml(info.district)}${repLine}` : '';
            layer.bindTooltip(
              `<strong>${nameLine}</strong>${districtLine}<br>${frame.tooltipFmt(geoid)}<br><span style="color:#c4a44a">click for detail</span>`,
              { sticky: true }
            ).openTooltip(e.latlng);
            layer.setStyle({ weight: 2, color: '#c4a44a' });
          });
          layer.on('mouseout', () => {
            layer.closeTooltip();
            if (geoid !== selectedTract) layer.setStyle({ weight: 1, color: '#2a2820' });
          });
          layer.on('click', () => openTractPanel(geoid));
        },
      });

      const slider = document.getElementById('map-slider');
      slider.addEventListener('input', e => {
        const { months: ms } = mapLayer();
        mapMonth = ms[parseInt(e.target.value, 10)];
        updateMapColors();
        syncMapUrl();
      });
      document.getElementById('map-year-select').addEventListener('change', e => {
        mapYear = e.target.value;
        updateMapColors();
        syncMapUrl();
      });
    }
  } finally {
    // Own controls reflect reality the moment THIS layer's setup is done,
    // never gated on how long the eviction layer's own setup takes.
    syncMapControls();
    updateMapColors();
    updateMapLayerVisibility();
  }
}

// Middle holon: one dot per building.
async function ensureEvictionsLayer(shouldBuild, status, note) {
  try {
    if (!shouldBuild) return;
    try {
      await Promise.all([
        loadStyle(MARKERCLUSTER_CSS_URL),
        loadStyle(MARKERCLUSTER_DEFAULT_CSS_URL),
        loadScript(MARKERCLUSTER_JS_URL),
        loadScript(LEAFLET_HEAT_JS_URL),
      ]);
    } catch (e) {
      console.warn('eviction-layer plugin load failed:', e);
      return;
    }

    if (!llPropertyIndex) llPropertyIndex = buildPropertyIndex();
    const { properties, totalCases, withCoords } = llPropertyIndex;
    const pct = totalCases ? Math.round(100 * withCoords / totalCases) : 0;
    note.textContent = `${properties.length.toLocaleString()} mapped buildings, from ${withCoords.toLocaleString()} of ${totalCases.toLocaleString()} cases with a resolved address (${pct}%). Cases without a geocoded address aren't shown here — see the Cases tab for the full docket.`;
    if (!properties.length) return;

    // Initialize the time controls ONCE, from the real span of dated,
    // mappable filings — never reset on a later tab switch, so a reader's
    // chosen window survives navigating away and back.
    if (llStartTs === null) {
      let minTs = Infinity, maxTs = -Infinity;
      for (const p of properties) for (const c of p.cases) {
        const t = parseUsDate(c.file_date);
        if (!t) continue;
        if (t < minTs) minTs = t;
        if (t > maxTs) maxTs = t;
      }
      if (!Number.isFinite(minTs)) { minTs = Date.now(); maxTs = Date.now(); }
      // The clip's track is the WHOLE record and never moves; only the window
      // inside it does. Snapped to month starts so the track's extent lines up
      // with the histogram bars drawn against it.
      llDataMinTs = snapMonth(minTs);
      llDataMaxTs = Math.max(snapMonth(maxTs), llDataMinTs + MONTH_MS);
      buildClipHistogram();
      // A shared/bookmarked link may have already asked for a narrower window
      // (restoreStateFromUrl) before the real data range was known — apply it
      // now, clamped so a stale or out-of-range link can't point outside what
      // this dataset actually covers.
      const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
      if (llUrlRestorePending) {
        const req = llUrlRestorePending;
        llStartTs = clamp(req.start ?? minTs, minTs, maxTs);
        llEndTs = clamp(req.end ?? maxTs, minTs, maxTs);
        llCursorTs = clamp(req.cursor ?? llEndTs, llStartTs, llEndTs);
        if (req.halflife) llHalfLifeMonths = req.halflife;
        llUrlRestorePending = null;
      } else {
        llStartTs = minTs; llEndTs = maxTs; llCursorTs = maxTs;
      }
      bindLandlordsTimeControls();
      setLandlordsTimeInputs();
    }
    applyLandlordsTimeFilter();
  } finally {
    // Own controls reflect reality the moment THIS layer's setup is done,
    // never gated on how long the tract layer's own (often slower, network-
    // bound) setup takes.
    updateMapLayerVisibility();
  }
}

// Adds/removes each Leaflet layer to/from the map per the two layer
// checkboxes, and shows/hides each layer's own control group — the one
// place that keeps "what's checked" and "what's actually drawn" in
// agreement, called after every render and every checkbox change.
function updateMapLayerVisibility() {
  const tractsOn = document.getElementById('layer-tracts').checked;
  const evictionsOn = document.getElementById('layer-evictions').checked;
  const { months } = mapLayer();
  const tractsReady = tractsOn && months.length > 0;

  if (tractLayer) {
    if (tractsReady && !leafletMap.hasLayer(tractLayer)) tractLayer.addTo(leafletMap);
    if (!tractsReady && leafletMap.hasLayer(tractLayer)) leafletMap.removeLayer(tractLayer);
  }
  document.getElementById('map-mode-group').style.display   = tractsReady ? '' : 'none';
  document.getElementById('map-controls').style.display     = tractsReady ? '' : 'none';
  if (!tractsReady) document.getElementById('map-year-group').style.display = 'none';

  const evictionsReady = evictionsOn && !!(allRows && allRows.length) && llStartTs !== null;
  if (evictionsOn) {
    updateLandlordsLayer();
  } else {
    if (llClusterGroup && leafletMap.hasLayer(llClusterGroup)) leafletMap.removeLayer(llClusterGroup);
    if (llHeatLayer && leafletMap.hasLayer(llHeatLayer)) leafletMap.removeLayer(llHeatLayer);
    if (llHighlightLayer && leafletMap.hasLayer(llHighlightLayer)) leafletMap.removeLayer(llHighlightLayer);
    closePropertyPanel();
  }
  document.getElementById('ll-mode-group').style.display        = evictionsOn    ? '' : 'none';
  document.getElementById('ll-signal-group').style.display      = evictionsOn    ? '' : 'none';
  document.getElementById('hotzones').style.display             = evictionsReady ? '' : 'none';
  document.getElementById('clip-bar').style.display             = evictionsReady ? '' : 'none';
  document.getElementById('ll-highlight-banner').style.display  = (evictionsOn && llHighlightKeys) ? '' : 'none';
  syncMapUrl();
}

/* ─────────────────── Building / landlord-portfolio layer ───────────────
   One dot per building. Click a building to see every filing at that
   address, then — via a live lookup against Landlord Mapper's public API
   — who owns it and a link straight to their page there, so the reader
   can see everything else that owner holds without this app trying to
   re-derive Landlord Mapper's own ownership-matching work. From there, a
   reader can step up a holonic level: from one building to that owner's
   whole known portfolio, its own filing trajectory, and every one of
   their buildings highlighted together on the same map. */

function normalizeAddressKey(addr) {
  if (!addr) return null;
  return String(addr).toUpperCase().replace(/[.,#]/g, '').replace(/\s+/g, ' ').trim();
}

// Groups every geocoded case by building address. A case only has
// latitude/longitude once its address has been enriched and geocoded —
// today that's a real subset of the docket, never assumed to be all of it
// (see the coverage note rendered alongside the map).
function buildPropertyIndex() {
  const byAddr = new Map();
  let withCoords = 0;
  for (const r of allRows) {
    const lat = Number(r.latitude), lng = Number(r.longitude);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
    withCoords++;
    const key = normalizeAddressKey(r.address_formatted) || `${lat.toFixed(5)},${lng.toFixed(5)}`;
    if (!byAddr.has(key)) {
      byAddr.set(key, {
        key, lat, lng,
        addressDisplay: r.address_formatted || r.geocoded_address || key,
        cases: [], landlords: new Map(),  // landlord name -> count of cases
      });
    }
    const p = byAddr.get(key);
    p.cases.push(r);
    const landlordName = (r.Plaintiff_1 || '').trim();
    if (landlordName) p.landlords.set(landlordName, (p.landlords.get(landlordName) || 0) + 1);
  }
  for (const p of byAddr.values()) {
    p.cases.sort((a, b) => (parseUsDate(b.file_date) || 0) - (parseUsDate(a.file_date) || 0));
    p.evictionCount = p.cases.length;
    p.primaryLandlord = [...p.landlords.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || null;
  }
  return { properties: [...byAddr.values()], totalCases: allRows.length, withCoords };
}

function parseUsDate(v) {
  const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? new Date(+m[3], +m[1] - 1, +m[2]).getTime() : 0;
}

// Monthly filing counts, shaped for the SAME sparklineHtml()/sortMonthsAsc()
// the Districts view already uses (caseFileDateToMonth too) — reused rather
// than reinvented, so a building or owner's trend reads in the same visual
// language as everything else here, instead of a second charting mechanism.
function monthlyTrajectory(cases, maxMonths = 18) {
  const monthsMap = {};
  for (const c of cases) {
    const m = caseFileDateToMonth(c.file_date);
    if (m) monthsMap[m] = (monthsMap[m] || 0) + 1;
  }
  let months = sortMonthsAsc(Object.keys(monthsMap));
  if (months.length > maxMonths) months = months.slice(months.length - maxMonths);
  return { monthsMap, months };
}

function llMarkerColor(heat) {
  if (heat >= 6) return '#e85d3a';
  if (heat >= 2) return '#e8a735';
  return '#c4a44a';
}

function llMarkerRadius(heat) {
  return Math.min(6 + Math.sqrt(heat) * 3, 24);
}

/* ────────────────────── Three signals, never one score ───────────────────
   The map used to colour by decayed VOLUME alone, which is why the largest
   apartment complexes were permanently the reddest: volume is mostly a
   proxy for how many doors a place has. These are three different questions
   about the same window, reported and coloured separately — never summed
   into one opaque "risk score", because they disagree and the disagreement
   is the information.

   Each was BACKTESTED before being built (hold out the last 6 months,
   compute the signal from history only, measure what actually happened) and
   each is reported below with its own measured number, its dumb baseline,
   and a control built to fail. The numbers live in SIGNAL_CALIBRATION and
   are shown in the UI rather than kept in a commit message.

     VOLUME    — best predictor of raw future volume, and it is a one-line
                 sort. Kept, and labelled as what it is.
     UNUSUAL   — the licensed windowMean/shuffle pair from eoreader's `nul`,
                 placed against reshuffles of each unit's OWN history. It
                 LOSES to the volume sort on prediction (measured: 57.0 vs
                 101.5 filings/tract). Its value is different: it is the only
                 one that can say a big steady complex is normal FOR ITSELF,
                 and the only one that REFUSES when a unit has too little
                 history to judge.
     PRESSURE  — the landlord's filing activity at their OTHER buildings.
                 The one genuinely additive signal: on buildings with ZERO
                 filings of their own in the window — invisible to every
                 volume ranking — it separates 4.93x, against a control that
                 shuffles the ownership pairing and keeps both marginals
                 (median 0.78x, 0/200 draws reached the observed lift). */

const SIGNAL_CALIBRATION = Object.freeze({
  measuredOn: 'Walk-forward backtest over 17 strictly-causal cutoffs (each sees only its own past), 77,464 filings, 6-month horizons.',
  volume:   { label: 'Volume',
              line: 'Won every one of 17 causal cutoffs: top-20 tracts averaged 119 filings in the next 6 months against 17 for the field. It is a sort, not a model, and nothing here beat it.' },
  unusual:  { label: 'Unusual for itself',
              line: 'Real but second: 68 filings vs 17 for the field, and it lost to the plain volume sort at all 17 cutoffs. Its use is different — it is the only one that calls a big steady complex ordinary FOR ITSELF, and the only one that refuses when a place has too little history to judge.' },
  pressure: { label: 'Landlord pressure',
              line: 'Narrow and modest. Among buildings with ZERO filings of their own, in a window where address coverage is uniform, those whose landlord was busiest elsewhere saw 1.50x the stratum (0.36 vs 0.24) — 0/200 draws of a shuffled-ownership control reached it. An earlier 4.93x reading was inflated about threefold by uneven address coverage and is withdrawn. As a tract-level ranking it is worthless (indistinguishable from random across all 17 cutoffs); it applies to quiet BUILDINGS only.' },
});

let llSignalMode = 'volume';        // 'volume' | 'pressure' | 'unusual'
let llUnusual = null;               // Map<key, {rank, censored}> | null until computed
let llUnusualState = 'idle';        // 'idle' | 'loading' | 'ready' | 'failed'
let llUnusualWorker = null, llUnusualSeq = 0, llUnusualTimer = null;

const NUL_CDN = 'https://cdn.jsdelivr.net/gh/clovenbradshaw-ctrl/eoreader6.1@main/nul/index.js';
const UNUSUAL_WINDOW = 6, UNUSUAL_DRAWS = 100, UNUSUAL_SEED = 0, UNUSUAL_ALPHA = 0.05;

/**
 * A landlord's filings inside the window at every building EXCEPT this one.
 * Pure counting — no null needed, because the claim ("this owner is busy
 * elsewhere right now") is a count, not an inference. The null-tested part
 * is whether that count predicts anything, and that was settled in the
 * backtest rather than being recomputed per frame here.
 */
function computeLandlordPressure(properties) {
  const byLandlord = new Map();
  for (const p of properties) {
    const name = p.primaryLandlord;
    if (!name) continue;
    byLandlord.set(name, (byLandlord.get(name) || 0) + p.countInRange);
  }
  const out = new Map();
  let max = 0;
  for (const p of properties) {
    const name = p.primaryLandlord;
    const elsewhere = name ? (byLandlord.get(name) || 0) - p.countInRange : 0;
    out.set(p.key, elsewhere);
    if (elsewhere > max) max = elsewhere;
  }
  return { pressure: out, maxPressure: max };
}

/**
 * The nul-backed signal, in a worker because it is 5s of arithmetic at this
 * scale and the clip has to stay draggable while it runs. Debounced: the
 * playhead moves continuously, and there is no point starting a five-second
 * job on every frame of a drag.
 *
 * Every unit's series is truncated at the playhead first — the question is
 * "unusual as of the moment being viewed", not "unusual ever" — then
 * reversed, so `windowMean` (which reads the FIRST window of what it is
 * given) reads the MOST RECENT months. That detail was found by probing the
 * real module rather than assuming: burstiness is the largest window
 * anywhere, windowMean is one window at the front, and mixing them up
 * silently answers a different question.
 */
function requestUnusual() {
  if (llUnusualTimer) clearTimeout(llUnusualTimer);
  llUnusualTimer = setTimeout(() => computeUnusual(), 350);
}

function computeUnusual() {
  if (!llPropertyIndex || llSignalMode !== 'unusual') return;
  const seq = ++llUnusualSeq;

  const units = [];
  for (const p of llPropertyIndex.properties) {
    const bins = new Map();
    for (const c of p.cases) {
      const t = parseUsDate(c.file_date);
      if (!t || t < llStartTs || t > llCursorTs) continue;
      const k = snapMonth(t);
      bins.set(k, (bins.get(k) || 0) + 1);
    }
    if (!bins.size) continue;
    // A dense series across the whole window, not just the months that fired:
    // the zero months ARE the history a burst is unusual against.
    const series = [];
    for (let m = snapMonth(llStartTs); m <= llCursorTs; m = new Date(Date.UTC(new Date(m).getUTCFullYear(), new Date(m).getUTCMonth() + 1, 1)).getTime()) {
      series.push(bins.get(m) || 0);
    }
    if (series.length >= UNUSUAL_WINDOW * 2) units.push({ key: p.key, series });
  }

  if (!units.length) {
    // Not "nothing is unusual" — "this window is too short to ask". A test
    // that cannot run must say so; reporting it as a clean zero is how a
    // refusal gets mistaken for a finding.
    llUnusual = null;
    llUnusualState = 'too-short';
    updateSignalLegend();
    return;
  }

  llUnusualState = 'loading';
  updateSignalLegend();
  try {
    if (!llUnusualWorker) llUnusualWorker = makeUnusualWorker();
    llUnusualWorker.postMessage({ seq, units, window: UNUSUAL_WINDOW, draws: UNUSUAL_DRAWS, seed: UNUSUAL_SEED });
  } catch (e) {
    console.warn('unusual-signal worker failed:', e);
    llUnusualState = 'failed';
    updateSignalLegend();
  }
}

/* A module worker built from a Blob so this stays a single-file app, importing
   the REAL nul from the same CDN the Chat tab already uses for eoreader. If
   the import fails the signal reports 'failed' and the map falls back to
   volume — it never silently colours by something else. */
function makeUnusualWorker() {
  const src = `
    import * as nul from ${JSON.stringify(NUL_CDN)};
    self.onmessage = (e) => {
      const { seq, units, window: W, draws, seed } = e.data;
      const out = []; const refusals = {};
      for (const u of units) {
        const series = [...u.series].reverse();
        const g = nul.ground({ material: series, draws, window: W, perturbation: 'shuffle', statistic: 'windowMean', seed, via: 'eviction-overwatch' });
        if (nul.isGap(g)) { refusals[g.gap] = (refusals[g.gap] || 0) + 1; continue; }
        const observed = nul.STATISTICS.windowMean(series, { window: W });
        const placed = nul.difference(observed, g);
        if (nul.isGap(placed)) {
          if (placed.gap === 'exceeds_witness') out.push([u.key, placed.direction === 'above' ? 0 : 1, placed.direction]);
          else refusals[placed.gap] = (refusals[placed.gap] || 0) + 1;
          continue;
        }
        out.push([u.key, placed.rank, null]);
      }
      self.postMessage({ seq, out, refusals });
    };
    self.postMessage({ ready: true });
  `;
  const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })), { type: 'module' });
  w.onmessage = (e) => {
    if (e.data.ready) return;
    if (e.data.seq !== llUnusualSeq) return;   // a newer request already superseded this one
    llUnusual = new Map(e.data.out.map(([k, rank, censored]) => [k, { rank, censored }]));
    llUnusual.refusals = e.data.refusals;
    llUnusualState = 'ready';
    updateSignalLegend();
    if (llSignalMode === 'unusual') applyLandlordsTimeFilter();
  };
  w.onerror = (err) => {
    console.warn('unusual-signal worker error:', err.message || err);
    llUnusualState = 'failed';
    updateSignalLegend();
  };
  return w;
}

/** What the current colouring means, and what it measured. Always visible. */
function updateSignalLegend() {
  const el = document.getElementById('ll-signal-legend');
  if (!el) return;
  const cal = SIGNAL_CALIBRATION[llSignalMode];
  let status = '';
  if (llSignalMode === 'unusual') {
    if (llUnusualState === 'loading') status = ' <span class="sig-status">computing…</span>';
    else if (llUnusualState === 'too-short') status = ` <span class="sig-status warn">window too short to run this test — it needs at least ${UNUSUAL_WINDOW * 2} months; widen the clip</span>`;
    else if (llUnusualState === 'failed') status = ' <span class="sig-status warn">could not load the null-test module — showing volume instead</span>';
    else if (llUnusualState === 'ready' && llUnusual) {
      const refused = Object.values(llUnusual.refusals || {}).reduce((a, b) => a + b, 0);
      const flagged = [...llUnusual.values()].filter(v => v.rank <= UNUSUAL_ALPHA).length;
      status = ` <span class="sig-status">${flagged.toLocaleString()} flagged · ${refused.toLocaleString()} refused as too little history to judge</span>`;
    }
  }
  el.innerHTML = `<strong>${escapeHtml(cal.label)}</strong> — ${escapeHtml(cal.line)}${status}`;
}

/** The colour a dot takes under the active signal. */
function signalColorFor(p, ctx) {
  if (llSignalMode === 'pressure') {
    const v = ctx.pressure?.get(p.key) || 0;
    if (v >= 40) return '#e85d3a';
    if (v >= 8) return '#e8a735';
    if (v > 0) return '#c4a44a';
    return '#5f5636';
  }
  if (llSignalMode === 'unusual' && llUnusualState === 'ready' && llUnusual) {
    const u = llUnusual.get(p.key);
    if (!u) return '#4a443a';                       // refused: not enough history to judge
    if (u.censored === 'above') return '#e85d3a';   // beyond every reshuffle of its own past
    if (u.rank <= UNUSUAL_ALPHA) return '#e8a735';
    if (u.rank >= 1 - UNUSUAL_ALPHA) return '#3f6b8a'; // unusually QUIET — cooling, not hot
    return '#5f5636';
  }
  return llMarkerColor(p.heat);
}

/** The active signal's own reading for this building, shown on hover. */
function signalTooltipFor(p, ctx) {
  if (llSignalMode === 'pressure') {
    const v = ctx.pressure?.get(p.key) || 0;
    return v > 0
      ? `<br><span style="color:#e8a735">landlord pressure: ${v} filing${v === 1 ? '' : 's'} at their other buildings</span>`
      : '<br><span style="color:#8a8272">landlord pressure: none elsewhere in this window</span>';
  }
  if (llSignalMode === 'unusual') {
    if (llUnusualState !== 'ready' || !llUnusual) return '';
    const u = llUnusual.get(p.key);
    if (!u) return '<br><span style="color:#8a8272">too little history here to judge</span>';
    if (u.censored === 'above') return '<br><span style="color:#e85d3a">beyond every reshuffle of its own past</span>';
    if (u.rank <= UNUSUAL_ALPHA) return `<br><span style="color:#e8a735">unusually busy for itself (rank ${u.rank.toFixed(2)})</span>`;
    if (u.rank >= 1 - UNUSUAL_ALPHA) return '<br><span style="color:#7fb0d0">unusually quiet for itself</span>';
    return `<br><span style="color:#8a8272">ordinary for itself (rank ${u.rank.toFixed(2)})</span>`;
  }
  return '';
}

/** The radius a dot takes under the active signal. */
function signalRadiusFor(p, ctx) {
  if (llSignalMode === 'pressure') {
    const v = ctx.pressure?.get(p.key) || 0;
    return Math.min(6 + Math.sqrt(v) * 2.2, 24);
  }
  if (llSignalMode === 'unusual' && llUnusualState === 'ready' && llUnusual) {
    const u = llUnusual.get(p.key);
    if (!u) return 5;
    return u.censored === 'above' ? 16 : u.rank <= UNUSUAL_ALPHA ? 12 : 7;
  }
  return llMarkerRadius(p.heat);
}

/* ─────────────────────────── Hot zones ──────────────────────────────────
   The ranked answer to "where should I look this week", computed over the
   clip's current window and re-read every time the window moves.

   TRACT level, deliberately. The walk-forward backtest says the honest
   ranking here is VOLUME — it won all 17 causal cutoffs — so that is what
   this ranks by, rather than the more interesting-sounding statistic that
   measurably lost to it. What the null-tested reading adds is the second
   line: whether a zone's own recent rate is unusual FOR ITSELF, which is
   what separates "big place, busy as always" from "something changed here".
   Both are shown; neither is merged into a score. */

const HOTZONE_COUNT = 12;

function tractDisplayName(geoid) {
  const info = agg.tractInfo?.[geoid];
  if (info?.name) return info.name;
  if (info?.district) return `${info.district} · tract ${geoid}`;
  return `Tract ${geoid}`;
}

/** Filings per tract inside [llStartTs, llCursorTs], and the window before it. */
function computeHotZones() {
