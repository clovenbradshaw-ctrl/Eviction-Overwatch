  if (!allRows?.length || llStartTs === null) return null;
  const span = Math.max(MONTH_MS, llCursorTs - llStartTs);
  const prevStart = llStartTs - span;
  const now = new Map(), prev = new Map(), landlords = new Map();

  for (const r of allRows) {
    const geoid = r.tract_geoid || r.census_tract;
    if (!geoid) continue;
    const t = parseUsDate(r.file_date);
    if (!t) continue;
    if (t >= llStartTs && t <= llCursorTs) {
      now.set(geoid, (now.get(geoid) || 0) + 1);
      const pl = (r.Plaintiff_1 || '').trim();
      if (pl) {
        if (!landlords.has(geoid)) landlords.set(geoid, new Map());
        landlords.get(geoid).set(pl, (landlords.get(geoid).get(pl) || 0) + 1);
      }
    } else if (t >= prevStart && t < llStartTs) {
      prev.set(geoid, (prev.get(geoid) || 0) + 1);
    }
  }
  const zones = [...now.entries()].map(([geoid, n]) => {
    const before = prev.get(geoid) || 0;
    const top = [...(landlords.get(geoid) || new Map()).entries()].sort((a, b) => b[1] - a[1])[0] || null;
    return { geoid, n, before, delta: n - before, topLandlord: top ? top[0] : null, topLandlordN: top ? top[1] : 0 };
  });
  zones.sort((a, b) => b.n - a.n);
  return { zones, span, prevStart, comparable: prev.size > 0 };
}

function renderHotZones() {
  const body = document.getElementById('hz-body');
  const sub = document.getElementById('hz-sub');
  if (!body) return;
  const res = computeHotZones();
  if (!res || !res.zones.length) {
    body.innerHTML = '<div class="hz-empty">No filings with a census tract inside this window. Widen the clip.</div>';
    if (sub) sub.textContent = '';
    return;
  }
  const { zones, comparable } = res;
  const months = Math.max(1, Math.round(res.span / MONTH_MS));
  if (sub) sub.textContent = `by filings · ${toISODate(llStartTs)} → ${toISODate(llCursorTs)} (${months} mo)`;

  const top = zones.slice(0, HOTZONE_COUNT);
  body.innerHTML = top.map((z, i) => {
    // "Why" is the comparison to the SAME-LENGTH window immediately before —
    // the clip's own duration, slid back once. No model, just the two counts.
    let trend = '';
    if (comparable) {
      const pct = z.before ? Math.round(100 * z.delta / z.before) : null;
      trend = z.delta > 0
        ? `<span class="up">▲ ${z.delta} more</span> than the previous ${months} mo${pct !== null ? ` (${pct > 0 ? '+' : ''}${pct}%)` : ''}`
        : z.delta < 0
          ? `<span class="down">▼ ${Math.abs(z.delta)} fewer</span> than the previous ${months} mo`
          : `level with the previous ${months} mo`;
    }
    const who = z.topLandlord
      ? `<br>most active filer: ${escapeHtml(z.topLandlord.slice(0, 38))} (${z.topLandlordN})`
      : '';
    return `<div class="hz-row" onclick="openTractPanel('${escapeAttr(z.geoid)}')" title="Open this tract">
      <span class="hz-rank">${i + 1}</span>
      <span>
        <span class="hz-name">${escapeHtml(tractDisplayName(z.geoid))}</span>
        <span class="hz-why">${trend}${who}</span>
      </span>
      <span class="hz-n">${z.n}</span>
    </div>`;
  }).join('') + `<div class="hz-note">Ranked by filing count — the plainest reading, and the one
    that beat every cleverer ranking at all 17 causal cutoffs of the backtest. Census tract is
    ~96% populated in every month of this record; building addresses are not, so zones are the
    grain where a trend is real.</div>`;
}

// Re-derives heat under the current start/end/cursor/half-life and redraws
// both layers. Called on first render and on every control change — cheap
// enough at this data size to just rebuild rather than diff.
function applyLandlordsTimeFilter() {
  if (!llPropertyIndex) return;
  const { properties, maxHeat } = computeHeat(llPropertyIndex.properties);
  const ctx = computeLandlordPressure(properties);
  buildLandlordsLayers(properties, maxHeat, ctx);
  updateLandlordsLayer();
  updateSignalLegend();
  renderHotZones();
  if (llSignalMode === 'unusual' && llUnusualState === 'idle') requestUnusual();
  const note = document.getElementById('ll-coverage-note');
  if (note) {
    note.textContent = `${properties.length.toLocaleString()} building(s) with filings in the window`;
  }
  // The URL is rewritten on every playback frame otherwise -- replaceState is
  // cheap but not free, and a URL that churns 60x a second is not a URL anyone
  // can copy. The playhead's final position lands when playback stops.
  if (!llPlaying) syncMapUrl();
}


/* ─────────────────────────── The clip ───────────────────────────────
   One object standing for the whole record: a filings-per-month histogram
   (the "waveform"), a draggable in/out window over it, and a playhead. It
   replaced four date inputs and a slider that did not know about each other
   -- the reason being that trimming a window is a thing you do by eye
   against visible content, not by typing dates and hoping.

   llDataMinTs/llDataMaxTs are the track's fixed extent (the whole record).
   llStartTs/llEndTs are the clip's in/out. llCursorTs is the playhead. */

let llDataMinTs = null, llDataMaxTs = null;
let llMonthBins = [];          // [{ ts, count }] across the full extent
let llPlaying = false, llPlayRaf = null, llPlayLast = 0;
const CLIP_PLAY_MONTHS_PER_SEC = 3;

const MONTH_MS = 30.44 * DAY_MS;
const clipSpan = () => Math.max(1, llDataMaxTs - llDataMinTs);
const tsToFrac = (ts) => (ts - llDataMinTs) / clipSpan();
const fracToTs = (f) => llDataMinTs + Math.min(1, Math.max(0, f)) * clipSpan();
/* Snap to month starts. A window that begins mid-month is a window whose
   edges do not line up with the bars you dragged it against. */
const snapMonth = (ts) => { const d = new Date(ts); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); };

/* Monthly counts across the whole record, PLUS the address-coverage ratio for
   each month — and the second half is the load-bearing one.

   Measured on the live snapshot: address/geocode coverage is not uniform. Two
   multi-month blocks (2023-07..2024-04 and 2024-11..2025-05) carry ZERO
   geocoded addresses, while census_tract sits at ~96% in every month. A
   building-level series crossing one of those blocks shows a deep trough that
   is the ENRICHMENT PIPELINE, not a drop in evictions — and read as a trend it
   inverts the truth: the quietest-looking buildings there are the ones we
   simply could not place. So the clip draws coverage explicitly rather than
   letting a reader mistake a gap in our own data for a change in the world. */
function buildClipHistogram() {
  const counts = new Map(), placed = new Map(), total = new Map();
  for (const p of (llPropertyIndex?.properties || [])) {
    for (const c of p.cases) {
      const t = parseUsDate(c.file_date);
      if (!t) continue;
      const k = snapMonth(t);
      counts.set(k, (counts.get(k) || 0) + 1);
      placed.set(k, (placed.get(k) || 0) + 1);
    }
  }
  // Every dated case, mapped or not — the denominator the dots cannot show.
  for (const r of (allRows || [])) {
    const t = parseUsDate(r.file_date);
    if (!t) continue;
    const k = snapMonth(t);
    total.set(k, (total.get(k) || 0) + 1);
  }
  const keys = [...new Set([...counts.keys(), ...total.keys()])].sort((a, b) => a - b);
  llMonthBins = keys.map(ts => {
    const tot = total.get(ts) || 0;
    return { ts, count: counts.get(ts) || 0, total: tot, coverage: tot ? (placed.get(ts) || 0) / tot : 0 };
  });
}

function drawClipHistogram() {
  const cv = document.getElementById('clip-hist');
  if (!cv || !llMonthBins.length) return;
  const rect = cv.getBoundingClientRect();
  if (!rect.width) return;                       // hidden; redrawn when shown
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);

  const max = Math.max(1, ...llMonthBins.map(b => b.count));
  const barW = Math.max(1, rect.width / Math.max(1, llMonthBins.length) - 1);
  const floor = 13;                              // leave room for the tick labels
  const cov = 4;                                 // the coverage band's own strip
  const usable = rect.height - floor - cov - 4;
  for (const b of llMonthBins) {
    const x = tsToFrac(b.ts) * rect.width;
    const h = (b.count / max) * usable;
    // In-window bars read gold, out-of-window bars stay muted: the histogram
    // itself shows what the current trim actually selects.
    const inWin = b.ts >= llStartTs && b.ts <= llEndTs;
    ctx.fillStyle = inWin ? 'rgba(196,164,74,0.85)' : 'rgba(196,164,74,0.22)';
    ctx.fillRect(x, rect.height - floor - cov - h, barW, h);

    // The coverage band: how much of that month we could actually place on a
    // map. Red where we placed almost nothing -- those troughs above are ours,
    // not the city's.
    const c = b.coverage;
    ctx.fillStyle = c >= 0.9 ? 'rgba(90,150,90,0.85)'
                  : c >= 0.4 ? 'rgba(232,167,53,0.85)'
                  : 'rgba(232,93,58,0.9)';
    ctx.fillRect(x, rect.height - floor - cov + 1, barW, cov - 1);
  }
}

function drawClipTicks() {
  const el = document.getElementById('clip-ticks');
  if (!el || !llMonthBins.length) return;
  const years = [...new Set(llMonthBins.map(b => new Date(b.ts).getUTCFullYear()))];
  el.innerHTML = years.map(y => {
    const ts = Date.UTC(y, 0, 1);
    const f = tsToFrac(ts);
    if (f < 0 || f > 1) return '';
    return `<span class="clip-tick" style="left:${(f * 100).toFixed(3)}%">${y}</span>`;
  }).join('');
}

/** Push current state into the clip's DOM. The one place the clip is drawn. */
function setLandlordsTimeInputs() {
  const hl = document.getElementById('ll-halflife');
  if (hl) hl.value = llHalfLifeMonths;
  if (llDataMinTs === null) return;
  const win = document.getElementById('clip-window');
  const head = document.getElementById('clip-playhead');
  const read = document.getElementById('clip-readout');
  if (win) {
    const l = Math.max(0, Math.min(100, tsToFrac(llStartTs) * 100));
    const r = Math.max(0, Math.min(100, tsToFrac(llEndTs) * 100));
    win.style.left = `${l.toFixed(3)}%`;
    win.style.width = `${Math.max(0.4, r - l).toFixed(3)}%`;
  }
  if (head) head.style.left = `${(tsToFrac(llCursorTs) * 100).toFixed(3)}%`;
  if (read) {
    const mo = Math.max(1, Math.round((llEndTs - llStartTs) / MONTH_MS));
    read.innerHTML = `${toISODate(llStartTs)} <span class="dim">→</span> ${toISODate(llEndTs)}`
      + ` <span class="dim">· ${mo} mo ·</span> playhead ${toISODate(llCursorTs)}`;
  }
  drawClipHistogram();
  drawClipTicks();
}

/** Clamp the three marks back into a legal order after any one of them moves. */
function clipClamp() {
  llStartTs = Math.min(Math.max(llStartTs, llDataMinTs), llDataMaxTs);
  llEndTs = Math.min(Math.max(llEndTs, llDataMinTs), llDataMaxTs);
  if (llEndTs - llStartTs < MONTH_MS) llEndTs = Math.min(llDataMaxTs, llStartTs + MONTH_MS);
  if (llEndTs - llStartTs < MONTH_MS) llStartTs = Math.max(llDataMinTs, llEndTs - MONTH_MS);
  llCursorTs = Math.min(Math.max(llCursorTs, llStartTs), llEndTs);
}

function clipApply() { clipClamp(); setLandlordsTimeInputs(); applyLandlordsTimeFilter(); }

function stopClipPlayback() {
  llPlaying = false;
  if (llPlayRaf) cancelAnimationFrame(llPlayRaf);
  llPlayRaf = null;
  const b = document.getElementById('clip-play');
  if (b) { b.textContent = '▶'; b.classList.remove('playing'); b.setAttribute('aria-label', 'Play'); }
}

/* Playback is the whole reason the histogram is worth having: watching the
   playhead cross a rising bar and the map light up under it is the fastest
   way to see something forming. Stops itself at the out point. */
function toggleClipPlayback() {
  if (llPlaying) return stopClipPlayback();
  if (llCursorTs >= llEndTs) llCursorTs = llStartTs;
  llPlaying = true;
  llPlayLast = performance.now();
  const b = document.getElementById('clip-play');
  if (b) { b.textContent = '❚❚'; b.classList.add('playing'); b.setAttribute('aria-label', 'Pause'); }
  const step = (now) => {
    if (!llPlaying) return;
    const dt = (now - llPlayLast) / 1000;
    llPlayLast = now;
    llCursorTs += dt * CLIP_PLAY_MONTHS_PER_SEC * MONTH_MS;
    if (llCursorTs >= llEndTs) { llCursorTs = llEndTs; clipApply(); return stopClipPlayback(); }
    clipApply();
    llPlayRaf = requestAnimationFrame(step);
  };
  llPlayRaf = requestAnimationFrame(step);
}

function bindLandlordsTimeControls() {
  const track = document.getElementById('clip-track');
  const win = document.getElementById('clip-window');
  const inH = document.getElementById('clip-in');
  const outH = document.getElementById('clip-out');
  if (!track) return;

  const tsAt = (clientX) => {
    const r = track.getBoundingClientRect();
    return fracToTs((clientX - r.left) / Math.max(1, r.width));
  };

  // One pointer-drag state machine for all four gestures (in, out, slide the
  // whole window, scrub) rather than four listener sets that could disagree
  // about which one is active.
  let drag = null;
  const onDown = (e, mode) => {
    e.preventDefault();
    stopClipPlayback();
    const t = tsAt(e.clientX);
    drag = { mode, grabTs: t, startAtGrab: llStartTs, endAtGrab: llEndTs };
    if (mode === 'window') win.classList.add('dragging');
    track.setPointerCapture?.(e.pointerId);
    if (mode === 'scrub') { llCursorTs = snapMonth(t); clipApply(); }
  };
  const onMove = (e) => {
    if (!drag) return;
    const t = tsAt(e.clientX);
    if (drag.mode === 'in') llStartTs = snapMonth(t);
    else if (drag.mode === 'out') llEndTs = snapMonth(t);
    else if (drag.mode === 'scrub') llCursorTs = snapMonth(t);
    else if (drag.mode === 'window') {
      // Slide at fixed duration -- the comparison move: same six months, a
      // year earlier. Clamped as a unit so the duration never silently shrinks
      // when the window meets the end of the record.
      const dur = drag.endAtGrab - drag.startAtGrab;
      let s = snapMonth(drag.startAtGrab + (t - drag.grabTs));
      s = Math.min(Math.max(s, llDataMinTs), llDataMaxTs - dur);
      llStartTs = s; llEndTs = s + dur;
    }
    clipApply();
  };
  const onUp = () => { if (win) win.classList.remove('dragging'); drag = null; };

  inH?.addEventListener('pointerdown', (e) => { e.stopPropagation(); onDown(e, 'in'); });
  outH?.addEventListener('pointerdown', (e) => { e.stopPropagation(); onDown(e, 'out'); });
  win?.addEventListener('pointerdown', (e) => { e.stopPropagation(); onDown(e, 'window'); });
  track.addEventListener('pointerdown', (e) => onDown(e, 'scrub'));
  track.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  // Premiere muscle memory: space plays, I/O set in/out at the playhead,
  // arrows step a month.
  track.addEventListener('keydown', (e) => {
    const stepMonth = (dir) => {
      const d = new Date(llCursorTs);
      llCursorTs = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + dir, 1);
      stopClipPlayback(); clipApply();
    };
    if (e.key === 'ArrowLeft') { e.preventDefault(); stepMonth(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stepMonth(1); }
    else if (e.key === ' ') { e.preventDefault(); toggleClipPlayback(); }
    else if (e.key === 'i' || e.key === 'I') { e.preventDefault(); llStartTs = llCursorTs; clipApply(); }
    else if (e.key === 'o' || e.key === 'O') { e.preventDefault(); llEndTs = llCursorTs; clipApply(); }
  });

  document.getElementById('clip-play')?.addEventListener('click', toggleClipPlayback);
  document.getElementById('clip-step-back')?.addEventListener('click', () => {
    const d = new Date(llCursorTs);
    llCursorTs = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 1, 1);
    stopClipPlayback(); clipApply();
  });
  document.getElementById('clip-step-fwd')?.addEventListener('click', () => {
    const d = new Date(llCursorTs);
    llCursorTs = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1);
    stopClipPlayback(); clipApply();
  });

  document.getElementById('ll-halflife')?.addEventListener('change', (e) => {
    const v = parseFloat(e.target.value);
    if (!Number.isFinite(v) || v <= 0) return;
    llHalfLifeMonths = v;
    applyLandlordsTimeFilter();
  });
  document.getElementById('ll-time-reset')?.addEventListener('click', () => {
    stopClipPlayback();
    llStartTs = llDataMinTs; llEndTs = llDataMaxTs; llCursorTs = llDataMaxTs; llHalfLifeMonths = 3;
    clipApply();
  });

  // The canvas is sized from its rendered box, so it has to be redrawn when
  // that box changes -- including the first time the tab is shown at all.
  window.addEventListener('resize', () => { drawClipHistogram(); drawClipTicks(); });
}


function buildLandlordsLayers(properties, maxHeat, ctx = {}) {
  if (llClusterGroup) { leafletMap.removeLayer(llClusterGroup); llClusterGroup = null; }
  llClusterGroup = L.markerClusterGroup({
    maxClusterRadius: 50,
    iconCreateFunction: (cluster) => {
      const sum = cluster.getAllChildMarkers().reduce((a, m) => a + (m.options.heat || 0), 0);
      const tier = sum >= 25 ? 'tier-3' : sum >= 8 ? 'tier-2' : '';
      return L.divIcon({
        // Rounding a real-but-small sum straight to 0 would read as "nothing
        // here" when there's actually decayed, aging heat present — say
        // "<1" instead so a faded cluster is never mistaken for an empty one.
        html: `<div>${sum > 0 && sum < 1 ? '<1' : Math.round(sum)}</div>`,
        className: `ll-cluster-icon ${tier}`,
        iconSize: [36, 36],
      });
    },
  });

  for (const p of properties) {
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: signalRadiusFor(p, ctx),
      fillColor: signalColorFor(p, ctx), color: '#00000066', weight: 1,
      fillOpacity: 0.85, className: 'll-dot',
      heat: p.heat,
    });
    const recentStr = p.mostRecentDate ? new Date(p.mostRecentDate).toLocaleDateString() : '—';
    marker.bindTooltip(
      `<strong>${escapeHtml(p.addressDisplay)}</strong><br>${p.countInRange} filing${p.countInRange === 1 ? '' : 's'} in window · most recent ${recentStr}<br>heat: ${p.heat.toFixed(1)}${signalTooltipFor(p, ctx)}${p.primaryLandlord ? '<br>' + escapeHtml(p.primaryLandlord) : ''}`,
      { sticky: true }
    );
    marker.on('click', () => openPropertyPanel(p.key));
    llClusterGroup.addLayer(marker);
  }

  llHeatLayer = L.heatLayer(
    properties.map(p => [p.lat, p.lng, maxHeat ? p.heat / maxHeat : 0]),
    { radius: 22, blur: 18, maxZoom: 17, gradient: { 0.2: '#8a7a3a', 0.5: '#e8a735', 0.8: '#e85d3a', 1.0: '#ff2d0a' } }
  );
}

function updateLandlordsLayer() {
  if (!leafletMap || !llClusterGroup || !llHeatLayer) return;
  if (llLayerMode === 'heat') {
    if (leafletMap.hasLayer(llClusterGroup)) leafletMap.removeLayer(llClusterGroup);
    if (!leafletMap.hasLayer(llHeatLayer)) llHeatLayer.addTo(leafletMap);
  } else {
    if (leafletMap.hasLayer(llHeatLayer)) leafletMap.removeLayer(llHeatLayer);
    if (!leafletMap.hasLayer(llClusterGroup)) llClusterGroup.addTo(leafletMap);
  }
  // The highlight ring layer rides on top of whichever eviction submode is
  // active, since it answers a different question (which buildings are
  // this owner's) than dots/heat do (how hot is each building right now).
  if (llHighlightLayer && !leafletMap.hasLayer(llHighlightLayer)) llHighlightLayer.addTo(leafletMap);
}

// Holonic zoom, step 2: from one building up to everything an owner holds.
// keys is every property key Landlord Mapper says belongs to this owner
// AND that we also have eviction filings for in this dataset; label is the
// owner's own name for display. Draws a distinct ring around each one
// (never replacing the base dots/heat layer) and fits the map to show them
// all at once.
function applyLandlordHighlight(keys, label) {
  llHighlightKeys = new Set(keys);
  llHighlightLabel = label;
  rebuildLandlordHighlightLayer();

  const banner = document.getElementById('ll-highlight-banner');
  const text = document.getElementById('ll-highlight-text');
  if (banner && text) {
    text.innerHTML = `Showing ${llHighlightKeys.size} propert${llHighlightKeys.size === 1 ? 'y' : 'ies'} linked to <strong>${escapeHtml(label)}</strong> ${LM_TAG}`;
    banner.style.display = '';
  }
  if (llHighlightLayer) {
    const bounds = llHighlightLayer.getBounds();
    if (bounds.isValid()) leafletMap.fitBounds(bounds, { padding: [40, 40] });
  }
}

function clearLandlordHighlight() {
  llHighlightKeys = null;
  llHighlightLabel = null;
  if (llHighlightLayer && leafletMap && leafletMap.hasLayer(llHighlightLayer)) {
    leafletMap.removeLayer(llHighlightLayer);
  }
  llHighlightLayer = null;
  const banner = document.getElementById('ll-highlight-banner');
  if (banner) banner.style.display = 'none';
}

function rebuildLandlordHighlightLayer() {
  if (llHighlightLayer && leafletMap && leafletMap.hasLayer(llHighlightLayer)) {
    leafletMap.removeLayer(llHighlightLayer);
  }
  llHighlightLayer = null;
  if (!llHighlightKeys || !llPropertyIndex || !leafletMap) return;

  const group = L.featureGroup(); // featureGroup, not layerGroup -- needs .getBounds() for the auto-fit below
  for (const p of llPropertyIndex.properties) {
    if (!llHighlightKeys.has(p.key)) continue;
    // Sized/colored by this building's OWN all-time filing count, not by
    // the current time-window heat — ownership is orthogonal to whatever
    // date range happens to be selected, so a building still shows here
    // even if it has no filings in the currently-viewed window.
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: Math.max(12, llMarkerRadius(Math.min(p.evictionCount, 20))),
      color: '#c4a44a', weight: 3, fillColor: 'transparent', fillOpacity: 0,
      className: 'll-highlight-ring',
    });
    marker.bindTooltip(
      `<strong>${escapeHtml(p.addressDisplay)}</strong><br>${p.evictionCount} filing${p.evictionCount === 1 ? '' : 's'} all-time · linked to ${escapeHtml(llHighlightLabel || 'this owner')}`,
      { sticky: true }
    );
    marker.on('click', () => openPropertyPanel(p.key));
    group.addLayer(marker);
  }
  llHighlightLayer = group;
  if (document.getElementById('layer-evictions').checked) group.addTo(leafletMap);
}

/* ── Property detail panel: filings + the Landlord Mapper citation ── */

function closePropertyPanel() {
  const panel = document.getElementById('property-panel');
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  llOpenAddressKey = null;
}

function openPropertyPanel(key) {
  closeTractPanel(); // the two right-edge panels never show at once
  const p = llPropertyIndex.properties.find(x => x.key === key);
  const panel = document.getElementById('property-panel');
  if (!p) {
    panel.innerHTML = '<div class="tp-empty">Building not found.</div>';
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    return;
  }
  llOpenAddressKey = key;

  const landlordList = [...p.landlords.entries()].sort((a, b) => b[1] - a[1]);
  const traj = monthlyTrajectory(p.cases);
  const casesHtml = p.cases.map(c => {
    const pleadings = Array.isArray(c.pleadings) ? c.pleadings : [];
    // "Face of the warrant" info the end-user asked for: the notice/filing
    // date and the pleading's own description, shown per case rather than
    // buried in the full record panel.
    const pleadingHtml = pleadings.slice(0, 3).map(pl => `
      <div class="pp-pleading">
        <span class="pl-date">${escapeHtml(pl.date || '—')}</span>
        ${pl.code ? ' · ' + escapeHtml(String(pl.code).toUpperCase()) : ''}
        ${pl.description ? ' — ' + escapeHtml(pl.description) : ''}
      </div>`).join('');
    return `
      <div class="pp-case-row">
        <div class="pp-case-meta">
          <span class="pp-case-date">${escapeHtml(c.file_date || '—')}</span>
          <span class="pp-case-docket" onclick="closePropertyPanel(); openRecordPanel('${escapeAttr(c.docket)}')" title="Open full case record">${escapeHtml(c.docket)} →</span>
        </div>
        <div class="pp-case-type">${escapeHtml(c.case_type || '')} · ${escapeHtml(c.status || '')}${c.Plaintiff_1 ? ' · ' + escapeHtml(c.Plaintiff_1) : ''}</div>
        ${pleadingHtml}
      </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="tp-head">
      <div>
        <div class="tp-title">${escapeHtml(p.addressDisplay)}</div>
        <div class="tp-geoid">${p.evictionCount} filing${p.evictionCount === 1 ? '' : 's'} at this address</div>
      </div>
      <button class="tp-close" onclick="closePropertyPanel()" title="Close">×</button>
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Filing trend at this address</div>
      ${traj.months.length > 1
        ? sparklineHtml(traj.monthsMap, traj.months) + `<div class="pp-gap-note" style="margin-top:4px">${escapeHtml(traj.months[0])} – ${escapeHtml(traj.months[traj.months.length - 1])}, monthly filing counts</div>`
        : '<div class="pp-gap-note">Not enough dated filings here to show a trend.</div>'}
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Ownership — via Landlord Mapper</div>
      <div class="pp-lm-card" id="pp-lm-card">
        <div class="pp-lm-loading">Looking up ownership on Landlord Mapper…</div>
      </div>
      <div class="pp-gap-note" style="margin-top:8px">
        Landlord Mapper independently infers ownership networks from public
        parcel, business-filing, and taxpayer records — this app does not
        recompute or verify that matching. See their page for the full
        picture, including anything else this owner holds beyond Davidson
        County.
      </div>
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Plaintiff${landlordList.length === 1 ? '' : 's'} named in filings here</div>
      ${landlordList.map(([name, count]) => `
        <div class="pp-stat-row"><span class="lbl">${escapeHtml(name)}</span><span class="val">${count}</span></div>
      `).join('')}
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Code violations / habitability</div>
      <div class="pp-gap-note">
        Not yet available for Nashville — Metro Codes violation and
        condemnation records aren't integrated into this app or into
        Landlord Mapper's Nashville dataset yet. This section is left
        visible, empty, and named on purpose rather than silently omitted.
      </div>
    </div>

    <div class="pp-section" style="border-bottom:none">
      <div class="pp-section-label">Filings, newest first</div>
      ${casesHtml || '<div class="pp-gap-note">No case detail available.</div>'}
    </div>`;
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');

  lookupLandlordMapper(p).then(result => {
    if (llOpenAddressKey !== key) return; // panel moved on before the fetch resolved
    renderLandlordMapperCard(result, p);
  });
}

// Every cross-property link this app draws — "this owner also holds X" —
// is Landlord Mapper's inference, never ours, and every one of them
// carries this same tag rather than relying on a section header alone to
// carry the provenance for everything under it.
const LM_TAG = '<span class="pp-lm-tag" title="Ownership link inferred by landlordmapper.org, not by this app">via Landlord Mapper</span>';

function renderLandlordMapperCard(result, property) {
  const el = document.getElementById('pp-lm-card');
  if (!el) return;
  if (!result) {
    el.innerHTML = `<div class="pp-lm-none">No confident match found on Landlord Mapper for this address. It may not be in their current dataset, or the address didn't resolve cleanly enough to link automatically.</div>
      <div class="pp-lm-meta"><a href="${escapeAttr(LANDLORDMAPPER_SITE)}/home" target="_blank" rel="noopener">Search Landlord Mapper directly →</a></div>`;
    return;
  }

  // Holonic step up: of this owner's OTHER properties (per Landlord
  // Mapper), which ones do we ALSO have eviction filings for in this
  // dataset? Matched on the exact normalized building address only — no
  // fuzzy re-matching here, since that would be exactly the ownership-
  // inference work we leave entirely to Landlord Mapper. A miss just means
  // the two sources formatted the address differently, not that the owner
  // doesn't hold that building.
  const addrIndex = new Map(llPropertyIndex.properties.map(x => [normalizeAddressKey(x.addressDisplay), x]));
  const portfolioMatches = (result.otherProperties || [])
    .map(b => addrIndex.get(normalizeAddressKey(b.short_address)))
    .filter(Boolean);
  const portfolioProps = [property, ...portfolioMatches];
  const portfolioKeys = portfolioProps.map(x => x.key);
  const portfolioLabel = result.networkName || property.primaryLandlord || 'this owner';
  const portfolioTraj = monthlyTrajectory(portfolioProps.flatMap(x => x.cases));

  const otherHtml = (result.otherProperties && result.otherProperties.length)
    ? `<div class="pp-lm-other">
        <div class="pp-lm-other-label">Other properties this owner holds</div>
        ${result.otherProperties.map(b => {
          const matched = addrIndex.get(normalizeAddressKey(b.short_address));
          return `
          <div class="pp-lm-other-row">
            <span class="pp-lm-other-addr">${escapeHtml(b.short_address || b.taxpayer_name || 'address not on file')}</span>
            <span class="pp-lm-other-right">
              ${matched ? `<a href="#" class="pp-lm-other-jump" onclick="openPropertyPanel('${escapeAttr(matched.key)}'); return false;">${matched.evictionCount} filing${matched.evictionCount === 1 ? '' : 's'} here too →</a>` : ''}
              ${LM_TAG}
            </span>
          </div>`;
        }).join('')}
        ${result.otherPropertiesMore > 0 ? `<div class="pp-lm-other-more">+ ${result.otherPropertiesMore} more — see full portfolio below</div>` : ''}
        ${portfolioMatches.length ? `
          <div class="pp-lm-portfolio-traj">
            <div class="pp-lm-other-label">This owner's trend across ${portfolioProps.length} propert${portfolioProps.length === 1 ? 'y' : 'ies'} in this dataset ${LM_TAG}</div>
            ${portfolioTraj.months.length > 1 ? sparklineHtml(portfolioTraj.monthsMap, portfolioTraj.months) : '<div class="pp-gap-note">Not enough dated filings across these to show a trend.</div>'}
            <button type="button" class="pp-lm-highlight-btn"
                    data-keys="${escapeAttr(portfolioKeys.join(','))}" data-label="${escapeAttr(portfolioLabel)}"
                    onclick="applyLandlordHighlight(this.dataset.keys.split(','), this.dataset.label)">
              Show ${portfolioProps.length === 1 ? 'this building' : `these ${portfolioProps.length} buildings`} on the map
            </button>
          </div>` : ''}
      </div>`
    : '';
  el.innerHTML = `
    <div class="pp-lm-label">${escapeHtml(result.matchedOn)}</div>
    <a href="${escapeAttr(result.buildingUrl)}" target="_blank" rel="noopener">View this building on Landlord Mapper →</a> ${LM_TAG}<br>
    <a href="${escapeAttr(result.portfolioUrl)}" target="_blank" rel="noopener">View full ownership portfolio →</a> ${LM_TAG}
    <div class="pp-lm-meta">
      ${result.networkName ? escapeHtml(result.networkName) + '<br>' : ''}
      ${Number.isFinite(result.bldgCount) ? `${result.bldgCount.toLocaleString()} building${result.bldgCount === 1 ? '' : 's'}, ${result.unitCount?.toLocaleString() ?? '?'} unit${result.unitCount === 1 ? '' : 's'} in this owner's portfolio ${LM_TAG}` : ''}
      ${Number.isFinite(result.bldgCount) && result.bldgCount > portfolioProps.length ? `<br>only ${portfolioProps.length} of those appear in this Nashville eviction dataset — the rest may be elsewhere, or simply have no filings here` : ''}
    </div>
    ${otherHtml}`;
}

// Live cross-reference against Landlord Mapper's public API. We ask by
// property address first (their own primary lookup for "who owns this
// building"); if that finds nothing we fall back to the plaintiff name.
// Every result is cited plainly and links to Landlord Mapper's own page —
// we trust their matching rather than re-deriving it, and every individual
// cross-property link drawn from it (buildingUrl, portfolioUrl, and each
// row of otherProperties) is a claim ABOUT Landlord Mapper's own inferred
// network, tagged as such at the point of use, not just once in a header.
async function lookupLandlordMapper(property) {
  const cacheKey = property.key;
  if (_lmLookupCache.has(cacheKey)) return _lmLookupCache.get(cacheKey);

  const result = await (async () => {
    try {
      let hit = await lmSearchOne('property', property.addressDisplay);
      let matchedOn = 'Matched by building address';
      if (!hit && property.primaryLandlord) {
        hit = await lmSearchOne('landlord_name', property.primaryLandlord);
        matchedOn = 'Matched by plaintiff name (address search found nothing)';
      }
      if (!hit) return null;

      const portfolio = await lmFetchJson(
        `/map/portfolio_tab/json/?landlord_ct_id=${hit.landlord_ct_id}&landlord_oid=${hit.landlord_oid}`
      ).catch(() => null);

      const allOther = (portfolio?.bldgs_list || []).filter(b =>
        normalizeAddressKey(b.short_address) !== normalizeAddressKey(property.addressDisplay)
      );
      const OTHER_PROPERTIES_SHOWN = 6;

      return {
        matchedOn,
        buildingUrl: `${LANDLORDMAPPER_SITE}/search/${hit.property_oid}/${hit.landlord_ct_id}/${hit.landlord_oid}/building`,
        portfolioUrl: `${LANDLORDMAPPER_SITE}/search/${hit.property_oid}/${hit.landlord_ct_id}/${hit.landlord_oid}/portfolio`,
        networkName: portfolio?.name || null,
        bldgCount: portfolio?.bldg_count,
        unitCount: portfolio?.unit_count,
        otherProperties: allOther.slice(0, OTHER_PROPERTIES_SHOWN),
        otherPropertiesMore: Math.max(0, allOther.length - OTHER_PROPERTIES_SHOWN),
      };
    } catch (e) {
      console.warn('Landlord Mapper lookup failed:', e);
      return null;
    }
  })();

  _lmLookupCache.set(cacheKey, result);
  return result;
}

async function lmFetchJson(path) {
  const r = await fetch(LANDLORDMAPPER_API + path);
  if (!r.ok) throw new Error(`Landlord Mapper HTTP ${r.status}`);
  return r.json();
}

async function lmSearchOne(searchType, searchString) {
  if (!searchString) return null;
  const hits = await lmFetchJson(
    `/search/json/?search_type=${searchType}&search_string=${encodeURIComponent(searchString)}`
  ).catch(() => []);
  return Array.isArray(hits) && hits.length ? hits[0] : null;
}

/* ───────────────────────── Tract detail panel ───────────────────────── */

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// Parse a money amount out of a judgment row's description. The upstream
// data smuggles the awarded amount onto the end of `judgment_type` (e.g.
// "JUDGMENT-D1 4,203.48"), so we pull the first dollar-formatted token.
const JUDGMENT_AMOUNT_RE = /(\d{1,3}(?:,\d{3})*\.\d{2})/;
function extractJudgmentAmount(row) {
  const arr = row.judgments;
  if (!Array.isArray(arr) || !arr.length) return null;
  let total = 0;
  let found = false;
  for (const j of arr) {
    const m = String(j && j.judgment_type || '').match(JUDGMENT_AMOUNT_RE);
    if (!m) continue;
    const n = parseFloat(m[1].replace(/,/g, ''));
    if (!Number.isFinite(n)) continue;
    total += n;
    found = true;
  }
  return found ? Math.round(total * 100) / 100 : null;
}

function bucketJudgmentAmount(amt) {
  if (amt == null) return '(no $)';
  if (amt < 1000) return '<$1k';
  if (amt < 3000) return '$1k–3k';
  if (amt < 5000) return '$3k–5k';
  if (amt < 10000) return '$5k–10k';
  return '$10k+';
}

// Derive judgment_amount + judgment_bucket on each row at load time. These
// power a numeric "Judgment $" table column and a bucket-based filter.
/* Davidson County's FIPS prefix. Nashville is a consolidated city-county, so a
   Metro council district exists only inside 47037 — which is what lets us
   rebuild a full tract GEOID from a bare tract code below. */
const DAVIDSON_FIPS = '47037';

/* Only a third of scraped cases survive geocoding far enough to carry a
   `census_geoid`, but ~97% carry the 6-digit `census_tract` the court record
   itself supplies. Keying tract aggregates on `census_geoid` alone therefore
   threw away two thirds of the scrape, which is why every tract compared
   against Eviction Lab looked like a ~35% undercount when the two sources
   actually agree to within a few percent county-wide.

   So derive one canonical tract key: the geocoder's GEOID when we have it,
   otherwise DAVIDSON_FIPS + the tract code, gated on the row carrying a council
   district (the only in-county signal available on un-geocoded rows). Against
   the current feed that reconstruction matches a real Davidson tract for 48,036
   of 48,037 such rows. `census_geoid` is left untouched — it stays the raw
   scraped field, and exports still emit it as-is. */
function tractGeoidFor(r) {
  if (r.census_geoid) return String(r.census_geoid);
  const t = r.census_tract == null ? '' : String(r.census_tract).trim();
  if (!/^\d{1,6}$/.test(t) || !r.council_district) return null;
  return DAVIDSON_FIPS + t.padStart(6, '0');
}

function enrichCaseRows(rows) {
  for (const r of rows) {
    r.judgment_amount = extractJudgmentAmount(r);
    r.judgment_bucket = bucketJudgmentAmount(r.judgment_amount);
    r.tract_geoid     = tractGeoidFor(r);
  }
}

function formatMoney(n) {
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Render a JUDGMENTS array using the same timeline markup as pleadings.
// The upstream schema is { judgment_date, party_name, judgment_type, judge }
// — the same shape as pleadings under different field names.
function formatJudgments(judgments) {
  if (!Array.isArray(judgments) || !judgments.length) {
    return '<span class="empty">— no judgments —</span>';
  }
  const normalized = judgments.map(j => ({
    date: j.judgment_date,
    code: j.party_name,
    description: j.judgment_type,
    detail: '',
    has_image: false,
  }));
  return formatPleadings(normalized);
}

// Render the PLEADINGS array as a vertical timeline. Pleadings are stored on
// each case as objects of { date, code, description, detail, has_image },
// sorted newest-first; an "IMG" badge marks pleadings that have a scanned
// image on file (no URL to link to — marker only).
function formatPleadings(pleadings) {
  if (!Array.isArray(pleadings) || !pleadings.length) {
    return '<span class="empty">— no pleadings —</span>';
  }
  const parseDate = v => {
    const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m ? new Date(+m[3], +m[1] - 1, +m[2]).getTime() : 0;
  };
  const sorted = [...pleadings].sort((a, b) => parseDate(b.date) - parseDate(a.date));
  return `<div class="pleadings-list">${sorted.map(p => {
    const code = String(p.code || '').toUpperCase();
    return `<div class="pleading-row">
      <div class="pleading-meta">
        <span class="pleading-date">${escapeHtml(p.date || '')}</span>
        ${code ? `<span class="pleading-code">${escapeHtml(code)}</span>` : ''}
        ${p.has_image ? '<span class="pleading-image-badge">IMG</span>' : ''}
      </div>
      <div class="pleading-desc">${escapeHtml(p.description || '')}</div>
      ${p.detail ? `<div class="pleading-detail">${escapeHtml(p.detail)}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function openTractPanel(geoid) {
  closePropertyPanel(); // the two right-edge panels never show at once
  selectedTract = geoid;
  // Visually distinguish the selected tract on the map.
  if (tractLayer) {
    tractLayer.eachLayer(l => {
      const g = String(l.feature.properties.GEOID);
      l.setStyle({
        weight: g === geoid ? 2.5 : 1,
        color:  g === geoid ? '#c4a44a' : '#2a2820',
      });
    });
  }
  renderTractPanel(geoid);
}

function closeTractPanel() {
  selectedTract = null;
  const panel = document.getElementById('tract-panel');
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  if (tractLayer) {
    tractLayer.eachLayer(l => l.setStyle({ weight: 1, color: '#2a2820' }));
  }
}

function renderTractPanel(geoid) {
  const panel = document.getElementById('tract-panel');
  const info = agg.tractInfo[geoid] || {};
  const p = agg.princetonTract[geoid] || {};
  const l = agg.localTract[geoid]     || {};

  // Months: every month where either source has data for this tract.
  const monthSet = new Set([...Object.keys(p), ...Object.keys(l)]);
  let months = sortMonthsAsc([...monthSet]).reverse(); // newest first, top→bottom

  const districtRows = [
    ['Census tract', info.name || `Tract ${geoid}`],
    ['Council district', info.district || '—'],
    ['Council rep', info.rep || '—'],
    ['State house', info.state_house || '—'],
    ['US congressional', info.us_congressional || '—'],
  ];

  let html = `
    <div class="tp-head">
      <div>
        <div class="tp-title">${escapeHtml(info.name || `Tract ${geoid}`)}</div>
        <div class="tp-geoid">GEOID ${escapeHtml(geoid)}</div>
      </div>
      <button class="tp-close" onclick="closeTractPanel()" title="Close">×</button>
    </div>
    <div class="tp-districts">
      ${districtRows.map(([k, v]) => `
        <div class="tp-district-row">
          <span class="lbl">${escapeHtml(k)}</span>
          <span class="val">${escapeHtml(v)}</span>
        </div>`).join('')}
    </div>
    <div class="tp-section-label">Monthly filings (Princeton vs scraped)</div>
  `;

  if (!months.length) {
    html += `<div class="tp-empty">No monthly data for this tract on either side.</div>`;
  } else {
    html += `<div class="tp-months">`;
    for (const m of months) {
      const pv = p[m];
      const lv = l[m];
      const both = (pv != null && pv > 0) && (lv != null && lv > 0);
      html += `
        <div class="tp-month${both ? ' has-both' : ''}">
          <span class="m">${escapeHtml(m)}</span>
          <span class="src"><span class="label">Princeton</span><span class="val">${pv != null ? pv : '—'}</span></span>
          <span class="src"><span class="label">Scraped</span><span class="val">${lv != null ? lv : '—'}</span></span>
        </div>`;
    }
    html += `</div>`;
  }

  panel.innerHTML = html;
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
}

/* ───────────────────────── Case record panel ───────────────────────── */

function openRecordPanel(docket) {
  selectedRecordDocket = docket;
  // Re-mark the selected row without rebuilding the whole table.
  document.querySelectorAll('#tbody tr.selected').forEach(t => t.classList.remove('selected'));
  const tr = document.querySelector(`#tbody tr[data-docket="${CSS.escape(docket)}"]`);
  if (tr) tr.classList.add('selected');
  renderRecordPanel(docket);
}

function closeRecordPanel() {
  selectedRecordDocket = null;
  document.querySelectorAll('#tbody tr.selected').forEach(t => t.classList.remove('selected'));
  const p = document.getElementById('record-panel');
  p.classList.remove('open');
  p.setAttribute('aria-hidden', 'true');
}

function renderRecordPanel(docket) {
  const r = allRows.find(x => x.docket === docket);
  const panel = document.getElementById('record-panel');
  if (!r) {
    panel.innerHTML = `<div class="tp-empty">Case ${escapeHtml(docket)} not found.</div>`;
    panel.classList.add('open');
    return;
  }

  // Show every field, including 'docket' itself, sorted with the common
  // identifying fields first for at-a-glance scanning.
  const PRIORITY = [
    'docket', 'status', 'file_date', 'Plaintiff_1', 'Attorney',
    'address_formatted', 'council_district', 'council_rep',
    'state_house_district', 'us_congressional_district',
    'census_geoid', 'tract_geoid', 'census_name',
  ];
  const seen = new Set();
  const ordered = [];
  for (const k of PRIORITY) if (k in r) { ordered.push(k); seen.add(k); }
  // judgment_bucket is a derived display label for filtering only — hide it
  // from the per-record field listing where judgment_amount is already shown.
  for (const k of Object.keys(r).sort()) {
    if (k === 'judgment_bucket') continue;
    if (!seen.has(k)) ordered.push(k);
  }

  const rowHtml = ordered.map(k => {
    let v = r[k];
    let cls = 'val';
    let display;
    let encAttr = '';
    // Nested arrays (pleadings, judgments) get a full-width section
    // instead of being squeezed into the narrow value column.
    if (k === 'pleadings' && Array.isArray(v)) {
      return `<div class="rp-section">
        <span class="lbl">${escapeHtml(k)}</span>
        ${formatPleadings(v)}
      </div>`;
    }
    if (k === 'judgments' && Array.isArray(v)) {
      return `<div class="rp-section">
        <span class="lbl">${escapeHtml(k)}</span>
        ${formatJudgments(v)}
      </div>`;
    }
    if (k === 'judgment_amount') {
      const txt = v == null ? '—' : formatMoney(v);
      const empty = v == null ? ' empty' : '';
      return `<div class="rp-row">
        <span class="lbl">${escapeHtml(k)}</span>
        <span class="val${empty}">${escapeHtml(txt)}</span>
      </div>`;
    }
    // Derived, not scraped — and it's the key the Princeton comparison joins on,
    // so it's worth saying which of the two ways it was arrived at.
    if (k === 'tract_geoid') {
      const via = r.census_geoid
        ? 'Taken from the geocoded census_geoid. ' + SRC_GEOCODED
        : 'Rebuilt as Davidson County (47037) + the census_tract on the court record, because this case has no geocoded GEOID. ' + SRC_DERIVED;
      return `<div class="rp-row" title="${escapeAttr('Tract key used to compare this case against Princeton Eviction Lab filings. ' + via)}">
        <span class="lbl">${escapeHtml(k)}</span>
        <span class="val${v ? '' : ' empty'}">${escapeHtml(v || '—')}</span>
      </div>`;
    }
    if (v == null || v === '') { display = '—'; cls += ' empty'; }
    else if (isEncrypted(v)) {
      encAttr = ` data-enc="${escapeAttr(v)}"`;
      if (isUnlocked()) { display = 'decrypting…'; cls += ' enc'; }
      else { display = '—'; cls += ' empty'; }
    }
    else if (typeof v === 'object') { display = JSON.stringify(v, null, 2); }
    else display = String(v);
    return `<div class="rp-row"${encAttr}>
      <span class="lbl">${escapeHtml(k)}</span>
      <span class="${cls}">${escapeHtml(display)}</span>
    </div>`;
  }).join('');

  const safeDocket = escapeAttr(r.docket);
  panel.innerHTML = `
    <div class="tp-head">
      <div>
        <div class="tp-title">${escapeHtml(r.docket)}</div>
        <div class="tp-geoid">${escapeHtml(r.status || '—')} · filed ${escapeHtml(r.file_date || '—')}</div>
      </div>
      <button class="tp-close" onclick="closeRecordPanel()" title="Close">×</button>
    </div>
    <div class="rp-actions">
      <button type="button" onclick="copyRecord('${safeDocket}', this)" title="Copy as text">Copy</button>
      <button type="button" onclick="exportRecord('${safeDocket}', this)" title="Download as CSV">Export CSV</button>
      <button type="button" onclick="printRecord('${safeDocket}', this)" title="Open print view">Print</button>
    </div>
    <div class="rp-fields">${rowHtml}</div>`;
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');

  // After the panel is in the DOM, kick off async decryption for any
  // ENC: rows. Each row gets patched independently when its plaintext
  // resolves; cached hits resolve almost instantly.
  if (isUnlocked()) {
    panel.querySelectorAll('.rp-row[data-enc]').forEach(async (row) => {
      const enc = row.getAttribute('data-enc');
      const plain = await decryptValue(enc, unlockKeyPassword);
      // The user may have closed the panel or opened a different record
      // while the promise was in flight — bail if so.
      if (!document.body.contains(row)) return;
      const valEl = row.querySelector('.val');
      if (plain != null) {
        valEl.textContent = plain;
        valEl.className = 'val';
      } else {
        valEl.textContent = 'decrypt failed';
        valEl.className = 'val empty';
      }
    });
  }
}

/* ───────────────────────── Record actions (copy / export / print) ─────
   Each action resolves the record's fields with the same redaction rules as
   the table export: ENC: fields decrypted when unlocked, blanked otherwise.
   Pleadings collapse to a readable text timeline. */

async function resolveRecordFields(docket) {
  const r = allRows.find(x => x.docket === docket);
  if (!r) return null;
  const unlocked = isUnlocked();
  const PRIORITY = [
    'docket', 'status', 'file_date', 'Plaintiff_1', 'Attorney',
    'address_formatted', 'council_district', 'council_rep',
    'state_house_district', 'us_congressional_district',
    'census_geoid', 'tract_geoid', 'census_name',
  ];
  const seen = new Set();
  const keys = [];
  for (const k of PRIORITY) if (k in r) { keys.push(k); seen.add(k); }
  for (const k of Object.keys(r).sort()) {
    if (k === 'judgment_bucket') continue;
    if (!seen.has(k)) keys.push(k);
  }

  const fields = [];
  for (const k of keys) {
    const v = r[k];
    if (!unlocked && /^defendant/i.test(k)) { fields.push([k, '']); continue; }
    if (v == null || v === '') { fields.push([k, '']); continue; }
    if (isEncrypted(v)) {
      if (unlocked) {
        const plain = await decryptValue(v, unlockKeyPassword);
        fields.push([k, plain == null ? '' : plain]);
      } else {
        fields.push([k, '']);
      }
      continue;
    }
    if (k === 'pleadings' && Array.isArray(v)) {
      const parseDate = s => {
        const m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        return m ? new Date(+m[3], +m[1] - 1, +m[2]).getTime() : 0;
      };
      const sorted = [...v].sort((a, b) => parseDate(b.date) - parseDate(a.date));
      const lines = sorted.map(p => {
        const parts = [p.date || '', (p.code || '').toUpperCase(), p.description || ''].filter(Boolean);
        let line = parts.join(' · ');
        if (p.detail) line += '\n    ' + p.detail;
        return line;
      });
      fields.push([k, lines.join('\n')]);
      continue;
    }
    if (k === 'judgments' && Array.isArray(v)) {
      const parseDate = s => {
        const m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        return m ? new Date(+m[3], +m[1] - 1, +m[2]).getTime() : 0;
      };
      const sorted = [...v].sort((a, b) => parseDate(b.judgment_date) - parseDate(a.judgment_date));
      const lines = sorted.map(j => {
        const parts = [j.judgment_date || '', (j.party_name || '').toUpperCase(), j.judgment_type || ''].filter(Boolean);
        return parts.join(' · ');
      });
      fields.push([k, lines.join('\n')]);
      continue;
    }
    if (k === 'judgment_amount' && v != null) { fields.push([k, formatMoney(v)]); continue; }
    if (typeof v === 'object') { fields.push([k, JSON.stringify(v)]); continue; }
    fields.push([k, String(v)]);
  }
  return { record: r, fields, unlocked };
}

function flashButton(btn, label, cls='copied', ms=1200) {
  if (!btn) return;
  const orig = btn.textContent;
  const wasDisabled = btn.disabled;
  btn.textContent = label;
  btn.classList.add(cls);
  setTimeout(() => {
    btn.textContent = orig;
    btn.classList.remove(cls);
    btn.disabled = wasDisabled;
  }, ms);
}

async function copyRecord(docket, btn) {
  if (btn) btn.disabled = true;
  try {
    const resolved = await resolveRecordFields(docket);
    if (!resolved) return;
    const labelW = Math.max(...resolved.fields.map(([k]) => k.length));
    const text = resolved.fields
      .map(([k, v]) => `${k.padEnd(labelW, ' ')} : ${v}`)
      .join('\n');
    await navigator.clipboard.writeText(text);
    flashButton(btn, 'Copied ✓');
  } catch (e) {
    console.warn('[eo] copy failed:', e);
    flashButton(btn, 'Copy failed', 'copied');
  }
}

async function exportRecord(docket, btn) {
  if (btn) btn.disabled = true;
  try {
    const resolved = await resolveRecordFields(docket);
    if (!resolved) return;
    const row = {};
    const cols = [];
    for (const [k, v] of resolved.fields) { cols.push(k); row[k] = v; }
    await loadScript(PAPAPARSE_URL);
    const csv = Papa.unparse([row], { columns: cols });
    const stamp = new Date().toISOString().slice(0, 10);
    const safe = String(docket).replace(/[^A-Za-z0-9._-]+/g, '_');
    const suffix = resolved.unlocked ? '' : '-redacted';
    downloadCsv(csv, `case-${safe}-${stamp}${suffix}.csv`);
    flashButton(btn, 'Exported ✓');
  } catch (e) {
    console.warn('[eo] record export failed:', e);
    flashButton(btn, 'Export failed', 'copied');
  }
}

async function printRecord(docket, btn) {
  if (btn) btn.disabled = true;
  try {
    const resolved = await resolveRecordFields(docket);
    if (!resolved) return;
    const win = window.open('', '_blank', 'width=820,height=900');
    if (!win) {
      flashButton(btn, 'Pop-up blocked', 'copied', 2000);
      return;
    }
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
    const r = resolved.record;
    const rowsHtml = resolved.fields.map(([k, v]) => `
      <tr>
        <th>${esc(k)}</th>
        <td>${v ? esc(v).replace(/\n/g, '<br>') : '<span class="empty">—</span>'}</td>
      </tr>`).join('');
    const note = resolved.unlocked
      ? ''
      : '<div class="note">Defendant fields are blank because no login was active when this record was printed.</div>';
    win.document.open();
    win.document.write(`<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Case ${esc(r.docket)}</title>
<style>
  body { font-family: Georgia, serif; color: #1a1810; padding: 32px 36px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; vertical-align: top; border-bottom: 1px solid #e6e2d8; }
  th { width: 180px; color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
  td { color: #1a1810; white-space: pre-wrap; word-break: break-word; }

</style></head><body>
<h1>${esc(r.docket)}</h1>
<div class="meta">${esc(r.status || '')} · filed ${esc(r.file_date || '—')}${r.Plaintiff_1 ? ' · ' + esc(r.Plaintiff_1) : ''}</div>
${note}
<table>${rowsHtml}</table>
<footer>
  Source: Nashville Eviction Tracker · case data from circuitclerk.nashville.gov ·
  printed ${new Date().toISOString().slice(0, 19).replace('T', ' ')} UTC.
</footer>
<script>window.addEventListener('load', () => setTimeout(() => window.print(), 200));<\/script>
</body></html>`);
    win.document.close();
    flashButton(btn, 'Opened ✓');
  } catch (e) {
    console.warn('[eo] print failed:', e);
    flashButton(btn, 'Print failed', 'copied');
  }
}

/* ───────────────────────── Login / decryption ─────────────────────
   ENC: values are Fernet tokens (cryptography.io) produced by the
   Python scraper. Layout, after stripping the "ENC:" prefix and
   base64url-decoding:

     version(1=0x80) || timestamp(8) || iv(16) || ciphertext || hmac(32)

   The 32-byte PBKDF2-HMAC-SHA256 output is split: first 16 bytes =
   HMAC-SHA256 signing key, last 16 bytes = AES-128-CBC encryption key.
   PKCS7 padding is handled automatically by SubtleCrypto's AES-CBC mode.

   The scraper's PBKDF2 params changed across versions, so KEY_CONFIGS
   lists every (salt, iterations) we know and decryptValue tries each:
   Fernet's HMAC identifies which one a given token was sealed with. The
   feed seals defendant fields with salt 'caselink-eviction-scraper' / 480k;
   'caselink-v1' / 100k is kept as a fallback for any legacy tokens.

   The plaintext is held only in memory and never persisted. Closing
   the tab or pressing the Logout button purges the password and the
   cache. */

const PBKDF2_HASH       = 'SHA-256';
// Tried in order; the first whose HMAC verifies wins (current feed config first).
const KEY_CONFIGS = [
  { salt: 'caselink-eviction-scraper', iterations: 480000 },
  { salt: 'caselink-v1',               iterations: 100000 },
];
const FERNET_VERSION    = 0x80;
const FERNET_IV_BYTES   = 16;
const FERNET_HMAC_BYTES = 32;
const FERNET_HEADER_BYTES = 1 + 8 + FERNET_IV_BYTES; // version + ts + iv

let unlockKeyPassword = null;             // raw password held in memory only
const decryptCache    = new Map();        // ENC:... → plaintext | '__FAIL__'
const keyCache        = new Map();        // password → {sign, enc} CryptoKeys
const SENTINEL_FAIL   = '__FAIL__';

function base64UrlToBytes(b64) {
  // Fernet uses urlsafe base64 with '=' padding. atob() needs '+'/'/'.
  let s = b64.replace(/-/g, '+').replace(/_/g, '/');
  const pad = s.length % 4;
  if (pad) s += '='.repeat(4 - pad);
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function deriveFernetKeys(password, cfg) {
  // Cache the promise per (config, password) so parallel callers share one
  // PBKDF2 derivation and we pay each config's cost at most once.
  const cacheKey = `${cfg.iterations}:${cfg.salt}:${password}`;
  let p = keyCache.get(cacheKey);
  if (p) return p;
  p = (async () => {
    const baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password),
      'PBKDF2', false, ['deriveBits']
    );
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: new TextEncoder().encode(cfg.salt),
        iterations: cfg.iterations, hash: PBKDF2_HASH },
      baseKey, 256
    );
    const raw = new Uint8Array(bits);
    const signKey = await crypto.subtle.importKey(
      'raw', raw.slice(0, 16),
      { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']
    );
    const encKey = await crypto.subtle.importKey(
      'raw', raw.slice(16, 32),
      { name: 'AES-CBC', length: 128 }, false, ['decrypt']
    );
    return { sign: signKey, enc: encKey };
  })();
  keyCache.set(cacheKey, p);
  p.catch(() => keyCache.delete(cacheKey));
  return p;
}

function isEncrypted(v) {
  return typeof v === 'string' && v.startsWith('ENC:');
}

async function decryptValue(encStr, password) {
  if (!isEncrypted(encStr)) return encStr;
  if (decryptCache.has(encStr)) {
    const v = decryptCache.get(encStr);
    return v === SENTINEL_FAIL ? null : v;
  }
  try {
    const bytes = base64UrlToBytes(encStr.slice(4));
    if (bytes.length < FERNET_HEADER_BYTES + FERNET_HMAC_BYTES + 16) {
      throw new Error('token too short');
    }
    if (bytes[0] !== FERNET_VERSION) {
      throw new Error('bad version byte');
    }
    const signedLen = bytes.length - FERNET_HMAC_BYTES;
    const signed = bytes.subarray(0, signedLen);
    const mac    = bytes.subarray(signedLen);
    const iv     = bytes.subarray(9, 9 + FERNET_IV_BYTES);
    const ct     = bytes.subarray(FERNET_HEADER_BYTES, signedLen);

    // Try each known key config; the HMAC verify identifies the right one.
    for (const cfg of KEY_CONFIGS) {
      const { sign, enc } = await deriveFernetKeys(password, cfg);
      const ok = await crypto.subtle.verify({ name: 'HMAC' }, sign, mac, signed);
      if (!ok) continue;
      const pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, enc, ct);
      const out = new TextDecoder().decode(pt);
      decryptCache.set(encStr, out);
      return out;
    }
    throw new Error('no key config verified');
  } catch (e) {
    decryptCache.set(encStr, SENTINEL_FAIL);
    return null;
  }
}

function isUnlocked() { return unlockKeyPassword != null; }

function firstEncryptedValue() {
  for (const r of allRows) {
    for (const k in r) if (isEncrypted(r[k])) return r[k];
  }
  return null;
}

function updateLoginButton() {
  const btn = document.getElementById('login-btn');
  if (isUnlocked()) {
    btn.textContent = 'Logout';
    btn.classList.add('unlocked');
  } else {
    btn.textContent = 'Login';
    btn.classList.remove('unlocked');
  }
}

function onLoginButtonClick() {
  if (isUnlocked()) { logout(); return; }
  openLoginModal();
}

function openLoginModal() {
  const modal = document.getElementById('login-modal');
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-submit').disabled = false;
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('login-password').focus(), 0);
}

function closeLoginModal() {
  document.getElementById('login-modal').style.display = 'none';
}

async function submitLogin() {
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit');
  if (!password) { errEl.textContent = 'Enter a password.'; return; }

  const probe = firstEncryptedValue();
  if (!probe) {
    // Nothing encrypted to verify against — accept and move on.
    unlockKeyPassword = password;
    closeLoginModal();
    updateLoginButton();
    return;
  }

  errEl.textContent = 'Checking…';
  submitBtn.disabled = true;
  try {
    // Don't pollute the cache with a possibly-wrong attempt.
    decryptCache.delete(probe);
    const result = await decryptValue(probe, password);
    if (result == null) {
      decryptCache.delete(probe);
      errEl.textContent = 'Invalid password.';
      submitBtn.disabled = false;
      return;
    }
    unlockKeyPassword = password;
    closeLoginModal();
    updateLoginButton();
    if (selectedRecordDocket) renderRecordPanel(selectedRecordDocket);
  } catch (e) {
    errEl.textContent = 'Decryption error: ' + e.message;
    submitBtn.disabled = false;
  }
}

function logout() {
  unlockKeyPassword = null;
  decryptCache.clear();
  keyCache.clear();
  updateLoginButton();
  if (selectedRecordDocket) renderRecordPanel(selectedRecordDocket);
}

/* ───────────────────────── Feed refetch ─────────────────────────
   The feed is a full snapshot, so "updates" are just a periodic refetch that
   replaces the local set wholesale (see refetchSnapshot). */

function startFeedRefetch() {
  if (feedRefetchHandle) clearInterval(feedRefetchHandle);
  feedRefetchHandle = setInterval(refetchSnapshot, FEED_REFETCH_MS);
}

/* ───────────────────────── Districts view + profile ───────────────────────── */

// Aggregate everything we want to show per council district from allRows.
// Done on every render so it picks up new cases without a separate cache.
function aggregateDistricts() {
  const out = {};
  for (const r of allRows) {
    const d = r.council_district;
    if (!d) continue;
    if (!out[d]) {
      out[d] = {
        district: d,
        key: normalizeDistrict(d),
        rep: '',
        cases: 0, pending: 0, dismissed: 0, other: 0,
        tracts: new Set(),
        plaintiffs: {}, attorneys: {},
        rows: [],
        months: {},
      };
    }
    const a = out[d];
    // Rep can be blank on any individual row; keep scanning until one carries it.
    if (!a.rep && r.council_rep) a.rep = r.council_rep;
    a.cases++;
    if (r.status === 'PENDING') a.pending++;
    else if (r.status === 'DISMISSED' || r.status === 'NONSUIT') a.dismissed++;
    else a.other++;
    if (r.tract_geoid) a.tracts.add(r.tract_geoid);
    if (r.Plaintiff_1) a.plaintiffs[r.Plaintiff_1] = (a.plaintiffs[r.Plaintiff_1] || 0) + 1;
    if (r.Attorney && r.Attorney !== ', PRS') a.attorneys[r.Attorney] = (a.attorneys[r.Attorney] || 0) + 1;
    a.rows.push(r);
    const m = caseFileDateToMonth(r.file_date);
    if (m) a.months[m] = (a.months[m] || 0) + 1;
  }
  return out;
}

function sparklineHtml(monthsMap, recentMonths) {
  const counts = recentMonths.map(m => monthsMap[m] || 0);
  const max = Math.max(1, ...counts);
  return `<span class="spark">` + counts.map(c =>
    `<span style="height:${Math.max(1, (c / max) * 16)}px"></span>`
  ).join('') + `</span>`;
}

/* ───────────────────────── Live tab — scraper SSE feed ─────────────────────────
   Subscribes to the n8n live stream (paired with the /live/publish sink the
   scraper posts to) and renders it as a terminal feed. Every line is parsed
   for a leading timestamp + status marker so raw log noise (source filenames,
   double spaces) doesn't show; defendant names are redacted unconditionally,
   independent of the case-table unlock state, since this is an unvetted
   raw feed. */

const LIVE_URL = 'https://n8n.intelechia.com/live/stream';
const LIVE_MAX_LINES = 500;
const LIVE_RECONNECT_MS = 4000;

let liveSource = null;
let liveEventCount = 0;
let liveStarted = false;
let liveReconnectTimer = null;

const LIVE_TIMESTAMP_RE = /^(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s*(.*)$/;
const LIVE_DOCKET_RE = /\b(\d{2}[A-Z]{2}\d{3,8})\b/g;

// Redact anything that looks like a defendant name mention. Deliberately
// broad/over-inclusive: any capitalized run of 2+ words appearing after the
// word "defendant" on the same line gets blanked, since a false positive
// (over-redacting) is the safe failure mode here — a missed name is not.
function redactDefendantNames(text) {
  if (!text || !/defendant/i.test(text)) return text;
  return text.replace(
    /\bdefendants?\b((?:[^A-Za-z0-9\n]|is|was|named|address|for)*[:=]?\s*)([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+){1,4})/g,
    (m, sep, name) => m.slice(0, m.length - name.length) + '█'.repeat(Math.min(Math.max(name.length, 6), 16))
  );
}

// Worker login accounts are scraper-internal credentials, not part of the
// public court record — blank them wherever they show up in log lines.
const LIVE_REDACT_LITERAL = '[redacted-account]';
function redactWorkerAccount(text) {
  if (!text) return text;
  return text.split(LIVE_REDACT_LITERAL).join('█'.repeat(LIVE_REDACT_LITERAL.length));
}

function liveEsc(s) { return escapeHtmlSafe(String(s == null ? '' : s)); }

// Turn a raw log line into { time, marker, body } — no more "source":
// "caselink-error.log" noise, no more double-spaced raw text.
// Fallback for double-escaped unicode (e.g. a literal "✓" surviving
// JSON.parse because it was escaped twice upstream) — decode any remaining
// \uXXXX sequences to real characters before display.
function decodeUnicodeEscapes(s) {
  return String(s || '').replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
}

function formatLiveLogLine(raw) {
  let line = decodeUnicodeEscapes(String(raw || '')).replace(/\s+/g, ' ').trim();
  let time = '';
  const m = line.match(LIVE_TIMESTAMP_RE);
  if (m) { time = m[1].slice(11); line = m[2].trim(); }
  if (!line) return null;

  line = redactWorkerAccount(redactDefendantNames(line));
  line = liveEsc(line).replace(LIVE_DOCKET_RE, '<span class="src">$1</span>');

  let marker = '·', markerClass = '';
  if (/^={5,}$/.test(line.replace(/<[^>]+>/g, ''))) {
    return { time, marker: '', markerClass: '', body: '<span class="src">' + '─'.repeat(40) + '</span>' };
  }
  if (/^✓\s*/.test(line)) { marker = '✓'; markerClass = 'ok'; line = line.replace(/^✓\s*/, ''); }
  else if (/success|logged? in|clicked|found/i.test(line)) { marker = '✓'; markerClass = 'ok'; }
  else if (/error|fail|not found|no .* found/i.test(line)) { marker = '✗'; markerClass = 'redacted'; }
  else if (/logging in|extracting|geocoding|looking for/i.test(line)) { marker = '›'; }

  return { time, marker, markerClass, body: line };
}

function liveLineHtml(evt) {
  let payload;
  try { payload = JSON.parse(evt); } catch { payload = { type: 'raw', line: evt }; }

  if (payload.type === 'log') {
    const f = formatLiveLogLine(payload.line);
    if (!f) return '';
    // Show the time this line reached the viewer's own machine, not the
    // scraper server's raw log timestamp — the two clocks/timezones aren't
    // guaranteed to match, and "when did this happen for me" is what matters
    // when watching a live feed.
    const localTime = new Date().toLocaleTimeString([], { hour12: false });
    const timeHtml = `<span class="ts">${liveEsc(localTime)}</span> `;
    const markerHtml = f.marker ? `<span class="${f.markerClass}">${f.marker}</span> ` : '  ';
    return `<div class="live-line">${timeHtml}${markerHtml}${f.body}</div>`;
  }

  if (payload.type === 'test') {
    const addr = liveEsc(payload.address || '');
    return `<div class="live-line"><span class="src">[test event]</span> address: ${addr}</div>`;
  }

  // Unknown payload shape — still redact defendant-looking fields before showing it.
  const safe = {};
  for (const [k, v] of Object.entries(payload)) {
    safe[k] = typeof v === 'string' && /defendant/i.test(k) ? '[redacted]' : v;
  }
  return `<div class="live-line"><span class="src">[${liveEsc(payload.type || 'event')}]</span> ${liveEsc(redactWorkerAccount(redactDefendantNames(JSON.stringify(safe))))}</div>`;
}

function liveSetStatus(text, isErr) {
  const el = document.getElementById('live-status');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
  const dot = document.getElementById('live-dot');
  if (dot) dot.classList.toggle('on', !isErr);
}

function liveAppend(html) {
  if (!html) return;
  const screen = document.getElementById('live-screen');
  if (!screen) return;
  const empty = screen.querySelector('.live-empty');
  if (empty) empty.remove();
  const atTop = screen.scrollTop < 40;
  screen.insertAdjacentHTML('afterbegin', html);
  while (screen.children.length > LIVE_MAX_LINES) screen.removeChild(screen.lastChild);
  if (atTop) screen.scrollTop = 0;
  liveEventCount++;
  const meta = document.getElementById('live-meta');
  if (meta) meta.textContent = `${liveEventCount} event${liveEventCount === 1 ? '' : 's'}`;
}

const LIVE_CONNECT_TIMEOUT_MS = 8000;
let liveConnectTimeoutTimer = null;

function liveRetry() {
  clearTimeout(liveConnectTimeoutTimer);
  if (liveSource) { liveSource.close(); liveSource = null; }
  clearTimeout(liveReconnectTimer);
  liveReconnectTimer = setTimeout(connectLiveFeed, LIVE_RECONNECT_MS);
}

function connectLiveFeed() {
  if (liveSource) return;
  if (!('EventSource' in window)) { liveSetStatus('unsupported browser', true); return; }
  liveSetStatus('connecting…');
  liveSource = new EventSource(LIVE_URL);
  clearTimeout(liveConnectTimeoutTimer);
  liveConnectTimeoutTimer = setTimeout(() => {
    if (liveSource && liveSource.readyState !== EventSource.OPEN) {
      liveSetStatus('connection blocked or timed out — check ad-blocker/shields, retrying…', true);
      liveRetry();
    }
  }, LIVE_CONNECT_TIMEOUT_MS);
  liveSource.onopen = () => {
    clearTimeout(liveConnectTimeoutTimer);
    liveSetStatus('connected — watching scraper');
  };
  liveSource.onmessage = (e) => liveAppend(liveLineHtml(e.data));
  liveSource.onerror = () => {
    liveSetStatus('disconnected — retrying…', true);
    liveRetry();
  };
}

function renderLiveView() {
  if (liveStarted) return;
  liveStarted = true;
  connectLiveFeed();
}

function disconnectLiveFeed() {
  clearTimeout(liveReconnectTimer);
  clearTimeout(liveConnectTimeoutTimer);
  if (liveSource) { liveSource.close(); liveSource = null; }
  liveStarted = false;
  liveSetStatus('disconnected');
}

function renderDistrictsView() {
  const root = document.getElementById('districts-view');
  const byD = aggregateDistricts();
  const rows = Object.values(byD).sort((a, b) => {
    const an = parseInt(a.key, 10), bn = parseInt(b.key, 10);
    if (!isNaN(an) && !isNaN(bn)) return an - bn;
    return a.district.localeCompare(b.district);
  });

  if (!rows.length) {
    root.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted)">No council district data in current cases.</div>`;
    return;
  }

  const recent = agg.localMonths.slice(-12);

  const princetonTotalFor = key => {
    const m = agg.princetonDistrict[key];
    if (!m) return null;
    let t = 0;
    for (const v of Object.values(m)) t += v;
    return t;
  };

  const scrapedRange   = formatMonthRange(agg.localMonths);
  const princetonRange = formatMonthRange(agg.princetonMonths);
  const scrapedSuffix   = scrapedRange   ? ` ${scrapedRange}`   : '';
  const princetonSuffix = princetonRange ? ` ${princetonRange}` : '';

  let html = `<div class="districts-source-note" title="${escapeAttr(`Scraped = current per-case court records (one row per docket). Princeton = aggregated monthly filing totals${princetonSuffix ? ' (' + princetonRange + ')' : ''} (no dockets). Same kind of evictions counted two different ways, in different time windows — never sum the two columns. ` + SRC_SCRAPED + ' ' + SRC_PRINCETON)}">
    <strong>Cases (Scraped${scrapedSuffix})</strong> and <strong>Filings (Princeton${princetonSuffix})</strong> are <strong>two independent counts of the same kind of evictions</strong> — different sources, different time windows. <strong>Do not add them.</strong>
  </div>
  <table><thead><tr>
    <th title="Metro Nashville council district. ${escapeAttr(SRC_GEOCODED)}">District</th>
    <th title="Council member for the district. ${escapeAttr(SRC_GEOCODED)}">Council Rep</th>
    <th class="num" title="Total cases in the scraped court records${scrapedRange ? ' (' + scrapedRange + ')' : ''}. Independent count from Princeton — do not sum. ${escapeAttr(SRC_SCRAPED)}">Cases (Scraped${scrapedSuffix})</th>
    <th class="num" title="Total filings from Princeton Eviction Lab CSV, summed across all available months${princetonRange ? ' (' + princetonRange + ')' : ''}. Independent count from Scraped — do not sum. ${escapeAttr(SRC_PRINCETON)}">Filings (Princeton${princetonSuffix})</th>
    <th class="num" title="Cases currently in PENDING status. ${escapeAttr(SRC_SCRAPED)}">Pending</th>
    <th class="num" title="Cases with DISMISSED or NONSUIT status. ${escapeAttr(SRC_SCRAPED)}">Dismissed</th>
    <th class="num" title="Distinct census tracts touched by scraped cases in this district. ${escapeAttr(SRC_DERIVED)}">Tracts</th>
    <th title="Sparkline of monthly case counts over the last 12 months. ${escapeAttr(SRC_SCRAPED)}">Last 12 months</th>
  </tr></thead><tbody>`;
  for (const a of rows) {
    const pTot = princetonTotalFor(a.key);
    html += `<tr onclick="showDistrictProfile('${a.district.replace(/'/g, "\\'")}')">`
      + `<td class="district-label" title="${escapeAttr(SRC_GEOCODED)}">${shorten(a.district, 'Council District ')}</td>`
      + `<td class="rep" title="${escapeAttr(SRC_GEOCODED)}">${escapeHtmlSafe(a.rep) || '—'}</td>`
      + `<td class="num" title="Scraped count. ${escapeAttr(SRC_SCRAPED)}">${a.cases}</td>`
      + `<td class="num" title="${pTot == null ? 'No Princeton data for this district yet (fetch may still be pending).' : `Princeton${princetonSuffix} total. ` + escapeAttr(SRC_PRINCETON)}">${pTot == null ? '—' : pTot.toLocaleString()}</td>`
      + `<td class="num" title="Pending count from scraped status. ${escapeAttr(SRC_SCRAPED)}">${a.pending}</td>`
      + `<td class="num" title="Dismissed/Nonsuit count from scraped status. ${escapeAttr(SRC_SCRAPED)}">${a.dismissed}</td>`
      + `<td class="num" title="Distinct census tracts in scraped cases. ${escapeAttr(SRC_DERIVED)}">${a.tracts.size}</td>`
      + `<td title="Scraped monthly counts, last 12 months. ${escapeAttr(SRC_SCRAPED)}">${recent.length ? sparklineHtml(a.months, recent) : '—'}</td>`
      + `</tr>`;
  }
  html += `</tbody></table>`;
  root.innerHTML = html;
}

function escapeHtmlSafe(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function showDistrictProfile(district) {
  const byD = aggregateDistricts();
  const a = byD[district];
  if (!a) return;

  const topList = (obj, n) => Object.entries(obj).sort((x, y) => y[1] - x[1]).slice(0, n);
  const topPlaintiffs = topList(a.plaintiffs, 5);
  const topAttorneys  = topList(a.attorneys, 5);

  const tractCounts = {};
  for (const r of a.rows) {
    if (r.tract_geoid) tractCounts[r.tract_geoid] = (tractCounts[r.tract_geoid] || 0) + 1;
  }
  const topTracts = Object.entries(tractCounts).sort((x, y) => y[1] - x[1]);

  const parseDate = v => {
    const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m ? new Date(+m[3], +m[1] - 1, +m[2]).getTime() : 0;
  };
  const recentCases = [...a.rows].sort((x, y) => parseDate(y.file_date) - parseDate(x.file_date)).slice(0, 10);

  const monthKeys = sortMonthsAsc(Object.keys(a.months));
  const maxMonth = Math.max(1, ...monthKeys.map(m => a.months[m]));

  const esc = escapeHtmlSafe;

  const districtKey = normalizeDistrict(a.district);
  const mss = districtKey ? agg.districtDemographics[districtKey] : null;
  const county = agg.countyTotals;

  // Princeton total filings across all loaded months for this district.
  const princetonMap = districtKey ? agg.princetonDistrict[districtKey] : null;
  let princetonTotal = null;
  if (princetonMap) {
    princetonTotal = 0;
    for (const v of Object.values(princetonMap)) princetonTotal += v;
  }
  const princetonStatus = sources.princeton.status;

  // MSS-derived district context: income, poverty, housing cost burden,
  // employment.
  let demoSection = '';
  if (mss) {
    const fmtUsd = n => n != null ? '$' + Math.round(n).toLocaleString() : '—';
    const fmtPct = n => n != null ? n.toFixed(1) + '%' : '—';
    const fmtNum = n => n != null ? n.toLocaleString() : '—';
    const cmpUsd = d => (d >= 0 ? '+$' : '−$') + Math.abs(Math.round(d)).toLocaleString();
    const cmpPct = d => (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1) + ' pp';
    const cmp = (val, ref, fmtCmp, higherIsWorse=true) => {
      if (val == null || ref == null) return '';
      const diff = val - ref;
      const cls = (diff === 0) ? '' : ((diff > 0) === higherIsWorse ? 'worse' : 'better');
      return `<div class="compare ${cls}">${fmtCmp(diff)} vs county</div>`;
    };

                const safeDocket = String(r.docket || '').replace(/'/g, "\\'");

                  <td style="padding:5px 8px;font-size:11px;color:var(--gold)">${esc(r.docket || '')}</td>

  const wrap = document.createElement('div');

function closeDistrictProfile() {
  const m = document.getElementById('district-modal');
  if (m) m.remove();
  document.removeEventListener('keydown', escCloseDistrictProfile);
}

function escCloseDistrictProfile(e) {
  if (e.key === 'Escape') closeDistrictProfile();
}

function filterCasesByDistrict(d) {
  closeDistrictProfile();
  filters.council_district = d;
  viewMode = 'cases';
  document.querySelectorAll('#view-seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.val === 'cases'));
  updateFilterBtns();
  render();
}

  document.getElementById('table-header').style.display       = isCases     ? '' : 'none';
  document.getElementById('local-table-wrap').style.display   = isCases     ? '' : 'none';
  document.getElementById('districts-view').style.display     = isDistricts ? '' : 'none';
  document.getElementById('timeline-view').style.display      = isTimeline  ? '' : 'none';
  document.getElementById('grid-view').style.display          = isCoverage  ? '' : 'none';
  document.getElementById('map-view').style.display           = isMap       ? '' : 'none';
