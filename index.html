  document.getElementById('live-view').style.display          = isLive      ? '' : 'none';
  document.getElementById('chat-view').style.display          = isChat      ? '' : 'none';
  document.getElementById('timeline-district-group').style.display = isTimeline ? '' : 'none';
  document.getElementById('coverage-mode-group').style.display = isCoverage ? '' : 'none';
  document.getElementById('coverage-dir-group').style.display  = isCoverage ? '' : 'none';
  document.getElementById('map-mode-group').style.display      = isMap      ? '' : 'none';
  document.getElementById('map-layers-group').style.display    = isMap      ? '' : 'none';
  // map-year-group and ll-mode-group are further narrowed (by mapMode /
  // the evictions checkbox) inside renderMapView's own updateMapLayerVisibility
  // — this just forces them off the moment we leave the Map tab entirely.
  if (!isMap) {
    document.getElementById('map-year-group').style.display = 'none';
    document.getElementById('ll-mode-group').style.display  = 'none';
    document.getElementById('ll-signal-group').style.display = 'none';
  }
}

function render() {
  setVisibility();
  if (viewMode === 'live') {
    renderLiveView();
  } else {
    disconnectLiveFeed();
  }
  if (viewMode === 'chat') {
    bootChatView();
  }
  if (viewMode === 'cases') {
    renderLocalTable();
  } else if (viewMode === 'districts') {
    renderDistrictsView();
  } else if (viewMode === 'timeline') {
    renderTimelineView();
  } else if (viewMode === 'coverage') {
    renderCoverageGrid();
  } else if (viewMode === 'map') {
    renderMapView();
  } else if (viewMode === 'sources') {
    renderProvenance();
  }
  updateCoverageHeadline();
}

/* ───────────────────────── Chat with Data (β) ─────────────────────────
   eoreader6.1 (loaded from CDN as ES modules) holds the current snapshot as
   an addressed corpus: every chunk is a span with {span_id, source_id,
   byte_start, byte_end}. Tables and charts are computed mechanically from
   the live rows — never asked of the model. The model only narrates over
   retrieved spans, and every figure it ships is checked against those bytes.
   Provenance: each answer carries clickable span chips; clicking shows the
   exact bytes the answer was grounded in. */

const EO61_CDN = 'https://cdn.jsdelivr.net/gh/clovenbradshaw-ctrl/eoreader6.1@main/packages/host/index.js';
const WEBLLM_CDN = 'https://esm.run/@mlc-ai/web-llm';

let chatApi = null;          // eoreader6 host module, once imported
let chatSession = null;      // eoreader6 session holding the digest corpus
let chatEngine = null;       // WebLLM engine, once loaded
let chatEngineModel = null;  // model id chatEngine was built for
let chatDigestKey = null;    // snapshot key the session was built from
let chatBooting = false;
let chatBusy = false;
let chatTurn = 0;

function chatSetStatus(msg, cls) {
  const dot = document.getElementById('chat-dot');
  const el = document.getElementById('chat-status');
  el.textContent = msg;
  el.classList.toggle('err', cls === 'err');
  dot.className = 'chat-dot' + (cls === 'on' ? ' on' : cls === 'busy' ? ' busy' : cls === 'err' ? ' err' : '');
}

function chatSnapshotKey() {
  return `${allRows.length}|${casesUpdatedAt || ''}`;
}

async function ensureChatEngine() {
  if (!chatApi) {
    chatSetStatus('loading eoreader6.1 from CDN…', 'busy');
    chatApi = await import(EO61_CDN);
  }
  const modelId = document.getElementById('chat-model-select').value;
  if (chatEngine && chatEngineModel === modelId) return;
  if (chatEngine) { try { await chatEngine.unload(); } catch (_) {} chatEngine = null; }
  if (!('gpu' in navigator)) {
    throw new Error('WebGPU not available in this browser — Chat β needs Chrome/Edge 113+ or a WebGPU-capable browser');
  }
  chatSetStatus(`downloading ${modelId} (cached after first load)…`, 'busy');
  const webllm = await import(WEBLLM_CDN);
  chatEngine = await webllm.CreateMLCEngine(modelId, {
    initProgressCallback: p => chatSetStatus(`${p.text || 'loading model'} ${(p.progress * 100 | 0)}%`, 'busy'),
  });
  chatEngineModel = modelId;
}

function chatParseDate(v) {
  const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? new Date(+m[3], +m[1] - 1, +m[2]).getTime() : 0;
}

function chatComputeStats() {
  const statusCounts = {};
  const districtStats = {};
  const monthCounts = {};
  const plaintiffs = {};
  const attorneys = {};
  let minDate = Infinity, maxDate = -Infinity;
  for (const r of allRows) {
    const st = String(r.status || 'UNKNOWN').toUpperCase();
    statusCounts[st] = (statusCounts[st] || 0) + 1;
    const d = r.council_district != null && r.council_district !== '' ? String(r.council_district) : 'unknown';
    const ds = districtStats[d] ||= { total: 0, pending: 0, dismissed: 0 };
    ds.total++;
    if (st === 'PENDING') ds.pending++;
    if (st === 'DISMISSED' || st === 'NONSUIT') ds.dismissed++;
    const t = chatParseDate(r.file_date);
    if (t) { if (t < minDate) minDate = t; if (t > maxDate) maxDate = t; }
    const mk = caseFileDateToMonth(r.file_date);
    if (mk) monthCounts[mk] = (monthCounts[mk] || 0) + 1;
    const pl = String(r.Plaintiff_1 || '').trim();
    if (pl) plaintiffs[pl] = (plaintiffs[pl] || 0) + 1;
    const at = String(r.Attorney || '').trim();
    if (at) attorneys[at] = (attorneys[at] || 0) + 1;
  }
  const top = (obj, n) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n);
  return {
    total: allRows.length,
    statusCounts, districtStats, monthCounts,
    topPlaintiffs: top(plaintiffs, 10),
    topAttorneys: top(attorneys, 10),
    dateRange: minDate === Infinity ? null : {
      from: new Date(minDate).toISOString().slice(0, 10),
      to: new Date(maxDate).toISOString().slice(0, 10),
    },
  };
}

function buildChatDigestText() {
  const s = chatComputeStats();
  const L = [];
  L.push('NASHVILLE EVICTION CASE DATA — DIGEST OF THE LIVE SNAPSHOT');
  L.push(`Total cases (unique dockets): ${s.total.toLocaleString()}`);
  if (s.dateRange) L.push(`Filing dates span ${s.dateRange.from} through ${s.dateRange.to}`);
  L.push(`Snapshot fetched: ${(casesUpdatedAt || 'unknown').slice(0, 19).replace('T', ' ')} UTC`);
  L.push('');
  L.push('CASES BY STATUS:');
  for (const [k, v] of Object.entries(s.statusCounts).sort((a, b) => b[1] - a[1])) L.push(`  ${k}: ${v.toLocaleString()}`);
  L.push('');
  L.push('CASES BY COUNCIL DISTRICT (total / pending / dismissed+nonsuit):');
  for (const [d, v] of Object.entries(s.districtStats).sort((a, b) => (+a[0] || 99) - (+b[0] || 99))) {
    L.push(`  District ${d}: ${v.total.toLocaleString()} / ${v.pending.toLocaleString()} / ${v.dismissed.toLocaleString()}`);
  }
  L.push('');
  L.push('CASES BY MONTH FILED:');
  for (const [m, v] of sortMonthsAsc(Object.keys(s.monthCounts)).map(k => [k, s.monthCounts[k]])) {
    L.push(`  ${m}: ${v.toLocaleString()}`);
  }
  L.push('');
  L.push('TOP PLAINTIFFS (filers) BY CASE COUNT:');
  for (const [name, n] of s.topPlaintiffs) L.push(`  ${name}: ${n.toLocaleString()}`);
  L.push('');
  L.push('TOP ATTORNEYS (plaintiff counsel) BY CASE COUNT:');
  for (const [name, n] of s.topAttorneys) L.push(`  ${name}: ${n.toLocaleString()}`);
  if (princetonRows && princetonRows.length) {
    L.push('');
    L.push(`PRINCETON EVICTION LAB MONTHLY FILINGS${formatMonthRange(agg.princetonMonths) ? ' ' + formatMonthRange(agg.princetonMonths) : ''} (filings, NOT the same count as cases above — never sum them):`);
    const pm = {};
    for (const r of princetonRows) {
      const key = String(r.month || '');
      if (!key) continue;
      pm[key] = (pm[key] || 0) + Number(r.filings || r.filed || 0);
    }
    for (const m of sortMonthsAsc(Object.keys(pm))) L.push(`  ${m}: ${pm[m].toLocaleString()}`);
  }
  const demo = agg.districtDemographics || {};
  if (Object.keys(demo).length) {
    L.push('');
    L.push('DISTRICT DEMOGRAPHICS (Metro Social Services, Know Your Community 2026):');
    for (const d of Object.keys(demo).sort((a, b) => (+a) - (+b))) {
      const x = demo[d];
      L.push(`  District ${d}: population ${x.population != null ? x.population.toLocaleString() : '?'}`
        + `, median household income ${x.income && x.income.median_household_income != null ? '$' + Math.round(x.income.median_household_income).toLocaleString() : '?'}`
        + `, poverty rate ${x.poverty && x.poverty.pct_total_poverty != null ? x.poverty.pct_total_poverty.toFixed(1) + '%' : '?'}`
        + `, median monthly rent ${x.housing && x.housing.median_monthly_rent != null ? '$' + Math.round(x.housing.median_monthly_rent).toLocaleString() : '?'}`);
    }
  }
  L.push('');
  L.push('NOTES: Defendant names are encrypted and excluded from this digest. Plaintiff and attorney names are public court record fields.');
  return L.join('\n');
}

async function ensureChatSession(force) {
  const key = chatSnapshotKey();
  if (!force && chatSession && chatDigestKey === key) return;
  if (!chatApi) throw new Error('engine not loaded');
  chatSession = chatApi.createSession({});
  const text = buildChatDigestText();
  const sourceId = `eviction-snapshot[${key}]`;
  const res = chatApi.admitChunked(chatSession, { text, sourceId, language: 'en' });
  chatDigestKey = key;
  document.getElementById('chat-spans').textContent =
    `${res.chunks} spans · ${text.length.toLocaleString()} bytes · ${allRows.length.toLocaleString()} cases indexed`;
}

async function bootChatView() {
  if (chatBooting || (chatApi && chatSession && chatEngine)) { renderChatSuggestions(); return; }
  if (chatBooting) return;
  chatBooting = true;
  try {
    await ensureChatEngine();
    await ensureChatSession(false);
    chatSetStatus(`ready — ${chatEngineModel}`, 'on');
    renderChatSuggestions();
  } catch (e) {
    console.warn('[eo/chat] boot failed:', e);
    chatSetStatus(e.message, 'err');
  } finally {
    chatBooting = false;
  }
}

async function rebuildChatDigest() {
  const btn = document.getElementById('chat-rebuild');
  btn.disabled = true;
  try {
    await ensureChatSession(true);
    chatSetStatus(`re-indexed — ${chatEngineModel || 'model pending'}`, chatEngine ? 'on' : '');
  } catch (e) {
    chatSetStatus(e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

/* Mechanical answers — computed from live state, never asked of a model. */
function detectChatArtifact(q) {
  const wantsChart = /\b(chart|plot|graph|bar\b|visuali[sz]e|trend)/i.test(q);
  const wantsTable = /\b(table|tabulate|list|break\s?down|breakdown|show|rank)/i.test(q);
  if (!wantsChart && !wantsTable) return null;
  let subject = null;
  if (/plaintiff/i.test(q)) subject = 'plaintiffs';
  else if (/attorney|counsel/i.test(q)) subject = 'attorneys';
  else if (/status|pending|dismissed|nonsuit/i.test(q)) subject = 'status';
  else if (/demograph|poverty|income|rent|population/i.test(q)) subject = 'demographics';
  else if (/month|trend|over time|timeline/i.test(q)) subject = 'months';
  else if (/district|council/i.test(q)) subject = 'district';
  if (!subject) return null;
  const kind = wantsChart ? 'chart' : 'table';
  const s = chatComputeStats();
  const provQuery = {
    district: 'CASES BY COUNCIL DISTRICT',
    status: 'CASES BY STATUS',
    months: 'CASES BY MONTH FILED',
    plaintiffs: 'TOP PLAINTIFFS',
    attorneys: 'TOP ATTORNEYS',
    demographics: 'DISTRICT DEMOGRAPHICS',
  }[subject];
  if (subject === 'district') {
    const items = Object.entries(s.districtStats)
      .sort((a, b) => (+a[0] || 99) - (+b[0] || 99))
      .map(([d, v]) => ({
        label: `District ${d}`, value: v.total,
        cells: [`District ${d}`, v.total.toLocaleString(), v.pending.toLocaleString(), v.dismissed.toLocaleString()],
      }));
    return { kind, title: 'Cases by council district', head: ['District', 'Cases', 'Pending', 'Dismissed'], rows: items, provQuery };
  }
  if (subject === 'status') {
    const items = Object.entries(s.statusCounts).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => ({ label: k, value: v, cells: [k, v.toLocaleString()] }));
    return { kind, title: 'Cases by status', head: ['Status', 'Cases'], rows: items, provQuery };
  }
  if (subject === 'months') {
    const items = sortMonthsAsc(Object.keys(s.monthCounts)).map(m => ({ label: m, value: s.monthCounts[m], cells: [m, s.monthCounts[m].toLocaleString()] }));
    return { kind, title: 'Cases by month filed', head: ['Month', 'Cases'], rows: items, provQuery };
  }
  if (subject === 'plaintiffs') {
    const items = s.topPlaintiffs.map(([name, n]) => ({ label: name, value: n, cells: [name, n.toLocaleString()] }));
    return { kind, title: 'Top plaintiffs by case count', head: ['Plaintiff', 'Cases'], rows: items, provQuery };
  }
  if (subject === 'attorneys') {
    const items = s.topAttorneys.map(([name, n]) => ({ label: name, value: n, cells: [name, n.toLocaleString()] }));
    return { kind, title: 'Top attorneys by case count', head: ['Attorney', 'Cases'], rows: items, provQuery };
  }
  if (subject === 'demographics') {
    const demo = agg.districtDemographics || {};
    const items = Object.keys(demo).sort((a, b) => (+a) - (+b)).map(d => {
      const x = demo[d];
      const pop = x.population != null ? x.population.toLocaleString() : '—';
      const pov = x.poverty && x.poverty.pct_total_poverty != null ? x.poverty.pct_total_poverty.toFixed(1) + '%' : '—';
      const inc = x.income && x.income.median_household_income != null ? '$' + Math.round(x.income.median_household_income).toLocaleString() : '—';
      return { label: `District ${d}`, value: x.population, cells: [`District ${d}`, pop, pov, inc] };
    });
    return { kind, title: 'District demographics (MSS 2026)', head: ['District', 'Population', 'Poverty rate', 'Median HH income'], rows: items, provQuery };
  }
  return null;
}

function artifactHtml(a) {
  let body = '';
  if (a.kind === 'table') {
    body = `<div class="artifact-table-wrap"><table><thead><tr>${
      a.head.map((h, i) => `<th${i > 0 ? ' class="num"' : ''}>${escapeHtmlSafe(h)}</th>`).join('')
    }</tr></thead><tbody>${
      a.rows.map(r => `<tr>${r.cells.map((c, i) =>
        `<td${i === 0 ? ' class="row-label"' : ' class="num"'}>${escapeHtmlSafe(c)}</td>`
      ).join('')}</tr>`).join('')
    }</tbody></table></div>`;
  } else {
    const max = Math.max(1, ...a.rows.map(r => r.value || 0));
    const rowH = 22, padL = 150, padR = 56, w = 720;
    const h = a.rows.length * rowH + 10;
    const bars = a.rows.map((r, i) => {
      const y = i * rowH + 5;
      const bw = Math.max(2, ((r.value || 0) / max) * (w - padL - padR));
      return `<rect class="bar" x="${padL}" y="${y}" width="${bw.toFixed(1)}" height="${rowH - 8}" rx="2"><title>${escapeHtmlSafe(r.label)}: ${(r.value || 0).toLocaleString()}</title></rect>`
        + `<text class="bar-label" x="${padL - 8}" y="${y + rowH / 2 - 2}" text-anchor="end">${escapeHtmlSafe(String(r.label).slice(0, 24))}</text>`
        + `<text class="bar-value" x="${padL + bw + 6}" y="${y + rowH / 2 - 2}">${(r.value || 0).toLocaleString()}</text>`;
    }).join('');
    body = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img">${bars}</svg>`;
  }
  return `<div class="artifact-title">${escapeHtmlSafe(a.title)}</div>${body}`;
}

const CHAT_SYSTEM_PROMPT = [
  'You answer questions about Nashville eviction case data using ONLY the numbered data excerpts provided in the user message.',
  'Rules:',
  '- Cite the excerpt you used for every factual claim, in the form [1], [2].',
  '- Never invent numbers, names, districts, or dates. If the excerpts do not contain the answer, say exactly what is missing.',
  '- Do not add scraped+Princeton counts together; they are different measures.',
  '- Keep answers short: 1-3 sentences unless asked to enumerate.',
].join('\n');

function linkCitations(html, spans) {
  return html.replace(/\[(\d)\]/g, (m, d) => {
    const i = +d - 1;
    if (!spans[i]) return m;
    return `<button type="button" class="cite-chip" data-span-id="${escapeHtmlSafe(spans[i].span_id)}">[${d}]</button>`;
  });
}

function verifyNumbers(text, groundText) {
  const cites = [];
  const masked = text.replace(/\[\d+\]/g, m => { cites.push(m); return '\u0000'; });
  const ground = new Set();
  for (const m of groundText.matchAll(/\d[\d,]*(?:\.\d+)?%?/g)) ground.add(m[0]);
  const checked = masked.replace(/\b\d[\d,]*(?:\.\d+)?%?\b/g, m =>
    ground.has(m) ? m : `<span class="unverified-num" title="this figure was not found in the cited data excerpts">${m}</span>`);
  return checked.replace(/\u0000/g, () => cites.shift());
}

function addChatMessage(role, html, provHtml) {

  div.innerHTML = `<div class="who">${who}</div><div class="bubble">${html}</div>${provHtml || ''}`;

async function askChat(q) {
  if (chatBusy) return;
  addChatMessage('user', escapeHtmlSafe(q));
  const myTurn = ++chatTurn;

  const artifact = detectChatArtifact(q);
  if (artifact && chatApi && chatSession) {
    const hits = chatApi.searchSpans(chatSession, { query: artifact.provQuery, limit: 1 }).spans;
    const sp = hits[0];
    const prov = `<div class="prov-strip"><span class="prov-label">provenance</span>`
      + `<span class="prov-note">computed mechanically from ${allRows.length.toLocaleString()} live rows — no model involved</span>`
      + (sp ? spanChipHtml(sp) : '')
      + `</div>`;
    addChatMessage('assistant', artifactHtml(artifact), prov);
    return;
  }

  if (!chatEngine || !chatSession) {
    addChatMessage('error', escapeHtmlSafe('Not ready yet — ' + document.getElementById('chat-status').textContent));
    return;
  }

  chatBusy = true;
  document.getElementById('chat-send').disabled = true;
  chatSetStatus('thinking…', 'busy');
  try {
    await ensureChatSession(false);
    const { spans } = chatApi.searchSpans(chatSession, { query: q, limit: 6 });
    if (!spans.length) {
      addChatMessage('assistant', escapeHtmlSafe('No part of the indexed snapshot matches that question. Try asking about districts, statuses, months, plaintiffs, attorneys, or demographics.'));
      return;
    }
    const units = chatApi.spanUnits(chatSession, spans);
    const folded = chatApi.foldSpans(chatSession, { units, query: q, tokenBudget: 2200, maxUnits: 6 });
    const context = folded.selected.map((u, i) => `[${i + 1}] ${u.text}`).join('\n\n');
    const response = await chatEngine.chat.completions.create({
      messages: [
        { role: 'system', content: CHAT_SYSTEM_PROMPT },
        { role: 'user', content: `Question: ${q}\n\nDATA EXCERPTS:\n${context}` },
      ],
      temperature: 0.2,
      max_tokens: 600,
    });
    if (myTurn !== chatTurn) return;
    let answer = (response.choices[0].message.content || '').trim();
    answer = escapeHtmlSafe(answer);
    answer = verifyNumbers(answer, context);
    answer = linkCitations(answer, folded.selected);
    answer = `<p>${answer.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>')}</p>`;
    const prov = `<div class="prov-strip"><span class="prov-label">provenance</span>${
      folded.selected.map(u => spanChipHtml(u.meta)).join('')
    }<span class="prov-note">figures underlined ⚠ were not found in these excerpts</span></div>`;
    addChatMessage('assistant', answer, prov);
    chatSetStatus(`ready — ${chatEngineModel}`, 'on');
  } catch (e) {
    console.warn('[eo/chat] turn failed:', e);
    addChatMessage('error', escapeHtmlSafe(e.message || String(e)));
    chatSetStatus(e.message, 'err');
  } finally {
    chatBusy = false;
    document.getElementById('chat-send').disabled = false;
  }
}

/* ───────────────────────── Princeton CSV fetch ─────────────────────────
   The Eviction Lab publishes its Eviction Tracking System counts as a single
   nationwide tract-month CSV covering all the sites it tracks. Two properties
   of that file shape everything below.

   1. S3 serves it with `Access-Control-Allow-Origin: *`, so the browser fetches
      it directly and no CORS proxy sits in the path. The proxy route this used
      to take was actively harmful: it answered 200 with the upstream's error
      page as the body, so a dead source URL looked like a successful fetch that
      merely happened to parse to zero rows. Every check below therefore
      verifies the *content*, not just the status code.

   2. It is ~67 MB, and Nashville is ~14k of its millions of rows. The rows are
      sorted by city, so Nashville is one contiguous byte block. We binary-search
      the city column with HTTP Range requests to find that block's bounds and
      download only it — under a megabyte. If the host won't serve ranges we
      fall back to streaming the whole file and filtering rows as they arrive,
      so even the slow path never holds 67 MB in memory.

   Note the filename says 2020_2021 but the file is still maintained and now
   runs through the current month. That is the whole reason the coverage grid
   has something to compare against: our scrape and Eviction Lab's counts cover
   the same months, not disjoint eras. */

// Still used by the TIGERweb tract-boundary fetch, which has no CORS headers.
const N8N_PROXY = 'https://n8n.intelechia.com/webhook/feed';

function bgStatus(msg, active=false) {
  const el = document.getElementById('bg-sync');
  el.textContent = msg || '';
  el.classList.toggle('active', active);
}

function pxProxy(url) { return `${N8N_PROXY}?url=${encodeURIComponent(url)}`; }

const _utf8 = new TextDecoder();
const NL = 10; // '\n'

// Thrown when the host answers a Range request with the whole body. Signals the
// caller to abandon the slice strategy and stream instead.
class RangeUnsupported extends Error {}

async function etsBytes(start, end) {
  const r = await fetch(ETS_MONTHLY_CSV, { headers: { Range: `bytes=${start}-${end}` } });
  if (r.status === 200) throw new RangeUnsupported('server ignored Range');
  if (r.status !== 206) throw new Error(`range HTTP ${r.status}`);
  return new Uint8Array(await r.arrayBuffer());
}

// The city is the first CSV field and is double-quoted (it contains a comma).
function cityOfLine(line) {
  if (line[0] === '"') {
    const close = line.indexOf('"', 1);
    return close === -1 ? line.slice(1) : line.slice(1, close);
  }
  const comma = line.indexOf(',');
  return comma === -1 ? line : line.slice(0, comma);
}

/* City of the first whole line at or after `pos`. Landing mid-line is the norm —
   a byte offset from a bisection almost never falls on a boundary — so anywhere
   but the very start of the data we skip to just past the next newline and read
   the line that begins there. Returns null past the last line. */
async function etsCityAtOrAfter(pos, dataStart, size) {
  let window = 4096;
  while (pos < size) {
    const end = Math.min(size - 1, pos + window - 1);
    const buf = await etsBytes(pos, end);
    let from = 0;
    if (pos > dataStart) {
      const nl = buf.indexOf(NL);
      if (nl === -1) {                    // no line boundary in view — widen
        if (end >= size - 1) return null;
        window *= 4;
        continue;
      }
      from = nl + 1;
    }
    const lineEnd = buf.indexOf(NL, from);
    if (lineEnd === -1 && end < size - 1) { window *= 4; continue; }
    const line = buf.subarray(from, lineEnd === -1 ? buf.length : lineEnd);
    if (!line.length) return null;
    return cityOfLine(_utf8.decode(line));
  }
  return null;
}

/* Bracket the target site's block by bisecting the city column. Deliberately
   approximate: it stops once the bracket is within ETS_BISECT_STOP bytes rather
   than converging on the exact line, which halves the round trips and costs
   nothing, because the caller pads outward and then trims by city anyway.
   A probe past the end of the file sorts after everything, which keeps the
   comparison total and the bisection well-defined. */
const ETS_BISECT_STOP = 1024;
const ETS_SLICE_PAD   = 1 << 16;

async function etsFindSiteBounds(dataStart, size) {
  const cityAt = async pos => (await etsCityAtOrAfter(pos, dataStart, size)) ?? '\uffff';

  let lo = dataStart, hi = size;
  while (hi - lo > ETS_BISECT_STOP) {
    const mid = Math.floor((lo + hi) / 2);
    if (await cityAt(mid) < ETS_SITE) lo = mid; else hi = mid;
  }
  const blockLo = lo;

  hi = size;
  while (hi - lo > ETS_BISECT_STOP) {
    const mid = Math.floor((lo + hi) / 2);
    if (await cityAt(mid) <= ETS_SITE) lo = mid; else hi = mid;
  }
  return { lo: blockLo, hi };
}

/* Download the bracketed block plus a margin, then cut it back to exactly the
   site's lines. Both edges of the window are almost certainly partial lines, so
   they're dropped before anything is read. The margin is what makes the result
   trustworthy rather than merely plausible: seeing a non-matching line on each
   side of the block is proof the block wasn't clipped, and if we don't see one,
   we widen and try again instead of quietly returning a short slice.
   Returns null when the site isn't in the file at all — renamed, or dropped
   from the tracking system — which sends the caller to the streaming path. */
async function etsSliceSite(dataStart, size) {
  let pad = ETS_SLICE_PAD;
  for (let attempt = 0; attempt < 3; attempt++) {
    const b = await etsFindSiteBounds(dataStart, size);
    const start = Math.max(dataStart, b.lo - pad);
    const end   = Math.min(size - 1, b.hi + pad);
    const lines = _utf8.decode(await etsBytes(start, end)).split('\n');
    if (start > dataStart) lines.shift();
    if (end < size - 1) lines.pop();

    const first = lines.findIndex(l => cityOfLine(l) === ETS_SITE);
    if (first === -1) return null;
    let last = lines.length - 1;
    while (last > first && cityOfLine(lines[last]) !== ETS_SITE) last--;

    const boundedLeft  = first > 0 || start === dataStart;
    const boundedRight = last < lines.length - 1 || end === size - 1;
    if (boundedLeft && boundedRight) return lines.slice(first, last + 1).join('\n');
    pad *= 8;   // block ran to an edge of the window — we may have clipped it
  }
  return null;
}

// Parse a headerless slice of the CSV by prepending the real header line.
async function etsParseSlice(headerLine, text) {
  await loadScript(PAPAPARSE_URL);
  const parsed = Papa.parse(headerLine + '\n' + text, {
    header: true, skipEmptyLines: true, dynamicTyping: true,
  });
  return parsed.data;
}

/* Whole-file fallback: stream the CSV, keep only the target site's lines, and
   discard the rest as it arrives, so the full 67 MB never lands in memory at
   once. Used when Range isn't honoured, the total size can't be read, or the
   site block can't be located. Returns the header line with the body — the
   header is the stream's first line, so fetching it separately would be waste.
   The file is city-sorted, so the scan stops at the first line past the block
   rather than reading to the end. */
async function etsStreamSiteLines() {
  const r = await fetch(ETS_MONTHLY_CSV);
  if (!r.ok) throw new Error(`csv HTTP ${r.status}`);
  if (!r.body) {
    const all = (await r.text()).split('\n');
    return { headerLine: all[0], body: all.filter(l => cityOfLine(l) === ETS_SITE).join('\n') };
  }

  const reader = r.body.getReader();
  const kept = [];
  let carry = '', headerLine = null, done = false, seen = 0, past = false;
  while (!done) {
    const chunk = await reader.read();
    done = chunk.done;
    if (!chunk.value) continue;
    seen += chunk.value.length;
    carry += _utf8.decode(chunk.value, { stream: true });
    const lines = carry.split('\n');
    carry = lines.pop();
    for (const line of lines) {
      if (headerLine === null) { headerLine = line; continue; }
      if (!line) continue;
      if (cityOfLine(line) === ETS_SITE) { kept.push(line); past = true; }
      else if (past) { done = true; break; }
    }
    bgStatus(`Scanning Eviction Lab CSV… ${(seen / 1048576).toFixed(0)} MB`, true);
  }
  reader.cancel().catch(() => {});
  if (carry && cityOfLine(carry) === ETS_SITE) kept.push(carry);
  return { headerLine, body: kept.join('\n') };
}

// A zero-row parse should never be mistaken for "the source had nothing to say",
// so confirm the file is still shaped the way the rest of this code assumes.
function assertEtsColumns(headerLine) {
  const cols = String(headerLine || '').split(',').map(c => c.trim());
  for (const want of ETS_EXPECTED_COLS) {
    if (!cols.includes(want)) {
      throw new Error(`unexpected CSV layout (no "${want}" column) — source may have moved`);
    }
  }
}

/* Fetch the site's tract-month rows: ranged slice where possible, streaming
   scan otherwise, with the file's shape verified either way.

   The total size comes from a HEAD rather than from the Content-Range of a
   ranged GET. Content-Range is not a CORS-safelisted response header, so a
   cross-origin page reads it back as null however plainly the server sent it;
   Content-Length is safelisted and readable. Without a size there is nothing to
   bisect over, so that case goes straight to the stream. */
async function fetchPrincetonCsvRows() {
  let size = NaN;
  try {
    const h = await fetch(ETS_MONTHLY_CSV, { method: 'HEAD' });
    if (h.ok) size = Number(h.headers.get('Content-Length'));
  } catch (e) {
    console.warn('[ets] HEAD failed, will stream:', e.message);
  }

  let headerLine = null, body = null;
  if (Number.isFinite(size) && size > 0) {
    try {
      const probe = await fetch(ETS_MONTHLY_CSV, { headers: { Range: 'bytes=0-1023' } });
      if (!probe.ok) throw new Error(`csv HTTP ${probe.status}`);
      if (probe.status !== 206) {
        // Range ignored — this response is the whole file. Drop it unread and
        // let the streaming path fetch it again without buffering.
        if (probe.body) probe.body.cancel().catch(() => {});
      } else {
        headerLine = (await probe.text()).split('\n')[0];
        assertEtsColumns(headerLine);
        bgStatus(`Locating ${ETS_SITE} in the Eviction Lab CSV…`, true);
        body = await etsSliceSite(headerLine.length + 1, size);
      }
    } catch (e) {
      if (!(e instanceof RangeUnsupported)) console.warn('[ets] slice failed, streaming instead:', e.message);
      body = null;
    }
  }

  if (body == null) ({ headerLine, body } = await etsStreamSiteLines());
  assertEtsColumns(headerLine);

  const rows = (await etsParseSlice(headerLine, body))
    .filter(r => r.city === ETS_SITE && r.GEOID && r.month);
  if (!rows.length) throw new Error(`no ${ETS_SITE} rows found in Eviction Lab CSV`);
  return rows;
}

function refreshSnapshotUi() {
  updateCoverageHeadline();
  updateSubtitle();
  if (viewMode !== 'cases') render();
}

// The file is republished as new months close, so revalidate weekly.
const PRINCETON_TTL_MS = 7 * 24 * 60 * 60 * 1000;

async function kickBackgroundSync() {
  let usedCache = false;
  try {
    const cached = await localCache.get(CACHE_FILES.princeton);
    if (cached && Array.isArray(cached.rows) && cached.rows.length) {
      princetonRows = cached.rows;
      rebuildPrincetonAggregates();
      markSource('princeton', { status: 'ok', rows: princetonRows.length, fromCache: true });
      refreshSnapshotUi();
      usedCache = true;
      if (Date.now() - (cached.savedAt || 0) < PRINCETON_TTL_MS) return;
    }

    bgStatus('Fetching Eviction Lab CSV…', true);
    const rows = await fetchPrincetonCsvRows();
    princetonRows = rows;
    rebuildPrincetonAggregates();
    markSource('princeton', { status: 'ok', rows: rows.length });
    console.info(`[eo] eviction lab csv: ${rows.length} rows · ${agg.princetonMonths.length} months `
      + `(${formatMonthRange(agg.princetonMonths) || 'none'}) · ${Object.keys(agg.princetonTract).length} tracts`);
    refreshSnapshotUi();
    localCache.put(CACHE_FILES.princeton, { rows });
    bgStatus(`Eviction Lab: ${rows.length.toLocaleString()} tract-months loaded`, false);
    setTimeout(() => bgStatus(''), 3000);
  } catch (e) {
    console.warn('Eviction Lab CSV fetch failed:', e);
    if (!usedCache) markSource('princeton', { status: 'failed', error: e.message });
    bgStatus(`Eviction Lab fetch failed: ${e.message}`, false);
    setTimeout(() => bgStatus(''), 5000);
  }
}

/* ───────────────────────── CSV export ─────────────────────────
   Two scopes: 'filtered' (current search + filters) and 'all'.
   ENC: fields are decrypted when unlocked, otherwise emitted as empty.
   Decryption runs concurrently across all rows for one cell key at a time. */

let exportInFlight = false;

function toggleExportMenu() {
  const menu = document.getElementById('export-menu');
  if (menu.style.display !== 'none') { menu.style.display = 'none'; return; }
  const filtered = getFiltered().length;
  const total = allRows.length;
  const redactedNote = isUnlocked()
    ? 'Logged in — encrypted fields will be decrypted.'
    : 'Not logged in — encrypted fields will be blank.';
  menu.innerHTML = `
    <div class="item" onclick="runExport('filtered')">
      <span>Filtered cases</span><span class="count">${filtered}</span>
    </div>
    <div class="item" onclick="runExport('all')">
      <span>All cases</span><span class="count">${total}</span>
    </div>
    <div class="note">${redactedNote}</div>`;
  menu.style.display = 'block';
}

function closeExportMenu() {
  document.getElementById('export-menu').style.display = 'none';
}

async function runExport(scope) {
  if (exportInFlight) return;
  closeExportMenu();
  const btn = document.getElementById('export-btn');
  exportInFlight = true;
  btn.disabled = true;
  btn.textContent = 'Exporting…';
  try {
    const rows = scope === 'filtered' ? getFiltered() : allRows;
    const csv = await buildCsv(rows);
    const stamp = new Date().toISOString().slice(0, 10);
    const suffix = isUnlocked() ? '' : '-redacted';
    downloadCsv(csv, `eviction-cases-${scope}-${stamp}${suffix}.csv`);
  } catch (e) {
    console.warn('[eo] export failed:', e);
    alert('Export failed: ' + e.message);
  } finally {
    exportInFlight = false;
    btn.disabled = false;
    btn.textContent = 'Export ▾';
  }
}

async function buildCsv(rows) {
  // PapaParse is lazy-loaded; ensure it's available before unparse().
  await loadScript(PAPAPARSE_URL);
  // Union of all keys across rows. 'docket' first, then the priority fields
  // that already drive the record panel, then everything else alphabetically.
  const keySet = new Set();
  for (const r of rows) for (const k of Object.keys(r)) keySet.add(k);
  const PRIORITY = [
    'docket', 'status', 'file_date', 'Plaintiff_1', 'Attorney',
    'address_formatted', 'council_district', 'council_rep',
    'state_house_district', 'us_congressional_district',
    'census_geoid', 'tract_geoid', 'census_name',
  ];
  const cols = [];
  const seen = new Set();
  for (const k of PRIORITY) if (keySet.has(k)) { cols.push(k); seen.add(k); }
  for (const k of [...keySet].sort()) {
    if (k === 'judgment_bucket') continue;
    if (!seen.has(k)) cols.push(k);
  }

  const unlocked = isUnlocked();
  const out = new Array(rows.length);
  for (let i = 0; i < rows.length; i++) out[i] = {};

  // Resolve cell values per column. ENC: cells in the same column get
  // decrypted in parallel; plain cells fill in synchronously.
  for (const k of cols) {
    // Belt-and-suspenders: defendant fields are already encrypted in the
    // source, but if a plaintext defendant column ever shows up we still
    // refuse to leak it without a login.
    const forceBlank = !unlocked && /^defendant/i.test(k);
    const encJobs = [];
    for (let i = 0; i < rows.length; i++) {
      const v = rows[i][k];
      if (forceBlank) { out[i][k] = ''; continue; }
      if (v == null || v === '') { out[i][k] = ''; continue; }
      if (isEncrypted(v)) {
        if (unlocked) {
          encJobs.push(decryptValue(v, unlockKeyPassword).then(p => {
            out[i][k] = p == null ? '' : p;
          }));
        } else {
          out[i][k] = '';
        }
      } else if (typeof v === 'object') {
        out[i][k] = JSON.stringify(v);
      } else {
        out[i][k] = String(v);
      }
    }
    if (encJobs.length) await Promise.all(encJobs);
  }

  return Papa.unparse(out, { columns: cols });
}

function downloadCsv(text, filename) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Metro Social Services district demographics — pre-aggregated by district,
   so much cheaper and more accurate than summing tract data ourselves. Lives
   on the same plain-text repo as cases.json so no CORS proxy needed. */
async function kickMssDemographicsSync() {
  try {
    bgStatus('Fetching MSS district demographics…', true);
    const r = await fetch(MSS_DEMOGRAPHICS_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    agg.districtDemographics = data.districts || {};
    agg.countyTotals = data.county_totals || null;
    const n = Object.keys(agg.districtDemographics).length;
    markSource('mss', { status: 'ok', rows: n });
    console.info(`[eo] MSS demographics: ${n} districts loaded`);
    bgStatus(`MSS: ${n} districts loaded`, false);
    setTimeout(() => bgStatus(''), 3000);
  } catch (e) {
    console.warn('MSS demographics fetch failed:', e);
    markSource('mss', { status: 'failed', error: e.message });
    bgStatus(`MSS fetch failed: ${e.message}`, false);
    setTimeout(() => bgStatus(''), 5000);
  }
}

/* ───────────────────────── Boot ───────────────────────── */

document.addEventListener("click", e => {
  if (activeDropdown && !e.target.closest(".filter-btn") && !e.target.closest(".dropdown")) {
    document.getElementById("dd-" + activeDropdown).style.display = "none";
    activeDropdown = null;
  }
  if (!e.target.closest(".export-wrap")) closeExportMenu();
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const modal = document.getElementById("login-modal");
  if (modal && modal.style.display !== "none") { closeLoginModal(); return; }
  if (selectedRecordDocket) { closeRecordPanel(); return; }
  if (selectedTract) { closeTractPanel(); }
});

// Debounced so each keystroke doesn't re-sort + re-render the full table —
// the difference is dramatic on mobile.
(function () {
  let t = null;
  document.getElementById("search").addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(render, 200);
  });
})();
loadData();
</script>
